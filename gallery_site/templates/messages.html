<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>留言板 · GALLERY</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Noto+Sans+SC:wght@300;400;500&family=Cormorant+Garamond:wght@300;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf9f7; --surface: #ffffff; --text: #1a1a1a;
    --text-muted: #8a8680; --accent: #c8a97e; --border: #e8e4df; --nav-h: 64px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans SC', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  nav {
    position: sticky; top: 0; z-index: 100; height: var(--nav-h);
    background: rgba(250,249,247,0.92); backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 32px;
  }
  .nav-logo { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 600; letter-spacing: 0.15em; color: var(--text); text-decoration: none; margin-right: auto; }
  .nav-links { display: flex; gap: 8px; }
  .nav-links a { font-size: 13px; color: var(--text-muted); text-decoration: none; padding: 8px 14px; border-radius: 20px; transition: all 0.2s; }
  .nav-links a:hover { color: var(--text); background: var(--border); }

  .hero-banner {
    background: linear-gradient(135deg, #1a1208 0%, #4a3018 50%, #8b6540 100%);
    height: 240px; display: flex; align-items: center; justify-content: center; text-align: center;
    position: relative; overflow: hidden;
  }
  .hero-banner::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, rgba(200,169,126,0.15) 0%, transparent 70%);
  }
  .hero-banner h1 { font-family: 'Playfair Display', serif; font-size: 52px; color: white; position: relative; }
  .hero-banner p { color: rgba(255,255,255,0.6); font-size: 15px; margin-top: 12px; font-weight: 300; position: relative; }
  .hero-banner-inner { position: relative; z-index: 1; }

  .main { max-width: 780px; margin: 0 auto; padding: 48px 24px 80px; }

  .form-card {
    background: white; border-radius: 20px; padding: 32px;
    border: 1px solid var(--border); margin-bottom: 40px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.04);
  }
  .form-card h2 { font-family: 'Playfair Display', serif; font-size: 24px; margin-bottom: 24px; }
  .form-card h2 span { color: var(--accent); }
  .form-field { margin-bottom: 16px; }
  .form-field label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; letter-spacing: 0.05em; }
  .form-field input, .form-field textarea {
    width: 100%; padding: 12px 16px;
    border: 1px solid var(--border); border-radius: 10px;
    font-family: inherit; font-size: 14px; background: var(--bg);
    outline: none; transition: border-color 0.2s; resize: vertical;
  }
  .form-field input:focus, .form-field textarea:focus { border-color: var(--accent); background: white; }
  .submit-btn {
    width: 100%; padding: 14px; background: var(--text); color: white;
    border: none; border-radius: 12px; font-size: 15px; font-family: inherit;
    cursor: pointer; transition: all 0.2s; letter-spacing: 0.05em;
  }
  .submit-btn:hover { background: var(--accent); }
  .submit-note { text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 12px; }

  .messages-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .messages-header h2 { font-family: 'Playfair Display', serif; font-size: 24px; }
  .msg-count { font-size: 13px; color: var(--text-muted); }

  .msg-list { display: flex; flex-direction: column; gap: 16px; }
  .msg-card {
    background: white; border-radius: 16px; padding: 20px 24px;
    border: 1px solid var(--border); border-left: 4px solid var(--accent);
    transition: box-shadow 0.2s;
    animation: fadeUp 0.4s ease both;
  }
  @keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
  .msg-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
  .msg-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .msg-name { font-weight: 500; font-size: 15px; display: flex; align-items: center; gap: 6px; }
  .msg-name::before { content: '✦'; color: var(--accent); font-size: 10px; }
  .msg-time { font-size: 12px; color: var(--text-muted); }
  .msg-body { font-size: 14px; color: #555; line-height: 1.8; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
  .empty-state .empty-icon { font-size: 48px; margin-bottom: 16px; }
  .empty-state p { font-size: 15px; }

  .toast {
    position: fixed; bottom: 24px; right: 24px; z-index: 999;
    background: white; border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 22px; font-size: 14px; box-shadow: 0 8px 32px rgba(0,0,0,0.12);
    transform: translateY(80px); opacity: 0; transition: all 0.3s;
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.success { border-color: #5cb85c; color: #3a8a3a; }
  .toast.error { border-color: #e05c5c; color: #c03030; }

  footer { background: #1a1a1a; color: rgba(255,255,255,0.6); padding: 32px 40px; text-align: center; }
  footer a { color: var(--accent); text-decoration: none; }

  @media (max-width: 640px) {
    .hero-banner h1 { font-size: 36px; }
    .main { padding: 32px 16px 60px; }
    nav { padding: 0 16px; }
  }
</style>
</head>
<body>

<nav id="mainNav">
  <a class="nav-logo" href="/" id="navLogo">GAL·LERY</a>
  <div class="nav-links" id="navLinks"></div>
</nav>

<div class="hero-banner">
  <div class="hero-banner-inner">
    <h1>留言板</h1>
    <p>留下你的足迹，与我分享你的想法</p>
  </div>
</div>

<div class="main">
  <div class="form-card">
    <h2>发表<span>留言</span></h2>
    <div class="form-field">
      <label>你的名字（可选）</label>
      <input type="text" id="msgName" placeholder="匿名访客" maxlength="30">
    </div>
    <div class="form-field">
      <label>留言内容 *</label>
      <textarea id="msgContent" rows="5" placeholder="写下你想说的话..." maxlength="500"></textarea>
    </div>
    <button class="submit-btn" onclick="submitMsg()">发送留言 →</button>
    <p class="submit-note">留言将公开显示，请文明发言</p>
  </div>

  <div class="messages-header">
    <h2>全部留言</h2>
    <span class="msg-count" id="msgCount"></span>
  </div>
  <div class="msg-list" id="msgList">
    <div class="empty-state"><div class="empty-icon">💬</div><p>加载中...</p></div>
  </div>
</div>

<footer>
  <p id="footerCopy">© 2024 GALLERY · <a href="/">返回首页</a></p>
</footer>

<div class="toast" id="toast"></div>

<script>
async function init() {
  const site = await fetch('/api/site').then(r => r.json());
  // Nav
  document.getElementById('navLogo').textContent = site.nav?.logo || 'GAL·LERY';
  document.getElementById('navLinks').innerHTML = (site.nav?.links || []).map(l => `<a href="${l.href}">${l.label}</a>`).join('');
  // Footer
  if (site.footer?.copyright) document.getElementById('footerCopy').innerHTML = site.footer.copyright + ' · <a href="/">返回首页</a>';
  loadMessages();
}

async function loadMessages() {
  const msgs = await fetch('/api/messages').then(r => r.json());
  const list = document.getElementById('msgList');
  document.getElementById('msgCount').textContent = `共 ${msgs.length} 条`;
  if (msgs.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="empty-icon">💬</div><p>还没有留言，来第一个留言吧～</p></div>`;
    return;
  }
  list.innerHTML = msgs.map((m, i) => `
    <div class="msg-card" style="animation-delay:${i * 0.05}s">
      <div class="msg-header">
        <span class="msg-name">${escHtml(m.name)}</span>
        <span class="msg-time">${m.time}</span>
      </div>
      <div class="msg-body">${escHtml(m.content)}</div>
    </div>`).join('');
}

async function submitMsg() {
  const name = document.getElementById('msgName').value.trim() || '匿名访客';
  const content = document.getElementById('msgContent').value.trim();
  if (!content) { toast('请输入留言内容', 'error'); return; }
  const res = await fetch('/api/messages', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({name, content})
  });
  if (res.ok) {
    document.getElementById('msgName').value = '';
    document.getElementById('msgContent').value = '';
    toast('留言发送成功！', 'success');
    loadMessages();
  } else { toast('发送失败，请重试', 'error'); }
}

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function toast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show ' + type;
  setTimeout(() => t.classList.remove('show'), 3000);
}

init();
</script>
</body>
</html>
