<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GALLERY</title>
<link rel="icon" id="faviconLink" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Noto+Sans+SC:wght@300;400;500&family=Cormorant+Garamond:wght@300;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#faf9f7;--s:#fff;--tx:#1a1a1a;--mu:#8a8680;--ac:#c8a97e;--bd:#e8e4df;--r:16px;--nh:64px}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}

  nav{position:sticky;top:0;z-index:100;height:var(--nh);background:rgba(250,249,247,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 32px}
  .nav-logo{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;letter-spacing:.15em;color:var(--tx);text-decoration:none;margin-right:auto}
  .nav-links{display:flex;gap:8px}
  .nav-links a{font-size:13px;color:var(--mu);text-decoration:none;padding:8px 14px;border-radius:20px;transition:all .2s}
  .nav-links a:hover{color:var(--tx);background:var(--bd)}

  .hero{position:relative;width:100%;overflow:hidden;background:#1a1a1a}
  .slides{display:flex;height:100%;transition:transform .7s cubic-bezier(.4,0,.2,1)}
  .slide{min-width:100%;height:100%;position:relative;display:flex;align-items:center;justify-content:center}
  .slide-bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:brightness(.55)}
  .slide-content{position:relative;z-index:2;text-align:center;color:#fff;padding:0 40px}
  .slide-tag{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--ac);margin-bottom:16px}
  .slide-title{font-family:'Playfair Display',serif;font-size:clamp(30px,5vw,62px);font-weight:700;line-height:1.1;margin-bottom:16px}
  .slide-sub{font-size:16px;font-weight:300;color:rgba(255,255,255,.75);max-width:480px;margin:0 auto 28px}
  .slide-btn{display:inline-block;padding:12px 32px;background:var(--ac);color:#fff;text-decoration:none;border-radius:28px;font-size:13px;letter-spacing:.1em;transition:all .3s;border:2px solid var(--ac)}
  .slide-btn:hover{background:transparent;color:var(--ac)}
  .hero-nav{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:10}
  .hero-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.4);cursor:pointer;transition:all .3s}
  .hero-dot.active{background:#fff;width:24px;border-radius:3px}
  .hero-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:10;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;backdrop-filter:blur(8px);font-size:20px}
  .hero-arrow:hover{background:rgba(255,255,255,.3)}
  .hero-arrow.prev{left:24px}.hero-arrow.next{right:24px}

  .cat-bar{padding:16px 32px;display:flex;align-items:center;gap:8px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--bd)}
  .cat-bar::-webkit-scrollbar{display:none}
  .cat-btn{white-space:nowrap;padding:8px 20px;border-radius:20px;font-size:13px;border:1px solid var(--bd);background:#fff;color:var(--mu);cursor:pointer;transition:all .2s}
  .cat-btn:hover{border-color:var(--ac);color:var(--ac)}
  .cat-btn.active{background:var(--tx);color:#fff;border-color:var(--tx)}

  .masonry-wrap{padding:24px 20px 60px}
  .masonry{columns:5 240px;column-gap:16px}
  .masonry-item{break-inside:avoid;margin-bottom:16px;border-radius:var(--r);overflow:hidden;background:var(--s);cursor:pointer;position:relative;box-shadow:0 1px 6px rgba(0,0,0,.07);transition:transform .3s,box-shadow .3s;animation:fadeUp .45s ease both}
  @keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
  .masonry-item:hover{transform:translateY(-4px);box-shadow:0 12px 32px rgba(0,0,0,.13)}
  .thumb-wrap{position:relative;overflow:hidden;background:#f0ede8}
  .thumb-wrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .thumb-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:36px;color:var(--mu)}
  /* Overlay: shows title+cat only when they exist */
  .item-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.7) 0%,transparent 55%);opacity:0;transition:opacity .3s;display:flex;flex-direction:column;justify-content:flex-end;padding:14px}
  .masonry-item:hover .item-overlay{opacity:1}
  .item-title{color:#fff;font-size:13px;font-weight:500;line-height:1.3;margin-bottom:3px}
  .item-cat{color:var(--ac);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
  .vid-badge{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.5);color:#fff;font-size:10px;padding:3px 8px;border-radius:10px;backdrop-filter:blur(8px);z-index:2}
  /* LIKE BUTTON */
  .item-footer{padding:10px 14px;display:flex;align-items:center;justify-content:flex-end;gap:6px;border-top:1px solid var(--bd)}
  .like-btn{display:flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;border:1px solid var(--bd);background:transparent;cursor:pointer;font-size:12px;color:var(--mu);transition:all .2s;font-family:inherit}
  .like-btn:hover{border-color:#e84b70;color:#e84b70;background:rgba(232,75,112,.06)}
  .like-btn.liked{border-color:#e84b70;color:#e84b70;background:rgba(232,75,112,.08)}
  .like-btn .heart{font-size:14px;transition:transform .2s}
  .like-btn:hover .heart,.like-btn.liked .heart{transform:scale(1.2)}
  .like-count{font-weight:500}

  .loader{text-align:center;padding:40px;color:var(--mu)}
  .loader-dots span{display:inline-block;width:7px;height:7px;background:var(--ac);border-radius:50%;margin:0 3px;animation:bounce 1.2s infinite both}
  .loader-dots span:nth-child(2){animation-delay:.2s}
  .loader-dots span:nth-child(3){animation-delay:.4s}
  @keyframes bounce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}

  footer{background:#1a1a1a;color:rgba(255,255,255,.7);padding:44px 40px 28px}
  .footer-inner{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:2fr 1fr 1fr;gap:40px;margin-bottom:36px}
  .footer-brand h2{font-family:'Cormorant Garamond',serif;font-size:26px;color:#fff;letter-spacing:.15em;margin-bottom:10px}
  .footer-brand p{font-size:14px;line-height:1.7;white-space:pre-line}
  footer h4{color:#fff;font-size:13px;margin-bottom:14px;letter-spacing:.05em}
  footer ul{list-style:none}
  footer ul li{margin-bottom:7px}
  footer ul li a{color:rgba(255,255,255,.6);text-decoration:none;font-size:13px;transition:color .2s}
  footer ul li a:hover{color:var(--ac)}
  .footer-bottom{border-top:1px solid rgba(255,255,255,.1);padding-top:22px;text-align:center;font-size:12px;color:rgba(255,255,255,.4)}

  .modal{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.87);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
  .modal.open{opacity:1;pointer-events:all}
  .modal-inner{max-width:92vw;max-height:92vh;position:relative;border-radius:20px;overflow:hidden}
  .modal-inner img,.modal-inner video{max-width:92vw;max-height:86vh;display:block;border-radius:20px;object-fit:contain}
  .modal-close{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;border:none;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;z-index:2}
  .modal-info{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(to top,rgba(0,0,0,.82),transparent);padding:36px 22px 22px;color:#fff;border-radius:0 0 20px 20px}
  .modal-info h2{font-family:'Playfair Display',serif;font-size:21px}
  .modal-info p{font-size:13px;color:rgba(255,255,255,.7);margin-top:3px}

  @media(max-width:768px){
    nav{padding:0 16px}.nav-links a{padding:6px 10px;font-size:12px}
    .masonry{columns:2 160px}.cat-bar{padding:12px 16px}.masonry-wrap{padding:14px 10px 40px}
    .footer-inner{grid-template-columns:1fr;gap:20px}
  }
</style>
</head>
<body>

<nav>
  <a class="nav-logo" href="/" id="navLogo">GAL·LERY</a>
  <div class="nav-links" id="navLinks"></div>
</nav>

<section class="hero" id="heroSection">
  <div class="slides" id="slides"></div>
  <button class="hero-arrow prev" onclick="changeSlide(-1)">&#8249;</button>
  <button class="hero-arrow next" onclick="changeSlide(1)">&#8250;</button>
  <div class="hero-nav" id="heroDots"></div>
</section>

<div id="gallery">
  <div class="cat-bar" id="catBar">
    <button class="cat-btn active" onclick="filterCat('')" data-cat="">全部</button>
  </div>
</div>

<div class="masonry-wrap">
  <div class="masonry" id="masonry"></div>
  <div class="loader" id="loader" style="display:none"><div class="loader-dots"><span></span><span></span><span></span></div></div>
  <div id="endMsg" style="display:none;text-align:center;padding:40px;color:#bbb;font-size:13px">— 已显示全部内容 —</div>
</div>

<footer>
  <div class="footer-inner" id="footerInner"></div>
  <div class="footer-bottom"><p id="footerCopy"></p></div>
</footer>

<div class="modal" id="modal" onclick="closeModal(event)">
  <div class="modal-inner">
    <button class="modal-close" onclick="document.getElementById('modal').classList.remove('open')">&#215;</button>
    <div id="modalContent"></div>
    <div class="modal-info"><h2 id="modalTitle"></h2><p id="modalDesc"></p></div>
  </div>
</div>

<script>
let slide=0,slideTotal=0,autoTimer;
let currentPage=1,loading=false,hasMore=true,currentCat='';
// Track liked items in sessionStorage
const likedItems=new Set(JSON.parse(sessionStorage.getItem('liked')||'[]'));

async function init(){
  const site=await fetch('/api/site').then(r=>r.json());
  const basic=site.site||{};
  if(basic.title)document.title=basic.title;
  if(basic.favicon)document.getElementById('faviconLink').href='/static/uploads/'+basic.favicon;
  renderNav(site.nav||{});
  renderHero(site.hero||{slides:[]});
  renderFooter(site.footer||{});
  loadCategories();
  loadMore();
}

function renderNav(nav){
  document.getElementById('navLogo').textContent=nav.logo||'GAL·LERY';
  document.getElementById('navLinks').innerHTML=(nav.links||[]).map(l=>`<a href="${l.href}">${l.label}</a>`).join('');
}

function renderHero(hero){
  const h=hero.height||540;
  document.getElementById('heroSection').style.height=h+'px';
  const slidesEl=document.getElementById('slides');
  slidesEl.style.height=h+'px';
  slideTotal=(hero.slides||[]).length;
  slidesEl.innerHTML=(hero.slides||[]).map(s=>{
    const bg=s.bgType==='image'
      ?`background-image:url('/static/uploads/${s.bgValue}');background-size:cover;background-position:center`
      :`background:${s.bgValue}`;
    return `<div class="slide"><div class="slide-bg" style="${bg}"></div>
      <div class="slide-content">
        <div class="slide-tag">${s.tag||''}</div>
        <h1 class="slide-title">${s.title||''}</h1>
        <p class="slide-sub">${s.subtitle||''}</p>
        <a href="${s.btnHref||'#'}" class="slide-btn">${s.btnText||'查看'}</a>
      </div></div>`;
  }).join('');
  const dots=document.getElementById('heroDots');
  dots.innerHTML='';
  for(let i=0;i<slideTotal;i++){
    const d=document.createElement('div');
    d.className='hero-dot'+(i===0?' active':'');
    d.onclick=()=>{clearTimeout(autoTimer);showSlide(i);startAuto();};
    dots.appendChild(d);
  }
  if(slideTotal>0){showSlide(0);startAuto();}
}

function showSlide(n){
  slide=(n+slideTotal)%slideTotal;
  document.getElementById('slides').style.transform=`translateX(-${slide*100}%)`;
  document.querySelectorAll('.hero-dot').forEach((d,i)=>d.classList.toggle('active',i===slide));
}
function changeSlide(d){clearTimeout(autoTimer);showSlide(slide+d);startAuto();}
function startAuto(){if(slideTotal>1)autoTimer=setTimeout(()=>{showSlide(slide+1);startAuto();},5000);}

function renderFooter(ft){
  const cols=(ft.columns||[]).map(col=>`<div><h4>${col.title}</h4><ul>${(col.links||[]).map(l=>`<li><a href="${l.href}">${l.label}</a></li>`).join('')}</ul></div>`).join('');
  document.getElementById('footerInner').innerHTML=`<div class="footer-brand"><h2>${ft.brand?.logo||'GAL·LERY'}</h2><p>${ft.brand?.desc||''}</p></div>${cols}`;
  document.getElementById('footerCopy').textContent=ft.copyright||'';
}

async function loadCategories(){
  const cats=await fetch('/api/categories').then(r=>r.json());
  const bar=document.getElementById('catBar');
  cats.forEach(c=>{
    const btn=document.createElement('button');
    btn.className='cat-btn';btn.dataset.cat=c;btn.textContent=c;
    btn.onclick=()=>filterCat(c);
    bar.appendChild(btn);
  });
}

function filterCat(cat){
  currentCat=cat;currentPage=1;hasMore=true;
  document.getElementById('masonry').innerHTML='';
  document.getElementById('endMsg').style.display='none';
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.toggle('active',b.dataset.cat===cat));
  loadMore();
}

async function loadMore(){
  if(loading||!hasMore)return;
  loading=true;
  document.getElementById('loader').style.display='block';
  const data=await fetch(`/api/items?page=${currentPage}&per_page=20&category=${encodeURIComponent(currentCat)}`).then(r=>r.json());
  data.items.forEach((item,idx)=>document.getElementById('masonry').appendChild(createCard(item,idx)));
  hasMore=data.has_more;currentPage++;loading=false;
  document.getElementById('loader').style.display='none';
  if(!hasMore)document.getElementById('endMsg').style.display='block';
}

function createCard(item,idx){
  const div=document.createElement('div');
  div.className='masonry-item';
  div.style.animationDelay=(idx%8*0.055)+'s';
  const isVideo=item.type==='video';
  const coverSrc=item.cover||(!isVideo?item.filename:null);
  const ratio=item.height&&item.width?(item.height/item.width*100).toFixed(2):75;
  const liked=likedItems.has(item.id);

  // Title+cat only shown in overlay if they exist
  const hasTitle=item.title&&item.title.trim()!=='';
  const hasCat=item.category&&item.category.trim()!=='';
  const overlayContent=(hasTitle?`<div class="item-title">${esc(item.title)}</div>`:'')+(hasCat?`<div class="item-cat">${esc(item.category)}</div>`:'');
  // Only render overlay div if there's content to show
  const overlayHtml=(hasTitle||hasCat)?`<div class="item-overlay">${overlayContent}</div>`:'';

  div.innerHTML=`
    <div class="thumb-wrap" style="padding-top:${ratio}%" onclick="openModal(window.__items['${item.id}'])">
      ${coverSrc?`<img src="/static/uploads/${coverSrc}" loading="lazy" alt="${esc(item.title||'')}" onerror="this.style.display='none'">`:''}
      <div class="thumb-ph" style="${coverSrc?'display:none':''}">📷</div>
      ${overlayHtml}
      ${isVideo?'<span class="vid-badge">▶ 视频</span>':''}
    </div>
    <div class="item-footer">
      <button class="like-btn${liked?' liked':''}" id="like-${item.id}" onclick="toggleLike('${item.id}',this)">
        <span class="heart">${liked?'❤️':'🤍'}</span>
        <span class="like-count">${item.likes||0}</span>
      </button>
    </div>`;

  // Store item reference for modal
  if(!window.__items)window.__items={};
  window.__items[item.id]=item;
  return div;
}

async function toggleLike(id,btn){
  if(likedItems.has(id)){
    // Unlike (client-side only, no unlike API to keep it simple)
    likedItems.delete(id);
    btn.classList.remove('liked');
    btn.querySelector('.heart').textContent='🤍';
    // Decrement display count
    const countEl=btn.querySelector('.like-count');
    countEl.textContent=Math.max(0,parseInt(countEl.textContent)-1);
  } else {
    likedItems.add(id);
    btn.classList.add('liked');
    btn.querySelector('.heart').textContent='❤️';
    const res=await fetch(`/api/like/${id}`,{method:'POST'});
    if(res.ok){
      const d=await res.json();
      btn.querySelector('.like-count').textContent=d.likes;
      if(window.__items[id]) window.__items[id].likes=d.likes;
    }
  }
  sessionStorage.setItem('liked',JSON.stringify([...likedItems]));
}

const obs=new IntersectionObserver(e=>{if(e[0].isIntersecting)loadMore();},{rootMargin:'400px'});
obs.observe(document.getElementById('endMsg'));

function openModal(item){
  if(!item)return;
  const src=`/static/uploads/${item.filename}`;
  document.getElementById('modalContent').innerHTML=item.type==='video'
    ?`<video src="${src}" controls autoplay style="max-width:92vw;max-height:82vh;border-radius:16px;display:block"></video>`
    :`<img src="${src}" style="max-width:92vw;max-height:82vh;border-radius:16px;display:block;object-fit:contain" alt="${esc(item.title||'')}">`;
  document.getElementById('modalTitle').textContent=item.title||'';
  document.getElementById('modalDesc').textContent=item.description||item.category||'';
  document.getElementById('modal').classList.add('open');
}
function closeModal(e){if(e.target===document.getElementById('modal'))document.getElementById('modal').classList.remove('open');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('modal').classList.remove('open');});
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
init();
</script>
</body>
</html>
