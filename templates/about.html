<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>关于我 · GALLERY</title>
<link rel="icon" id="faviconLink" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Noto+Sans+SC:wght@300;400;500&family=Cormorant+Garamond:wght@300;600&display=swap" rel="stylesheet">
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<style>
:root{--bg:#faf9f7;--s:#fff;--tx:#1a1a1a;--mu:#8a8680;--ac:#c8a97e;--bd:#e8e4df;--nav-bg:rgba(250,249,247,.93)}
[data-theme=cool]{--bg:#f0f4f8;--s:#fff;--tx:#1e2a3a;--mu:#6b7d8f;--ac:#4a90d9;--bd:#d4dde8;--nav-bg:rgba(240,244,248,.93)}
[data-theme=dark]{--bg:#0f1117;--s:#1a1c24;--tx:#e2e4f0;--mu:#6b6e84;--ac:#7c6af5;--bd:#252833;--nav-bg:rgba(15,17,23,.95)}
[data-theme=green]{--bg:#f2f7f2;--s:#fff;--tx:#1a2e1a;--mu:#5a7a5a;--ac:#4a9460;--bd:#d0e8d0;--nav-bg:rgba(242,247,242,.93)}
[data-theme=rose]{--bg:#fdf6f8;--s:#fff;--tx:#2e1a20;--mu:#9a6875;--ac:#d4607a;--bd:#f0d8de;--nav-bg:rgba(253,246,248,.93)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;transition:background .3s,color .3s}
nav{position:sticky;top:0;z-index:100;height:64px;background:var(--nav-bg);backdrop-filter:blur(16px);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 28px;gap:8px;transition:background .3s}
.nav-logo{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;letter-spacing:.15em;color:var(--tx);text-decoration:none;margin-right:auto}
.nav-links{display:flex;gap:4px}
.nav-links a{font-size:13px;color:var(--mu);text-decoration:none;padding:7px 13px;border-radius:20px;transition:all .2s}
.nav-links a:hover{color:var(--tx);background:var(--bd)}
.nav-toggle{display:none;width:32px;height:32px;border-radius:50%;border:1px solid var(--bd);background:transparent;color:var(--tx);cursor:pointer;align-items:center;justify-content:center;padding:0;font-size:18px;flex-shrink:0}
.nav-toggle span{display:block;width:16px;height:2px;background:var(--tx);position:relative;border-radius:999px}
.nav-toggle span::before,.nav-toggle span::after{content:'';position:absolute;left:0;width:16px;height:2px;background:var(--tx);border-radius:999px}
.nav-toggle span::before{top:-5px}
.nav-toggle span::after{top:5px}
.about-hero{position:relative;min-height:280px;display:flex;align-items:flex-end;overflow:hidden;background:linear-gradient(135deg,#1a1208 0%,#3d2510 50%,#6b3d18 100%)}
.about-hero-bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:brightness(.45)}
.about-hero-content{position:relative;z-index:2;max-width:900px;margin:0 auto;width:100%;padding:60px 40px 48px;display:flex;align-items:flex-end;gap:36px}
.about-avatar{width:140px;height:140px;border-radius:50%;background:linear-gradient(135deg,var(--ac),#e8c99a);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:52px;border:4px solid rgba(255,255,255,.25);box-shadow:0 8px 32px rgba(0,0,0,.3);overflow:hidden}
.about-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.about-hero-text h1{font-family:'Playfair Display',serif;font-size:clamp(28px,5vw,52px);font-weight:700;color:#fff;margin-bottom:10px}
.about-hero-text .tagline{font-size:20px;font-weight:300;color:rgba(255,255,255,.75);font-style:italic;font-family:'Cormorant Garamond',serif}
.about-main{max-width:900px;margin:0 auto;padding:52px 40px 80px}
.about-section{margin-bottom:52px}
.sec-label{font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:var(--ac);margin-bottom:14px}
.sec-title{font-family:'Playfair Display',serif;font-size:28px;margin-bottom:20px}
.sec-title span{color:var(--ac)}
.story-text p,.story-text li{font-size:15px;line-height:1.9;color:var(--mu);margin-bottom:14px;font-weight:300}
.story-text strong{font-weight:600;color:var(--tx)}
.story-text em{font-style:italic}
.story-text a{color:var(--ac);text-decoration:none}
.story-text ul,.story-text ol{padding-left:1.5em;margin-bottom:14px}
.story-text blockquote{border-left:3px solid var(--ac);margin:12px 0;padding:8px 16px;color:var(--mu);font-style:italic;background:rgba(0,0,0,.04);border-radius:0 6px 6px 0}
.story-text img{max-width:100%;height:auto;display:block;margin:12px 0;border-radius:10px}
.story-text figure{max-width:100%;margin:12px 0}
.story-text figure img{margin:0}
.story-text iframe,.story-text video{max-width:100%;width:100%;height:auto;border-radius:10px}
.skills-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:8px}
.skill-item{background:var(--s);border:1px solid var(--bd);border-radius:14px;padding:20px;transition:background .3s,border-color .3s}
.skill-header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.skill-icon{width:32px;height:32px;border-radius:8px;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--bd)}
.skill-icon img{width:100%;height:100%;object-fit:cover}
.skill-name{font-size:13px;font-weight:500;display:flex;justify-content:space-between;flex:1}
.skill-bar{height:4px;background:var(--bd);border-radius:2px;overflow:hidden}
.skill-fill{height:100%;background:linear-gradient(90deg,var(--ac),#e8c99a);border-radius:2px;transition:width 1s ease}
.social-links{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
.social-link{position:relative;padding:10px 22px;border-radius:24px;border:1px solid var(--bd);font-size:13px;color:var(--mu);text-decoration:none;transition:all .2s;display:flex;align-items:center;gap:8px}
.social-link:hover{border-color:var(--ac);color:var(--ac);background:rgba(200,169,126,.06)}
.social-link--disabled{cursor:default;opacity:.9}
.social-link--disabled:hover{border-color:var(--ac);color:var(--ac);background:rgba(200,169,126,.06)}
.social-link-icon{width:20px;height:20px;border-radius:4px;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.social-link-icon img{width:100%;height:100%;object-fit:cover}
.social-hover-card{position:absolute;left:50%;top:calc(100% + 10px);transform:translateX(-50%) translateY(6px);opacity:0;pointer-events:none;border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,.18);background:rgba(10,10,12,.92);box-shadow:0 10px 28px rgba(0,0,0,.35);transition:opacity .2s,transform .2s;z-index:12}
.social-hover-card img{width:100%;height:100%;object-fit:cover;display:block}
.social-link:hover .social-hover-card{opacity:1;transform:translateX(-50%) translateY(0)}
.gallery-preview{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.gallery-preview-item{aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--bd);cursor:pointer;position:relative}
.gallery-preview-item img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.gallery-preview-item:hover img{transform:scale(1.05)}
.gallery-preview-more{aspect-ratio:1;border-radius:12px;background:var(--tx);display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--bg);font-size:14px;font-weight:500;transition:background .2s}
.gallery-preview-more:hover{background:var(--ac)}

@media(max-width:768px){
  nav{padding:0 16px;}
  .nav-links{position:fixed;top:64px;left:0;right:0;background:var(--nav-bg);padding:0 16px;border-bottom:0;flex-direction:column;gap:4px;max-height:0;overflow:hidden;transition:max-height .25s ease, padding .25s ease, border-color .25s ease;}
  .nav-links.open{max-height:220px;padding:8px 16px;border-bottom:1px solid var(--bd);}
  .nav-links a{padding:9px 10px;}
  .nav-toggle{display:flex;}
}

@media(max-width:640px){}

@media(max-width:768px){nav{padding:0 16px;gap:6px}.about-hero-content{flex-direction:column;align-items:center;text-align:center;padding:40px 20px 36px}.about-main{padding:36px 20px 60px}.skills-grid{grid-template-columns:1fr}.gallery-preview{grid-template-columns:repeat(2,1fr)}}
/* FOOTER */
footer{background:#1a1a1a;color:rgba(255,255,255,.7);padding:48px 0 28px}
.footer-cols{max-width:960px;margin:0 auto;padding:0 48px;display:flex;align-items:flex-start;box-sizing:border-box;flex-wrap:nowrap;overflow:hidden}
.footer-copy{max-width:960px;margin:32px auto 0;padding:20px 48px 0;box-sizing:border-box;border-top:1px solid rgba(255,255,255,.12);text-align:center;font-size:12px;color:rgba(255,255,255,.35)}
.footer-brand-logo{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;color:#fff;letter-spacing:.15em;margin-bottom:12px}
.footer-brand-desc{font-size:13px;line-height:1.75;color:rgba(255,255,255,.55);white-space:pre-line}
.footer-col-title{color:#fff;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-bottom:14px}
footer ul{list-style:none;padding:0;margin:0}
footer ul li{margin-bottom:9px}
footer ul li a{color:rgba(255,255,255,.5);text-decoration:none;font-size:13px;transition:color .2s}
footer ul li a:hover{color:rgba(255,255,255,.9)}
@media(max-width:640px){.footer-cols{padding:0 24px;overflow-x:auto;-webkit-overflow-scrolling:touch}.footer-copy{padding:16px 24px 0}}

.modal{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.88);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
.modal.open{opacity:1;pointer-events:all}
.modal-inner{max-width:92vw;max-height:92vh;position:relative;border-radius:18px;overflow:hidden}
.modal-inner img,.modal-inner video,.modal-inner model-viewer{max-width:92vw;max-height:86vh;display:block;border-radius:18px;object-fit:contain}
.modal-close{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;border:none;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;z-index:2}
.modal-bigbtn{position:absolute;top:12px;right:52px;height:32px;padding:0 14px;border-radius:16px;background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.25);cursor:pointer;font-size:12px;display:flex;align-items:center;gap:5px;backdrop-filter:blur(6px);z-index:2}
.modal-bigbtn:hover{background:rgba(200,169,126,.7)}
.modal-info{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(to top,rgba(0,0,0,.8),transparent);padding:36px 20px 20px;color:#fff;border-radius:0 0 18px 18px}
.modal-info h2{font-family:'Playfair Display',serif;font-size:20px}
.modal-info p,.modal-info>div{font-size:12px;color:rgba(255,255,255,.7);margin-top:3px}.modal-info div p{margin:2px 0;font-size:12px}

@media(max-width:768px){
  .modal{align-items:flex-start;}
  .modal-inner{width:100vw;max-width:none;height:100vh;max-height:none;border-radius:0;}
  .modal-inner img,.modal-inner video,.modal-inner model-viewer{max-width:100vw;max-height:calc(100vh - 140px);border-radius:0;}
  .modal-info{border-radius:0;}
}

/* Theme switcher */
.theme-trigger{width:30px;height:30px;border-radius:50%;border:2px solid var(--bd);cursor:pointer;transition:all .2s;flex-shrink:0}
.theme-trigger:hover{transform:scale(1.1);border-color:var(--ac)}
.theme-popup{position:fixed;top:72px;right:16px;background:var(--s);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;z-index:999;box-shadow:0 8px 32px rgba(0,0,0,.15);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;transform:translateY(-8px)}
.theme-popup.open{opacity:1;pointer-events:all;transform:translateY(0)}
.theme-popup h4{font-size:11px;color:var(--mu);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px}
.theme-swatches{display:flex;gap:8px}
.swatch{width:32px;height:32px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:all .2s;position:relative}
.swatch:hover{transform:scale(1.15)}
.swatch.active::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.swatch-label{font-size:10px;text-align:center;color:var(--mu);margin-top:4px}
.theme-swatch-wrap{display:flex;flex-direction:column;align-items:center}
</style>
</head>
<body>
<nav>
  <a class="nav-logo" href="/" id="navLogo">GAL·LERY</a>
  <button class="nav-toggle" type="button" onclick="toggleNavMenu()" aria-label="切换导航"><span></span></button>
  <div class="nav-links" id="navLinks"></div>
  <div style="position:relative">
    <div class="theme-trigger" id="themeBtn" onclick="togglePicker()" title="切换配色"></div>
    <div class="theme-popup" id="themePop">
      <h4>配色方案</h4>
      <div class="theme-swatches">
        <div class="theme-swatch-wrap"><div class="swatch" style="background:linear-gradient(135deg,#c8a97e,#f0e0c0)" data-t="warm" onclick="applyTheme('warm')"></div><div class="swatch-label">暖金</div></div>
        <div class="theme-swatch-wrap"><div class="swatch" style="background:linear-gradient(135deg,#4a90d9,#a0c8f8)" data-t="cool" onclick="applyTheme('cool')"></div><div class="swatch-label">清蓝</div></div>
        <div class="theme-swatch-wrap"><div class="swatch" style="background:linear-gradient(135deg,#333,#7c6af5)" data-t="dark" onclick="applyTheme('dark')"></div><div class="swatch-label">暗夜</div></div>
        <div class="theme-swatch-wrap"><div class="swatch" style="background:linear-gradient(135deg,#4a9460,#a8e0b0)" data-t="green" onclick="applyTheme('green')"></div><div class="swatch-label">绿意</div></div>
        <div class="theme-swatch-wrap"><div class="swatch" style="background:linear-gradient(135deg,#d4607a,#f8b0c0)" data-t="rose" onclick="applyTheme('rose')"></div><div class="swatch-label">玫瑰</div></div>
      </div>
    </div>
  </div>
</nav>

<section class="about-hero" id="aboutHero">
  <div class="about-hero-bg" id="heroBg"></div>
  <div class="about-hero-content">
    <div class="about-avatar" id="aboutAvatar">🎨</div>
    <div class="about-hero-text">
      <h1 id="aboutName">创作者</h1>
      <div class="tagline" id="aboutTagline">用镜头记录世界的美好</div>
    </div>
  </div>
</section>

<main class="about-main">
  <section class="about-section">
    <div class="sec-label">My Story</div>
    <h2 class="sec-title">关于<span>我</span></h2>
    <div class="story-text" id="storyText"></div>
  </section>
  <section class="about-section" id="skillsSection">
    <div class="sec-label">Expertise</div>
    <h2 class="sec-title">专业<span>技能</span></h2>
    <div class="skills-grid" id="skillsGrid"></div>
  </section>
  <section class="about-section">
    <div class="sec-label">Connect</div>
    <h2 class="sec-title">联系<span>我</span></h2>
    <div class="social-links" id="socialLinks"></div>
  </section>
  <section class="about-section">
    <div class="sec-label">Recent Works</div>
    <h2 class="sec-title">近期<span>作品</span></h2>
    <div class="gallery-preview" id="galleryPreview"></div>
  </section>
</main>

<footer>
  <div id="footerInner"></div>
</footer>

<div class="modal" id="aboutModal" onclick="if(event.target===this)closeAboutModal()">
  <div class="modal-inner">
    <button class="modal-close" onclick="closeAboutModal()">&#215;</button>
    <button class="modal-bigbtn" id="aboutModalBigBtn">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>查看大图
    </button>
    <div id="aboutModalBody"></div>
    <div class="modal-info"><h2 id="aboutModalTitle"></h2><div id="aboutModalDesc" style="font-size:12px;color:rgba(255,255,255,.7);margin-top:3px"></div></div>
  </div>
</div>

<script>
// 主题同步（与首页共用 localStorage）
// 主题由下方 applyTheme 统一初始化

async function init(){
  const [site, items] = await Promise.all([
    fetch('/api/site').then(r=>r.json()),
    fetch('/api/items?per_page=6').then(r=>r.json())
  ]);
  const basic=site.site||{};
  if(!localStorage.getItem('g_theme')) applyTheme(site.theme||'warm');
  if(basic.favicon)document.getElementById('faviconLink').href='/static/uploads/'+basic.favicon;
  if(basic.title)document.title='关于我 · '+basic.title;
  document.getElementById('navLogo').textContent=site.nav?.logo||'GAL·LERY';
  document.getElementById('navLinks').innerHTML=(site.nav?.links||[])
    .filter(l=>l && l.visible!==false)
    .map(l=>{
      const href=(l.href||'').trim()==='#splash' ? '/#splash' : (l.href||'');
      return `<a href="${href}" target="${l.target||'_self'}">${l.label}</a>`;
    }).join('');
  const ab=site.about||{};
  const heroEl=document.getElementById('aboutHero');
  if(ab.heroHeight) heroEl.style.minHeight=ab.heroHeight+'px';
  if(ab.heroImage){
    const bg=document.getElementById('heroBg');
    bg.style.backgroundImage=`url('/static/uploads/${ab.heroImage}')`;
  }
  const avatarEl=document.getElementById('aboutAvatar');
  if(ab.avatarImage) avatarEl.innerHTML=`<img src="/static/uploads/${ab.avatarImage}" alt="头像">`;
  else avatarEl.textContent=ab.emoji||'🎨';
  document.getElementById('aboutName').textContent=ab.name||'创作者';
  document.getElementById('aboutTagline').textContent=ab.tagline||'';
  document.getElementById('storyText').innerHTML=ab.bio||(ab.paragraphs||[]).map(p=>`<p>${esc(p)}</p>`).join('');

  // Skills with icon support (需求6)
  const skills=ab.skills||[];
  const sg=document.getElementById('skillsSection');
  if(!skills.length){sg.style.display='none';}
  else{
    document.getElementById('skillsGrid').innerHTML=skills.map(s=>{
      const iconHtml=s.icon
        ?`<div class="skill-icon"><img src="/static/uploads/${s.icon}" alt="" onerror="this.parentElement.style.display='none'"></div>`
        :'';
      return `<div class="skill-item">
        <div class="skill-header">
          ${iconHtml}
          <div class="skill-name"><span>${esc(s.label)}</span><span style="color:var(--ac)">${s.value}%</span></div>
        </div>
        <div class="skill-bar"><div class="skill-fill" style="width:0" data-val="${s.value}%"></div></div>
      </div>`;
    }).join('');
    setTimeout(()=>document.querySelectorAll('.skill-fill').forEach(el=>el.style.width=el.dataset.val),200);
  }

  // Socials with icon support (需求6)：无链接时不可点击
  document.getElementById('socialLinks').innerHTML=(ab.socials||[]).map(s=>{
    const iconHtml=s.icon
      ?`<div class="social-link-icon"><img src="${fileSrc(s.icon)}" alt="" onerror="this.parentElement.style.display='none'"></div>`
      :'';
    const hoverImg = s.hover_image ? fileSrc(s.hover_image) : '';
    const hoverW = Math.max(80, Math.min(800, parseInt(s.hover_w)||220));
    const hoverH = Math.max(60, Math.min(800, parseInt(s.hover_h)||140));
    const hoverHtml = hoverImg
      ? `<div class="social-hover-card" style="width:${hoverW}px;height:${hoverH}px"><img src="${hoverImg}" referrerpolicy="no-referrer" onerror="this.parentElement.style.display='none'"></div>`
      : '';
    const hasHref = (s.href && s.href.trim() && s.href.trim() !== '#');
    const label = esc(s.label || '');
    if (hasHref) {
      return `<a href="${esc(s.href)}" class="social-link" target="_blank" rel="noopener">${iconHtml}${label}${hoverHtml}</a>`;
    }
    return `<span class="social-link social-link--disabled" title="未填写链接">${iconHtml}${label}${hoverHtml}</span>`;
  }).join('');

  const gp=document.getElementById('galleryPreview');
  const previewItems=items.items.slice(0,5);
  // 存储 items 用于 modal
  window._aboutItems={};
  items.items.forEach(i=>{window._aboutItems[i.id]=i;});
  _aboutPreviewOrder = previewItems.map(i=>i.id);
  gp.innerHTML=previewItems.map(item=>{
    const isVid=itemIsVideo(item);
    const isModel=itemIsModel(item);
    const src=item.cover||item.filename;
    return src
      ?`<div class="gallery-preview-item" onclick="location.href='/#gallery/${item.id}'" style="cursor:pointer">
          <img src="${fileSrc(src)}" alt="${esc(item.title||'')}">
          ${(isVid||isModel)?'<div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;pointer-events:none"><svg width="16" height="16" viewBox="0 0 24 24" fill="white"><polygon points="5,3 19,12 5,21"/></svg></div>':''} 
        </div>`
      :`<div class="gallery-preview-item" onclick="location.href='/#gallery/${item.id}'" style="cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:30px">📦</div>`;
  }).join('')+`<a class="gallery-preview-more" href="/">查看全部 →</a>`;
  renderFooter(site.footer||{});
}

function renderFooter(ft){
  const colData = ft.columns||[];
  const brand = ft.brand||{};
  const copy = ft.copyright||'';

  const brandHtml = `
    <div style="flex:0 0 240px;padding-right:40px;flex-shrink:0">
      <p class="footer-brand-logo">${brand.logo||'GAL·LERY'}</p>
      <p class="footer-brand-desc">${brand.desc||''}</p>
    </div>`;

  const navHtml = colData.map(c=>{
    const links=(c.links||[]).map(l=>{
      const href=(l.label==='订阅RSS'&&!l.href)?'/feed.xml':(l.href||'#');
      return `<li><a href="${href}"${(l.target==='_blank')?' target="_blank"':''}>${l.label}</a></li>`;
    }).join('');
    return `<div style="flex:1;min-width:120px">
      <p class="footer-col-title">${c.title}</p>
      <ul>${links}</ul>
    </div>`;
  }).join('');

  document.getElementById('footerInner').innerHTML =
    `<div class="footer-cols">${brandHtml}${navHtml}</div>` +
    `<div class="footer-copy"><p>${copy}</p></div>`;
}

function toggleNavMenu(){
  const links=document.getElementById('navLinks');
  if(!links)return;
  links.classList.toggle('open');
}

let _aboutModalHistoryPushed=false;
let _aboutPreviewOrder=[];
let _aboutCurrentId='';
let _aboutNavLock=false;
let _aboutTouchStartY=null;

function fileSrc(f){return f&&(f.startsWith('http://')||f.startsWith('https://'))?f:'/static/uploads/'+f;}
function extOf(f){return String(f||'').split('?')[0].split('.').pop().toLowerCase();}
function isModelByFile(f){const e=extOf(f);return e==='glb'||e==='gltf';}
function isVideoByFile(f){const e=extOf(f);return e==='mp4'||e==='mov'||e==='webm';}
function itemIsModel(it){return it&&(((it.type||'').toLowerCase()==='model')||isModelByFile(it.filename));}
function itemIsVideo(it){return it&&(((it.type||'').toLowerCase()==='video')||isVideoByFile(it.filename));}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function openAboutModal(id){
  const item=window._aboutItems?.[id];if(!item)return;
  _aboutCurrentId = id;
  const src=fileSrc(item.filename);
  const isVid=itemIsVideo(item);
  const isModel=itemIsModel(item);
  const imgs = !isVid && !isModel && Array.isArray(item.images) ? item.images.filter(Boolean) : [];
  if(!isVid && !isModel && imgs.length>1){
    const gapPx=Math.max(0,Math.min(100,parseInt(item.images_gap_px,10)||10));
    const html = imgs.map(fn=>`<img src="${fileSrc(fn)}" style="width:min(92vw,900px);max-width:92vw;display:block;border-radius:14px;margin:0 auto ${item.images_gap?gapPx:0}px;object-fit:contain">`).join('');
    document.getElementById('aboutModalBody').innerHTML=`<div style="max-height:82vh;overflow-y:auto;padding-right:4px">${html}</div>`;
  }else{
    document.getElementById('aboutModalBody').innerHTML=isVid
      ?`<video src="${src}" controls autoplay style="width:min(92vw,900px);max-width:92vw;max-height:82vh;border-radius:14px;display:block;object-fit:contain"></video>`
      :(isModel
        ?`<model-viewer src="${src}" camera-controls auto-rotate exposure="1" shadow-intensity="1" style="width:min(92vw,900px);height:min(82vh,720px);max-width:92vw;background:rgba(0,0,0,.15);border-radius:14px"></model-viewer>`
        :`<img src="${src}" style="width:min(92vw,900px);max-width:92vw;max-height:82vh;border-radius:14px;display:block;object-fit:contain">`);
  }
  document.getElementById('aboutModalTitle').textContent=item.title||'';
  document.getElementById('aboutModalDesc').innerHTML=item.description||'';
  const bigBtn=document.getElementById('aboutModalBigBtn');
  bigBtn.style.display=(isVid||isModel)?'none':'flex';
  bigBtn.onclick=()=>window.open(src,'_blank');
  if(!_aboutModalHistoryPushed){
    try{ history.pushState({aboutModalOpen:true}, ''); _aboutModalHistoryPushed=true; }catch(e){}
  }
  document.getElementById('aboutModal').classList.add('open');
  document.body.style.overflow='hidden';
}

function openAboutByOffset(step){
  if(!_aboutCurrentId || !_aboutPreviewOrder.length) return;
  const idx = _aboutPreviewOrder.indexOf(_aboutCurrentId);
  if(idx < 0) return;
  const next = idx + step;
  if(next < 0 || next >= _aboutPreviewOrder.length) return;
  openAboutModal(_aboutPreviewOrder[next]);
}

function handleAboutWheel(e){
  const m=document.getElementById('aboutModal');
  if(!m || !m.classList.contains('open')) return;
  if(_aboutNavLock) return;
  if(Math.abs(e.deltaY) < 8) return;
  e.preventDefault();
  _aboutNavLock = true;
  openAboutByOffset(e.deltaY > 0 ? 1 : -1);
  setTimeout(()=>{ _aboutNavLock = false; }, 180);
}

function handleAboutTouchStart(e){
  const m=document.getElementById('aboutModal');
  if(!m || !m.classList.contains('open')) return;
  if(!e.touches || !e.touches.length) return;
  _aboutTouchStartY = e.touches[0].clientY;
}

function handleAboutTouchEnd(e){
  const m=document.getElementById('aboutModal');
  if(!m || !m.classList.contains('open')) return;
  if(_aboutNavLock) return;
  if(_aboutTouchStartY == null) return;
  const y = (e.changedTouches && e.changedTouches[0]) ? e.changedTouches[0].clientY : _aboutTouchStartY;
  const dy = y - _aboutTouchStartY;
  _aboutTouchStartY = null;
  if(Math.abs(dy) < 36) return;
  _aboutNavLock = true;
  openAboutByOffset(dy < 0 ? 1 : -1);
  setTimeout(()=>{ _aboutNavLock = false; }, 220);
}

function closeAboutModal(fromPopstate=false){
  document.getElementById('aboutModal').classList.remove('open');
  document.getElementById('aboutModalBody').innerHTML='';
  _aboutCurrentId='';
  _aboutTouchStartY=null;
  document.body.style.overflow='';
  if(_aboutModalHistoryPushed){
    if(!fromPopstate){
      try{ history.back(); }catch(e){}
    }
    _aboutModalHistoryPushed=false;
  }
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAboutModal();if(e.key==='ArrowDown')openAboutByOffset(1);if(e.key==='ArrowUp')openAboutByOffset(-1);});
window.addEventListener('popstate',()=>{
  const m=document.getElementById('aboutModal');
  if(m&&m.classList.contains('open')) closeAboutModal(true);
});
const _aboutModalEl=document.getElementById('aboutModal');
_aboutModalEl.addEventListener('wheel', handleAboutWheel, {passive:false});
_aboutModalEl.addEventListener('touchstart', handleAboutTouchStart, {passive:true});
_aboutModalEl.addEventListener('touchend', handleAboutTouchEnd, {passive:true});

// 监听首页配色实时同步

// ── 配色方案 ──
const THEME_COLORS={warm:'#c8a97e',cool:'#4a90d9',dark:'#7c6af5',green:'#4a9460',rose:'#d4607a'};
function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  localStorage.setItem('g_theme',t);
  const btn=document.getElementById('themeBtn');
  if(btn) btn.style.background=THEME_COLORS[t]||'#c8a97e';
  document.querySelectorAll('.swatch').forEach(s=>s.classList.toggle('active',s.dataset.t===t));
}
function togglePicker(){document.getElementById('themePop').classList.toggle('open');}
document.addEventListener('click',e=>{
  if(!e.target.closest('.theme-trigger')&&!e.target.closest('.theme-popup')){
    const pop=document.getElementById('themePop');
    if(pop) pop.classList.remove('open');
  }
});
// 实时监听其他页面的主题变化
window.addEventListener('storage',e=>{
  if(e.key==='g_theme'&&e.newValue) applyTheme(e.newValue);
});

// 初始化主题
applyTheme(localStorage.getItem('g_theme')||'warm'); // overridden by site.theme in init if no localStorage
init();
</script>
