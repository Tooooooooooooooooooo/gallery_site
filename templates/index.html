<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GALLERY</title>
<link rel="icon" id="faviconLink" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Noto+Sans+SC:wght@300;400;500&family=Cormorant+Garamond:wght@300;600&display=swap" rel="stylesheet">
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<style>
/* THEMES */
:root{--bg:#faf9f7;--s:#fff;--tx:#1a1a1a;--mu:#8a8680;--ac:#c8a97e;--bd:#e8e4df;--nav-bg:rgba(250,249,247,.93)}
[data-theme=cool]{--bg:#f0f4f8;--s:#fff;--tx:#1e2a3a;--mu:#6b7d8f;--ac:#4a90d9;--bd:#d4dde8;--nav-bg:rgba(240,244,248,.93)}
[data-theme=dark]{--bg:#0f1117;--s:#1a1c24;--tx:#e2e4f0;--mu:#6b6e84;--ac:#7c6af5;--bd:#252833;--nav-bg:rgba(15,17,23,.95)}
[data-theme=green]{--bg:#f2f7f2;--s:#fff;--tx:#1a2e1a;--mu:#5a7a5a;--ac:#4a9460;--bd:#d0e8d0;--nav-bg:rgba(242,247,242,.93)}
[data-theme=rose]{--bg:#fdf6f8;--s:#fff;--tx:#2e1a20;--mu:#9a6875;--ac:#d4607a;--bd:#f0d8de;--nav-bg:rgba(253,246,248,.93)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--tx);transition:background .3s,color .3s}
@media(prefers-reduced-motion:reduce){.slide,.sc-card,.m-item,.featured-card,.modal,.theme-popup,.hero-dot,.hero-arr{transition:none!important}.sc-card:hover,.m-item:hover,.featured-card:hover{transform:none}}

/* NAV */
nav{position:sticky;top:0;z-index:100;height:64px;background:var(--nav-bg);backdrop-filter:blur(16px);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 28px;gap:8px;transition:background .3s}
.nav-logo{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;letter-spacing:.15em;color:var(--tx);text-decoration:none;margin-right:auto}
.nav-links{display:flex;gap:4px}
.nav-links a{font-size:13px;color:var(--mu);text-decoration:none;padding:7px 13px;border-radius:20px;transition:all .2s}
.nav-links a:hover{color:var(--tx);background:var(--bd)}
.nav-toggle{display:none;width:32px;height:32px;border-radius:50%;border:1px solid var(--bd);background:transparent;color:var(--tx);cursor:pointer;align-items:center;justify-content:center;padding:0;font-size:18px;flex-shrink:0}
.nav-toggle span{display:block;width:16px;height:2px;background:var(--tx);position:relative;border-radius:999px}
.nav-toggle span::before,.nav-toggle span::after{content:'';position:absolute;left:0;width:16px;height:2px;background:var(--tx);border-radius:999px}
.nav-toggle span::before{top:-5px}
.nav-toggle span::after{top:5px}
/* Theme switcher */
.theme-trigger{width:30px;height:30px;border-radius:50%;border:2px solid var(--bd);cursor:pointer;transition:all .2s;flex-shrink:0}
.theme-trigger:hover{transform:scale(1.1);border-color:var(--ac)}
.theme-popup{position:fixed;top:72px;right:16px;background:var(--s);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;z-index:999;box-shadow:0 8px 32px rgba(0,0,0,.15);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;transform:translateY(-8px)}
.theme-popup.open{opacity:1;pointer-events:all;transform:translateY(0)}
.theme-popup h4{font-size:11px;color:var(--mu);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px}
.theme-swatches{display:flex;gap:8px}
.swatch{width:32px;height:32px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:all .2s;position:relative}
.swatch:hover{transform:scale(1.15)}
.swatch.active::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.swatch-label{font-size:10px;text-align:center;color:var(--mu);margin-top:4px}
.theme-swatch-wrap{display:flex;flex-direction:column;align-items:center}

@media(max-width:768px){
  nav{padding:0 16px;}
  .nav-links{position:fixed;top:64px;left:0;right:0;background:var(--nav-bg);padding:8px 16px;border-bottom:1px solid var(--bd);flex-direction:column;gap:4px;max-height:0;overflow:hidden;transition:max-height .25s ease;}
  .nav-links.open{max-height:220px;}
  .nav-links a{padding:9px 10px;}
  .nav-toggle{display:flex;}
}

/* HERO：避免首屏黑屏，用页面背景 + 深灰占位，图片加载前不显示纯黑 */
.hero{position:relative;width:100%;overflow:hidden;background:var(--bg)}
.slides{display:flex;height:100%;transition:transform .7s cubic-bezier(.4,0,.2,1)}
.slide{min-width:100%;height:100%;position:relative;display:flex;align-items:center;justify-content:center}
.slide-bg{position:absolute;inset:0;background:#2a2a2a;background-size:cover;background-position:center;filter:brightness(.52)}
.slide-content{position:relative;z-index:2;text-align:center;color:#fff;padding:0 40px}
.slide-tag{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--ac);margin-bottom:14px}
.slide-title{font-family:'Playfair Display',serif;font-size:clamp(28px,5vw,58px);font-weight:700;line-height:1.1;margin-bottom:14px}
.slide-sub{font-size:15px;font-weight:300;color:rgba(255,255,255,.75);max-width:480px;margin:0 auto 26px}
.slide-btn{display:inline-block;padding:11px 28px;background:var(--ac);color:#fff;text-decoration:none;border-radius:28px;font-size:13px;transition:all .3s;border:2px solid var(--ac)}
.slide-btn:hover{background:transparent;color:var(--ac)}
.hero-dots{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:7px;z-index:5}
.hero-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.4);cursor:pointer;transition:all .3s}
.hero-dot.active{background:#fff;width:22px;border-radius:3px}
.hero-arr{position:absolute;top:50%;transform:translateY(-50%);z-index:5;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:20px;backdrop-filter:blur(6px);transition:all .2s}
.hero-arr:hover{background:rgba(255,255,255,.28)}
.hero-arr.prev{left:20px}.hero-arr.next{right:20px}

/* ── SHOWCASE ── */
.showcase-section{padding:32px 0 8px;max-width:100%}
.showcase-header{display:flex;align-items:baseline;gap:12px;margin-bottom:20px;padding:0 24px}
.showcase-title{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:var(--tx)}
.showcase-sub{font-size:12px;color:var(--mu);letter-spacing:.06em}
.showcase-section{position:relative}
.showcase-track-wrap{overflow:hidden;width:100%;position:relative;cursor:grab;user-select:none;border-radius:14px}
.showcase-track-wrap:active{cursor:grabbing}
.showcase-track{display:flex;gap:14px;will-change:transform;transition:none}
.showcase-track.no-transition{transition:none!important}
.sc-card{border-radius:14px;overflow:hidden;background:var(--s);box-shadow:0 1px 8px rgba(0,0,0,.07);cursor:pointer;position:relative;transition:transform .3s,box-shadow .3s}
.sc-card:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(0,0,0,.14)}
.sc-thumb{position:relative;overflow:hidden;background:#111;font-size:0;line-height:0}
.sc-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;vertical-align:top;transition:transform .4s}
.sc-card:hover .sc-thumb img{transform:scale(1.04)}
.sc-play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.22);backdrop-filter:blur(8px);border:2px solid rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;z-index:3;pointer-events:none;transition:all .3s}
.sc-card:hover .sc-play{background:rgba(255,255,255,.36);transform:translate(-50%,-50%) scale(1.1)}
.sc-play svg{margin-left:3px}
.sc-like{position:absolute;top:9px;right:9px;z-index:4;display:flex;flex-direction:row;align-items:center;gap:6px;flex-wrap:nowrap}
.sc-like-btn{width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.35);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;transition:all .22s;padding:0;flex-shrink:0}
.sc-like-btn:hover{background:rgba(220,50,80,.5);transform:scale(1.1)}
.sc-like-btn.liked{background:rgba(220,50,80,.4);border-color:rgba(220,50,80,.8)}
.sc-like-cnt{font-size:10px;font-weight:600;color:#fff;background:rgba(0,0,0,.5);padding:2px 6px;border-radius:6px;backdrop-filter:blur(4px);white-space:nowrap;opacity:0;transition:opacity .2s;display:inline-flex;align-items:center;justify-content:center;min-height:18px;line-height:1;flex-shrink:0}
.sc-card:hover .sc-like-cnt,.sc-like-btn.liked~.sc-like-cnt{opacity:1}
.sc-info{padding:10px 12px 12px}
.sc-info h4{font-size:13px;font-weight:500;color:var(--tx);margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc-info p{font-size:11px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* TOOLBAR */
.toolbar{padding:13px 24px;display:flex;align-items:center;gap:8px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--bd);background:var(--s)}
.toolbar::-webkit-scrollbar{display:none}
.cat-btn{white-space:nowrap;padding:7px 16px;border-radius:20px;font-size:13px;border:1px solid var(--bd);background:transparent;color:var(--mu);cursor:pointer;transition:all .2s;font-family:inherit}
.cat-btn:hover{border-color:var(--ac);color:var(--ac)}
.cat-btn.active{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.sort-sel{margin-left:auto;padding:7px 12px;border-radius:8px;font-size:13px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);cursor:pointer;outline:none;font-family:inherit;flex-shrink:0}

/* MASONRY */
.masonry-wrap{padding:20px 16px 60px}
.masonry{position:relative;width:100%}
.masonry-loading .loader{display:block}
@keyframes skeleton-pulse{0%,100%{opacity:.85}50%{opacity:.5}}
.m-item{position:absolute;border-radius:14px;overflow:hidden;background:var(--s);cursor:pointer;box-shadow:0 1px 6px rgba(0,0,0,.06);transition:transform .3s,box-shadow .3s;animation:fadeIn .35s ease both}
@keyframes fadeIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
.m-item:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(0,0,0,.13)}
.thumb-wrap{position:relative;overflow:hidden;background:#f0ede8}
[data-theme=dark] .thumb-wrap{background:#252833}
.thumb-wrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
/* 多图堆叠 */
.thumb-stack{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.thumb-stack .stack-layer{position:absolute;border-radius:10px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.25);background:#111}
.thumb-stack .stack-layer img{width:100%;height:100%;object-fit:cover;display:block}
.thumb-stack .stack-layer:nth-child(1){width:78%;height:78%;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-4deg);z-index:1}
.thumb-stack .stack-layer:nth-child(2){width:82%;height:82%;left:50%;top:50%;transform:translate(-48%,-52%) rotate(2deg);z-index:2}
.thumb-stack .stack-layer:nth-child(3){width:86%;height:86%;left:50%;top:50%;transform:translate(-52%,-48%) rotate(-1deg);z-index:3}
.m-item .stack-count{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);z-index:4;font-size:11px;font-weight:600;color:#fff;background:rgba(0,0,0,.55);padding:2px 8px;border-radius:10px;backdrop-filter:blur(6px);pointer-events:none}
.thumb-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:32px;color:var(--mu)}
.item-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.7) 0%,transparent 58%);opacity:0;transition:opacity .3s;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;pointer-events:none}
.m-item:hover .item-overlay{opacity:1}
.overlay-title{color:#fff;font-size:13px;font-weight:500;margin-bottom:3px;line-height:1.3}
.overlay-cats{color:var(--ac);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.vid-badge{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.5);color:#fff;font-size:10px;padding:3px 8px;border-radius:10px;backdrop-filter:blur(6px);z-index:2;pointer-events:none}
.vid-play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.22);backdrop-filter:blur(8px);border:2px solid rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;z-index:3;pointer-events:none;transition:all .3s}
.m-item:hover .vid-play{background:rgba(255,255,255,.36);transform:translate(-50%,-50%) scale(1.1)}
.vid-play svg{margin-left:3px}
/* LIKE - top right corner */
.like-corner{position:absolute;top:9px;right:9px;z-index:4;display:flex;flex-direction:row;align-items:center;gap:6px;flex-wrap:nowrap;justify-content:flex-end}
.like-btn{width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.35);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;transition:all .22s;padding:0;line-height:1;opacity:0;flex-shrink:0}
.like-btn:hover{background:rgba(220,50,80,.5);border-color:rgba(220,50,80,.7);transform:scale(1.1)}
.like-btn.liked{background:rgba(220,50,80,.4);border-color:rgba(220,50,80,.8);opacity:1}
.like-btn.fav-active{color:#f4d03f;opacity:1}
.m-item:hover .like-btn{opacity:1}
.like-badge{font-size:10px;font-weight:600;color:#fff;background:rgba(0,0,0,.5);padding:2px 6px;border-radius:8px;backdrop-filter:blur(4px);white-space:nowrap;opacity:0;transition:opacity .2s;display:inline-flex;align-items:center;justify-content:center;min-height:20px;line-height:1;flex-shrink:0}
.m-item:hover .like-badge,.like-btn.liked~.like-badge{opacity:1}

.loader{text-align:center;padding:40px;color:var(--mu)}
.loader-dots span{display:inline-block;width:7px;height:7px;background:var(--ac);border-radius:50%;margin:0 3px;animation:bonce 1.2s infinite both}
.loader-dots span:nth-child(2){animation-delay:.2s}.loader-dots span:nth-child(3){animation-delay:.4s}
@keyframes bonce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}
.end-msg{text-align:center;padding:40px;color:var(--mu);font-size:13px;display:none}

/* FOOTER */
@media(max-width:640px){}

/* FOOTER */
footer{background:#1a1a1a;color:rgba(255,255,255,.7);padding:48px 0 28px}
.footer-cols{max-width:960px;margin:0 auto;padding:0 48px;display:flex;align-items:flex-start;box-sizing:border-box;flex-wrap:nowrap;overflow:hidden}
.footer-copy{max-width:960px;margin:32px auto 0;padding:20px 48px 0;box-sizing:border-box;border-top:1px solid rgba(255,255,255,.12);text-align:center;font-size:12px;color:rgba(255,255,255,.35)}
.footer-brand-logo{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;color:#fff;letter-spacing:.15em;margin-bottom:12px}
.footer-brand-desc{font-size:13px;line-height:1.75;color:rgba(255,255,255,.55);white-space:pre-line}
.footer-col-title{color:#fff;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-bottom:14px}
footer ul{list-style:none;padding:0;margin:0}
footer ul li{margin-bottom:9px}
footer ul li a{color:rgba(255,255,255,.5);text-decoration:none;font-size:13px;transition:color .2s}
footer ul li a:hover{color:rgba(255,255,255,.9)}
@media(max-width:640px){.footer-cols{padding:0 24px;overflow-x:auto;-webkit-overflow-scrolling:touch}.footer-copy{padding:16px 24px 0}}

/* MODAL */
.modal{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.88);backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:stretch;justify-content:center;gap:0;padding:0;opacity:0;pointer-events:none;transition:opacity .3s;overscroll-behavior:contain;touch-action:none}
.modal.open{opacity:1;pointer-events:all}
.modal-inner{max-width:92vw;width:100%;height:100vh;max-height:100vh;margin:0 auto;position:relative;border-radius:0;overflow:hidden;display:flex;flex-direction:column}
.modal-body-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;overflow-x:auto;overflow-y:hidden}
.modal-body-wrap>#modalBody{flex:1;min-height:0;min-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.modal-info{flex-shrink:0}
.modal-body-wrap .modal-zoom-wrap{flex:1;min-height:0;width:100%;max-height:100%;overflow:hidden;cursor:grab;touch-action:none;position:relative;display:flex;align-items:center;justify-content:center;background:#111}
.modal-inner img,.modal-inner video,.modal-inner model-viewer{max-width:100%;max-height:100%;display:block;object-fit:contain}
.modal-multi-wrap{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.22) transparent}
.modal-multi-wrap::-webkit-scrollbar{width:6px}
.modal-multi-wrap::-webkit-scrollbar-track{background:transparent}
.modal-multi-wrap::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:3px}
.modal-multi-wrap::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.28)}
.modal-multi-wrap.images-have-gap .modal-multi-slide{margin-bottom:var(--multi-gap,10px)}
.modal-multi-wrap.images-have-gap .modal-multi-slide:last-child{margin-bottom:0}
.modal-multi-slide{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:0}
.modal-multi-slide .modal-zoom-wrap{flex:1;min-height:100vh;width:100%;max-height:100vh;overflow:hidden;cursor:grab;touch-action:none;position:relative;display:flex;align-items:center;justify-content:center;background:#111}
.modal-multi-slide .modal-zoom-inner{transform-origin:center center;transition:transform .15s ease-out;will-change:transform}
.modal-multi-slide .modal-zoom-inner.no-transition{transition:none}
.modal-multi-slide .modal-zoom-inner img{width:100%;max-height:100vh;height:auto;object-fit:contain;display:block;user-select:none;pointer-events:none}
.modal-zoom-wrap:active{cursor:grabbing}
.modal-zoom-inner{transform-origin:center center;transition:transform .15s ease-out;will-change:transform}
.modal-zoom-inner.no-transition{transition:none}
.modal-comments-toggle{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;padding:4px 10px;border-radius:8px;font-size:12px;cursor:pointer;transition:background .2s}
.modal-comments-toggle:hover{background:rgba(255,255,255,.2)}
.modal-comments{max-height:180px;overflow-y:auto;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.15);scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.22) transparent}
.modal-comments::-webkit-scrollbar{width:6px}
.modal-comments::-webkit-scrollbar-track{background:transparent}
.modal-comments::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:3px}
.modal-comments::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.28)}
.modal-comments h4{font-size:12px;color:rgba(255,255,255,.7);margin-bottom:8px}
.modal-comment-item{font-size:11px;color:rgba(255,255,255,.85);margin-bottom:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.modal-comment-item:last-child{border-bottom:none}
.modal-comment-meta{color:rgba(255,255,255,.5);margin-bottom:3px}
.modal-comment-form{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.modal-comment-form input,.modal-comment-form textarea{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:8px 10px;color:#fff;font-size:12px;font-family:inherit}
.modal-comment-form input{flex:0 0 100px}
.modal-comment-form textarea{flex:1;min-width:120px;min-height:52px;resize:vertical}
.modal-top-actions{position:absolute;top:12px;right:50px;display:flex;align-items:center;gap:6px;z-index:2}
.modal-fav-btn{width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.25);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;backdrop-filter:blur(6px);transition:background .2s;flex-shrink:0}
.modal-fav-btn:hover{background:rgba(200,169,126,.6)}
.modal-big-btn{height:32px;padding:0 14px;border-radius:16px;background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.25);cursor:pointer;font-size:12px;display:flex;align-items:center;gap:5px;backdrop-filter:blur(6px);transition:background .2s;white-space:nowrap}
.modal-big-btn:hover{background:rgba(200,169,126,.7)}
.modal-close{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;border:none;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;z-index:2}
.img-fail{min-height:100px;background:var(--s2);display:flex;align-items:center;justify-content:center;border-radius:10px}
.img-fail::after{content:'图片加载失败';font-size:11px;color:var(--mu)}
.modal-info{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(to top,rgba(0,0,0,.8),transparent);padding:36px 20px 20px;color:#fff;border-radius:0 0 18px 18px}
.modal-info h2{font-family:'Playfair Display',serif;font-size:20px}
.modal-info p,.modal-info>div{font-size:12px;color:rgba(255,255,255,.7);margin-top:3px}.modal-info div p{margin:2px 0;font-size:12px}
.modal-hint-out{max-width:min(92vw,900px);padding:8px 12px;border-radius:10px;background:rgba(0,0,0,.52);border:1px solid rgba(255,255,255,.2);font-size:12px;color:rgba(255,255,255,.92);backdrop-filter:blur(8px);line-height:1.5}

/* FX：画布和鼠标镜片通用样式 */
#fxCanvasLayer{position:fixed;inset:0;pointer-events:none;z-index:0}
.fx-glass-lens{position:fixed;width:140px;height:140px;border-radius:999px;border:1px solid rgba(255,255,255,.4);background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.4),rgba(255,255,255,.02));backdrop-filter:blur(14px);box-shadow:0 12px 40px rgba(0,0,0,.25);pointer-events:none;mix-blend-mode:screen;opacity:0;transform:translate(-9999px,-9999px);transition:opacity .25s ease;}
[data-theme=dark] .fx-glass-lens{border-color:rgba(255,255,255,.26);background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.32),rgba(0,0,0,.1));mix-blend-mode:screen;}

@media(max-width:768px){nav{padding:0 14px}.toolbar{padding:10px 12px}}

/* ── 详情精选 ── */
.featured-section{padding:32px 0 8px}
.featured-header{display:flex;align-items:baseline;gap:12px;margin-bottom:20px;padding:0 24px}
.featured-title{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:var(--tx)}
.featured-sub{font-size:12px;color:var(--mu);letter-spacing:.06em}
.featured-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;padding:0 24px}
.featured-card{position:relative;border-radius:12px;overflow:hidden;cursor:pointer;background:var(--s2);border:1px solid var(--bd);transition:transform .2s,box-shadow .2s}
.featured-card:hover{transform:translateY(-3px);box-shadow:0 10px 40px rgba(0,0,0,.25)}
.featured-card img{width:100%;height:280px;object-fit:cover;object-position:top;display:block;transition:opacity .2s}
.featured-card-info{padding:12px 14px}
.featured-card-title{font-size:13px;font-weight:600;color:var(--tx);margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.featured-card-count{font-size:11px;color:var(--mu)}
.featured-card-badge{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.5);color:#fff;font-size:10px;padding:3px 7px;border-radius:10px;backdrop-filter:blur(6px)}
/* 查看器 */
.fv-overlay{position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:2000;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .25s}
.fv-overlay.open{opacity:1;pointer-events:all}
.fv-header{display:flex;align-items:center;gap:12px;padding:14px 18px;flex-shrink:0;position:relative;z-index:10}
.fv-close{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.12);border:none;color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;flex-shrink:0}
.fv-close:hover{background:rgba(255,255,255,.22)}
.fv-title{color:#fff;font-size:15px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fv-counter{color:rgba(255,255,255,.5);font-size:12px;flex-shrink:0}
.fv-body{flex:1;display:flex;position:relative;overflow:hidden;min-height:0}
.fv-main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.fv-img-wrap{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;padding-right:8px}
.fv-img-wrap::-webkit-scrollbar{width:4px}
.fv-img-wrap::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:2px}
.fv-list{width:100%;max-width:900px;margin:0 auto}
.fv-list img{width:100%;display:block;object-fit:cover}
.fv-aside{width:280px;flex-shrink:0;display:flex;flex-direction:column;gap:10px;overflow-y:auto;padding:10px;background:rgba(255,255,255,.04);border-left:1px solid rgba(255,255,255,.08)}
.fv-aside::-webkit-scrollbar{width:4px}
.fv-aside::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:2px}
.fv-thumb-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.fv-thumb{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:6px;border:2px solid transparent;cursor:pointer;opacity:.75;transition:all .15s}
.fv-thumb:hover{opacity:.95}
.fv-thumb.active{border-color:var(--ac,#c8a97e);opacity:1}
.fv-content{padding:10px 2px 16px;color:rgba(255,255,255,.88);font-size:14px;line-height:1.75;border-top:1px solid rgba(255,255,255,.08)}
.fv-content:empty{display:none}
.fv-comments{margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.1)}
.fv-comments h4{font-size:12px;color:rgba(255,255,255,.7);margin-bottom:8px}
.fv-comment-item{font-size:11px;color:rgba(255,255,255,.85);margin-bottom:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.fv-comment-item:last-child{border-bottom:none}
.fv-comment-meta{color:rgba(255,255,255,.5);margin-bottom:3px}
.fv-comment-form{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.fv-comment-form input,.fv-comment-form textarea{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:8px 10px;color:#fff;font-size:12px;font-family:inherit}
.fv-comment-form textarea{min-height:52px;resize:vertical}
.fv-comment-form button{padding:8px 14px;border-radius:8px;background:var(--ac);color:#fff;border:none;cursor:pointer;font-size:12px;align-self:flex-start}

</style>
</head>
<body>
<nav>
  <a class="nav-logo" href="/" id="navLogo">GAL·LERY</a>
  <button class="nav-toggle" type="button" onclick="toggleNavMenu()" aria-label="切换导航"><span></span></button>
  <div class="nav-links" id="navLinks"></div>
  <div style="position:relative">
    <div class="theme-trigger" id="themeBtn" onclick="togglePicker()" title="切换配色"></div>
    <div class="theme-popup" id="themePop">
      <h4>配色方案</h4>
      <div class="theme-swatches">
        <div class="theme-swatch-wrap"><div class="swatch" style="background:linear-gradient(135deg,#c8a97e,#f0e0c0)" data-t="warm" onclick="applyTheme('warm')"></div><div class="swatch-label">暖金</div></div>
        <div class="theme-swatch-wrap"><div class="swatch" style="background:linear-gradient(135deg,#4a90d9,#a0c8f8)" data-t="cool" onclick="applyTheme('cool')"></div><div class="swatch-label">清蓝</div></div>
        <div class="theme-swatch-wrap"><div class="swatch" style="background:linear-gradient(135deg,#333,#7c6af5)" data-t="dark" onclick="applyTheme('dark')"></div><div class="swatch-label">暗夜</div></div>
        <div class="theme-swatch-wrap"><div class="swatch" style="background:linear-gradient(135deg,#4a9460,#a8e0b0)" data-t="green" onclick="applyTheme('green')"></div><div class="swatch-label">绿意</div></div>
        <div class="theme-swatch-wrap"><div class="swatch" style="background:linear-gradient(135deg,#d4607a,#f8b0c0)" data-t="rose" onclick="applyTheme('rose')"></div><div class="swatch-label">玫瑰</div></div>
      </div>
    </div>

</nav>

<section class="hero" id="heroSec" style="display:none">
  <div class="slides" id="slides"></div>
  <button class="hero-arr prev" onclick="chSlide(-1)">&#8249;</button>
  <button class="hero-arr next" onclick="chSlide(1)">&#8250;</button>

</section>

<section id="showcase-section" style="display:none">
  <div class="showcase-section">
    <div class="showcase-header">
      <span class="showcase-title" id="showcaseTitle">橱窗精选</span>
      <span class="showcase-sub" id="showcaseSub">SHOWCASE</span>
    </div>
    <div class="showcase-track-wrap" id="showcaseWrap">
      <div class="showcase-track" id="showcaseRow"></div>
    </div>
  </div>
  <div style="height:1px;background:var(--bd);margin-top:8px"></div>
</section>

<section id="featured-section-after-showcase" style="display:none">
  <div class="featured-section" id="featuredBlock">
    <div class="featured-header">
      <span class="featured-title" id="featuredTitle">详情精选</span>
      <span class="featured-sub" id="featuredSub">FEATURED</span>
    </div>
    <div class="featured-grid" id="featuredGrid"></div>

</section>


<div id="gallery">
  <div class="toolbar" id="toolbar">
    <button class="cat-btn" id="favFilterBtn" data-fav-only="0" onclick="toggleFavFilter(this)">☆ 我的收藏</button>
    <button class="cat-btn active" data-cat="" onclick="filterCat('',this)">全部</button>
    <select class="sort-sel" id="sortSel" onchange="changeSort(this.value)">
      <option value="newest">最新上传</option>
      <option value="oldest">最早上传</option>

</div>

  <div class="loader" id="loader" style="display:none"><div class="loader-dots"><span></span><span></span><span></span></div></div>

</div>

<section id="featured-section-before-footer" style="display:none">
  <div style="height:1px;background:var(--bd);margin-bottom:24px"></div>
  <div class="featured-section">
    <div class="featured-header">
      <span class="featured-title" id="featuredTitleB">详情精选</span>
      <span class="featured-sub" id="featuredSubB">FEATURED</span>
    </div>
    <div class="featured-grid" id="featuredGridB"></div>

<footer>

</footer>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="作品详情" onclick="if(event.target===this)closeModal()">
  <div id="modalHintTop" class="modal-hint-out" style="display:none"></div>
  <div class="modal-inner">
    <button class="modal-close" onclick="closeModal()" aria-label="关闭">&#215;</button>
    <div class="modal-top-actions">
      <button id="modalFavBtn" class="modal-fav-btn" onclick="toggleModalFav(event)" title="收藏" aria-label="收藏或取消收藏" style="display:none">☆</button>
      <button id="modalBigBtn" class="modal-big-btn" onclick="void 0" style="display:none" aria-label="在新窗口查看大图"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>查看大图</button>
    </div>
    <div class="modal-body-wrap"><div id="modalBody"></div></div>
    <div class="modal-info"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap"><h2 id="modalTitle" style="margin:0"></h2><button type="button" id="modalCommentsToggle" class="modal-comments-toggle" onclick="toggleModalComments()" title="显示/隐藏评论" style="display:none">💬 评论</button></div><div id="modalDesc" style="font-size:12px;color:rgba(255,255,255,.7);margin-top:3px"></div><div id="modalComments" class="modal-comments" style="display:none"></div></div>
  </div>
  <div id="modalHintBottom" class="modal-hint-out" style="display:none"></div>
</div>

<script>
const THEME_COLORS={warm:'#c8a97e',cool:'#4a90d9',dark:'#7c6af5',green:'#4a9460',rose:'#d4607a'};
let curSlide=0,slideTotal=0,autoT;
let curPage=1,loading=false,hasMore=true,curCats=[],curSort='newest',curFavOnly=false;
let modelHintText = '🖱️ 左键旋转 · 滚轮缩放 · 右键平移';
let modelHintPos = 'bottom';
let modelHintBg = 'rgba(0,0,0,.52)';
let modelHintColor = 'rgba(255,255,255,.92)';
let modelHintFontSize = 12;
let modelHintMaxWidth = 900;
let modelHintRadius = 10;
const itemMap={};
const modalOrder=[];
const scOrder=[];
let modalCurrentId='';
let modalSource='masonry';
let _modalWheelLock=false;
let _modalTouchStartY=null;
let _pageScrollTop=0;
let _pageScrollLocked=false;
let _modalHistoryPushed=false;
let _fvHistoryPushed=false;
let _modalPrevFocus=null;
function _modalFocusTrap(e){
  if(e.key!=='Tab')return;
  const modal=document.getElementById('modal');
  if(!modal||!modal.classList.contains('open'))return;
  const focusable=modal.querySelectorAll('button,[href],input,textarea,select,[tabindex]:not([tabindex="-1"])');
  const arr=Array.from(focusable).filter(el=>!el.hasAttribute('disabled')&&el.offsetParent!==null);
  if(!arr.length)return;
  const idx=arr.indexOf(document.activeElement);
  const next=e.shiftKey?(idx<=0?arr.length-1:idx-1):(idx===-1||idx>=arr.length-1?0:idx+1);
  arr[next].focus();
  e.preventDefault();
}
let _lastCardObserver=null;
let _lastCardHintAt=0;
let _featuredOrder=[];
let _featuredMap={};
let _fvCurrentId='';
let _fvNavLock=false;
let _fvTouchStartY=null;
function extOf(f){return String(f||'').split('?')[0].split('.').pop().toLowerCase();}
function isModelByFile(f){const e=extOf(f);return e==='glb'||e==='gltf';}
function isVideoByFile(f){const e=extOf(f);return e==='mp4'||e==='mov'||e==='webm';}
function itemIsModel(it){return it&&(((it.type||'').toLowerCase()==='model')||isModelByFile(it.filename));}
function itemIsVideo(it){return it&&(((it.type||'').toLowerCase()==='video')||isVideoByFile(it.filename));}

function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  localStorage.setItem('g_theme',t);
  document.getElementById('themeBtn').style.background=THEME_COLORS[t]||'#c8a97e';
  document.querySelectorAll('.swatch').forEach(s=>s.classList.toggle('active',s.dataset.t===t));
}
function togglePicker(){document.getElementById('themePop').classList.toggle('open');}
document.addEventListener('click',e=>{if(!e.target.closest('.theme-trigger')&&!e.target.closest('.theme-popup'))document.getElementById('themePop').classList.remove('open');});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')clearTimeout(autoT);else if(slideTotal>1)startAuto();});

async function init(){
  const site=await fetch('/api/site').then(r=>r.json());
  const t=localStorage.getItem('g_theme')||(site.theme||'warm');
  applyTheme(t);
  const b=site.site||{};
  if(b.title)document.title=b.title;
  if(b.favicon)document.getElementById('faviconLink').href='/static/uploads/'+b.favicon;
  modelHintText = (b.model_hint||'').trim() || '🖱️ 左键旋转 · 滚轮缩放 · 右键平移';
  modelHintPos = ['top','bottom','none'].includes(b.model_hint_position) ? b.model_hint_position : 'bottom';
  modelHintBg = (b.model_hint_bg||'').trim() || 'rgba(0,0,0,.52)';
  modelHintColor = (b.model_hint_color||'').trim() || 'rgba(255,255,255,.92)';
  modelHintFontSize = Number(b.model_hint_font_size) || 12;
  modelHintMaxWidth = Number(b.model_hint_max_width) || 900;
  modelHintRadius = Number(b.model_hint_radius) || 10;
  // 读取炫酷效果开关，并在主题和 DOM 就绪后初始化
  const fxFlags = {
    particles: !!b.fx_particles,
    nodes: !!b.fx_nodes,
    glass: !!b.fx_glass,
    fluid: !!b.fx_fluid,
    card3d: !!b.fx_card3d,
    trail: !!b.fx_trail
  };
  renderNav(site.nav||{});
  if(site.hero?.enabled!==false) renderHero(site.hero||{});
  renderFooter(site.footer||{});
  loadCats();
  await Promise.all([loadShowcase(), loadFeatured()]);
  await loadMore();
  openModalFromHash();
  setupFx(fxFlags);
}
function openModalFromHash(){
  const hash=location.hash||'';
  let m=hash.match(/^#?gallery\/([^/]+)$/);
  if(m){
    const id=m[1];
    if(itemMap[id]){ openModal(id); return; }
    fetch('/api/items/'+encodeURIComponent(id)).then(r=>{if(!r.ok)return; return r.json();}).then(item=>{
      if(!item) return;
      itemMap[item.id]=item;
      if(!modalOrder.includes(item.id)) modalOrder.push(item.id);
      openModal(item.id);
    }).catch(()=>{});
    return;
  }
  m=hash.match(/^#?showcase\/([^/]+)$/);
  if(m&&scMap[m[1]]){ openScModal(m[1]); return; }
  m=hash.match(/^#?featured\/([^/]+)$/);
  if(m&&_featuredMap[m[1]]){ openFv(_featuredMap[m[1]]); return; }
}

function renderNav(nav){
  document.getElementById('navLogo').textContent=nav.logo||'GAL·LERY';
  document.getElementById('navLinks').innerHTML=(nav.links||[]).map(l=>`<a href="${l.href}" target="${l.target||'_self'}">${l.label}</a>`).join('');
}

function toggleNavMenu(){
  const links=document.getElementById('navLinks');
  if(!links)return;
  links.classList.toggle('open');
}

function renderHero(hero){
  const h=hero.height||540;
  const sec=document.getElementById('heroSec');
  sec.style.display='block';sec.style.height=h+'px';
  const sl=document.getElementById('slides');sl.style.height=h+'px';
  slideTotal=(hero.slides||[]).length;
  sl.innerHTML=(hero.slides||[]).map(s=>{
    const bgStyle=s.bgType==='image'
      ?`background-image:url('${fileSrc(s.bgValue)}');background-size:cover;background-position:center`
      :`background:${s.bgValue}`;
    return `<div class="slide"><div class="slide-bg" style="${bgStyle}"></div>
      <div class="slide-content"><div class="slide-tag">${s.tag||''}</div>
      <h1 class="slide-title">${s.title||''}</h1>
      <p class="slide-sub">${s.subtitle||''}</p>
      <a href="${s.btnHref||'#'}" class="slide-btn">${s.btnText||'查看'}</a></div></div>`;
  }).join('');
  const dots=document.getElementById('heroDots');dots.innerHTML='';
  for(let i=0;i<slideTotal;i++){const d=document.createElement('div');d.className='hero-dot'+(i===0?' active':'');d.onclick=()=>{clearTimeout(autoT);goSlide(i);startAuto();};dots.appendChild(d);}
  if(slideTotal>0){goSlide(0);startAuto();}
}
function goSlide(n){curSlide=(n+slideTotal)%slideTotal;document.getElementById('slides').style.transform=`translateX(-${curSlide*100}%)`;document.querySelectorAll('.hero-dot').forEach((d,i)=>d.classList.toggle('active',i===curSlide));}
function chSlide(d){clearTimeout(autoT);goSlide(curSlide+d);startAuto();}
function startAuto(){if(slideTotal>1&&document.visibilityState!=='hidden')autoT=setTimeout(()=>{goSlide(curSlide+1);startAuto();},5000);}

function renderFooter(ft){
  const colData = ft.columns||[];
  const brand = ft.brand||{};
  const copy = ft.copyright||'';

  const brandHtml = `
    <div style="flex:0 0 240px;padding-right:40px;flex-shrink:0">
      <p class="footer-brand-logo">${brand.logo||'GAL·LERY'}</p>
      <p class="footer-brand-desc">${brand.desc||''}</p>
    </div>`;

  const navHtml = colData.map(c=>{
    const links=(c.links||[]).map(l=>{
      const href=(l.label==='订阅RSS'&&!l.href)?'/feed.xml':(l.href||'#');
      return `<li><a href="${href}"${(l.target==='_blank')?' target="_blank"':''}>${l.label}</a></li>`;
    }).join('');
    const img = c.image ? `<img src="${fileSrc(c.image)}" style="width:100%;max-width:150px;height:72px;object-fit:cover;border-radius:8px;border:1px solid rgba(255,255,255,.14);margin-bottom:10px" onerror="this.style.display='none'">` : '';
    return `<div style="flex:1;min-width:120px">
      <p class="footer-col-title">${c.title}</p>
      ${img}
      <ul>${links}</ul>
    </div>`;
  }).join('');

  document.getElementById('footerInner').innerHTML =
    `<div class="footer-cols">${brandHtml}${navHtml}</div>` +
    `<div class="footer-copy"><p>${copy}</p></div>`;
}

// ── 橱窗 ──
const scMap = {};

let scScrollRAF = null, scScrollPaused = false, scScrollPos = 0, scScrollSpeed = 0;
let scDragStartX = 0, scDragScrollX = 0, scIsDragging = false;

async function loadShowcase() {
  const res = await fetch('/api/showcase').then(r => r.json());
  const cfg = res.config || {};
  const items = res.items || [];
  if (!cfg.enabled || !items.length) return;
  items.forEach(i => {
    scMap[i.id] = i;
    if(!scOrder.includes(i.id)) scOrder.push(i.id);
  });
  document.getElementById('showcaseTitle').textContent = cfg.title || '橱窗精选';
  document.getElementById('showcaseSub').textContent = cfg.subtitle || 'SHOWCASE';
  const cardH = Math.min(800, Math.max(100, parseInt(cfg.cardHeight)||200));
  const cardW = Math.min(600, Math.max(120, parseInt(cfg.cardWidth)||280));
  scScrollSpeed = Math.min(300, Math.max(0, parseInt(cfg.scrollSpeed)||0));
  const row = document.getElementById('showcaseRow');
  // 动态样式
  const styleId = 'sc-dyn-style';

  dynStyle.textContent = `.sc-thumb{height:${cardH}px!important}.sc-card{width:${cardW}px;flex-shrink:0}`;

        <div class="sc-play">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="rgba(255,255,255,.95)"><polygon points="5,3 19,12 5,21"/></svg>
        </div>
      </div>

        <span class="sc-like-cnt">${item.likes||0}</span>

        ${item.description?`<p>${esc(stripHtml(item.description))}</p>`:''}
      </div>`:''}
    </div>`;
  };
  // 填充卡片（如果开启滚动，复制两份实现无缝循环）
  const cards = items.map(makeCard).join('');
  row.innerHTML = scScrollSpeed > 0 ? cards + cards : cards;
  document.getElementById('showcase-section').style.display = 'block';
  // 恢复点赞状态
  restoreScLiked(items.map(i=>i.id));
  // 启动自动滚动
  if (scScrollRAF) cancelAnimationFrame(scScrollRAF);
  scScrollPos = 0; row.style.transform = 'translateX(0)';
  if (scScrollSpeed > 0) scStartScroll();
  // 拖拽滚动
  const wrap = document.getElementById('showcaseWrap');
  wrap.onmousedown = scDragStart;
  wrap.ontouchstart = scDragStart;
  document.onmousemove = scDragMove;
  document.ontouchmove = scDragMove;
  document.onmouseup = scDragEnd;
  document.ontouchend = scDragEnd;
  wrap.onmouseenter = () => scScrollPaused = true;
  wrap.onmouseleave = () => scScrollPaused = false;
}

function scStartScroll() {
  const row = document.getElementById('showcaseRow');
  if (!row) return;
  const halfW = row.scrollWidth / 2;
  let last = null;
  function step(ts) {
    if (document.visibilityState==='hidden') { last = ts; scScrollRAF = requestAnimationFrame(step); return; }
    if (!scScrollPaused && !scIsDragging) {
      const dt = last ? (ts - last) / 1000 : 0;
      scScrollPos += scScrollSpeed * dt;
      if (scScrollPos >= halfW) scScrollPos -= halfW;
      row.style.transform = `translateX(${-scScrollPos}px)`;
    }
    last = ts;
    scScrollRAF = requestAnimationFrame(step);
  }
  scScrollRAF = requestAnimationFrame(step);
}

function scDragStart(e) {
  scIsDragging = true;
  scScrollPaused = true;
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  scDragStartX = clientX + scScrollPos;
}
function scDragMove(e) {
  if (!scIsDragging) return;
  e.preventDefault && e.preventDefault();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  scScrollPos = Math.max(0, scDragStartX - clientX);
  const row = document.getElementById('showcaseRow');
  if (row) row.style.transform = `translateX(${-scScrollPos}px)`;
}
function scDragEnd() {
  scIsDragging = false;
  setTimeout(() => { scScrollPaused = false; }, 100);
}

// ── 绝对定位瀑布流（Pinterest 风格）──
const GAP = 14;
const COL_MIN_W = 220;
let _colCount = 0;
let _colTops = [];
let _colWidth = 0;
let _msnTotalCount = 0;
let _msnReady = false;  // masonry 宽度是否可用

function _msnCalcCols() {
  // 优先用 masonry-wrap 宽度（更早可用），fallback 到窗口宽度
  const mwrap = document.querySelector('.masonry-wrap');
  const W = (mwrap ? mwrap.clientWidth - 32 : 0) ||
            document.getElementById('masonry').offsetWidth ||
            (window.innerWidth - 32);
  const cols = Math.max(2, Math.floor((W + GAP) / (COL_MIN_W + GAP)));
  const colW = Math.floor((W - GAP * (cols - 1)) / cols);
  return { cols, colW };
}

// 建立列状态（只在 reset 时调用，追加时不调用）
function _msnSetup() {
  const { cols, colW } = _msnCalcCols();
  _colCount = cols;
  _colWidth = colW;
  _colTops = new Array(cols).fill(0);
  _msnReady = true;
}

// 追加一张卡片到最短列（先隐藏插入，读真实高度，再定位显示）
function _msnAppend(card) {
  const wrap = document.getElementById('masonry');
  // 先隐藏插入 DOM 以便读取真实高度
  card.style.visibility = 'hidden';
  card.style.width = _colWidth + 'px';
  card.style.position = 'absolute';
  card.style.top = '0px';
  card.style.left = '0px';
  wrap.appendChild(card);

  // 强制浏览器计算布局，读取真实高度
  const h = card.offsetHeight;

  // 找最短列定位
  let minIdx = 0;
  for (let i = 1; i < _colCount; i++) {
    if (_colTops[i] < _colTops[minIdx]) minIdx = i;
  }
  card.style.left = (minIdx * (_colWidth + GAP)) + 'px';
  card.style.top = _colTops[minIdx] + 'px';
  card.style.visibility = '';
  _colTops[minIdx] += h + GAP;
  wrap.style.height = Math.max(..._colTops) + 'px';
}

// resize 时整体重排（列宽变了才执行）
function _msnReflow() {
  const { cols, colW } = _msnCalcCols();
  // 列数和列宽都没变则跳过重排
  if (cols === _colCount && Math.abs(colW - _colWidth) < 2) return;
  _colCount = cols;
  _colWidth = colW;
  _colTops = new Array(cols).fill(0);
  const wrap = document.getElementById('masonry');
  wrap.querySelectorAll('.m-item').forEach(card => {
    card.style.width = _colWidth + 'px';
    card.style.visibility = 'hidden';
    card.style.top = '0px';
    card.style.left = '0px';
  });
  // 读完所有高度再批量定位（减少回流）
  const cards = wrap.querySelectorAll('.m-item');
  const heights = Array.from(cards).map(c => c.offsetHeight);
  cards.forEach((card, i) => {
    let minIdx = 0;
    for (let j = 1; j < _colCount; j++) {
      if (_colTops[j] < _colTops[minIdx]) minIdx = j;
    }
    card.style.left = (minIdx * (_colWidth + GAP)) + 'px';
    card.style.top = _colTops[minIdx] + 'px';
    card.style.visibility = '';
    _colTops[minIdx] += heights[i] + GAP;
  });
  wrap.style.height = Math.max(..._colTops) + 'px';
}

let _reflowTimer;
window.addEventListener('resize', () => {
  clearTimeout(_reflowTimer);
  _reflowTimer = setTimeout(_msnReflow, 200);
});

// ── 自动加载：每次加载一整屏内容 ──
function calcPageSize(){
  const colW=230, gap=14;
  const cols=Math.max(2, Math.floor((window.innerWidth-32)/(colW+gap)));
  const avgRowH=300;
  const rows=Math.ceil(window.innerHeight/avgRowH)+2;
  return Math.max(cols*rows, 12);
}
let autoPageSize=calcPageSize();
window.addEventListener('resize',()=>{ autoPageSize=calcPageSize(); });

async function loadMoreWithSize(size){
  if(loading||!hasMore)return;
  loading=true;
  const wrap=document.getElementById('masonry');
  const mwrap=document.querySelector('.masonry-wrap');
  if(mwrap){ mwrap.classList.add('masonry-loading'); mwrap.setAttribute('aria-busy','true'); }
  document.getElementById('loader').style.display='block';
  let p;
  if(curFavOnly){
    const ids=getFavIds();
    if(!ids.length){
      if(mwrap){ mwrap.classList.remove('masonry-loading'); mwrap.removeAttribute('aria-busy'); }
      document.getElementById('loader').style.display='none';
      const endEl=document.getElementById('endMsg');
      if(endEl){ endEl.textContent='暂无收藏，在作品上点击 ★ 即可收藏'; endEl.style.display='block'; }
      loading=false;
      return;
    }
    p=new URLSearchParams({ids:ids.join(','),per_page:100,sort:curSort});
  }else{
    p=new URLSearchParams({page:curPage,per_page:size,sort:curSort});
    curCats.forEach(c=>p.append('category',c));
  }
  let data;
  try{ data=await fetch('/api/items?'+p).then(r=>r.json()); }finally{ if(mwrap){ mwrap.classList.remove('masonry-loading'); mwrap.removeAttribute('aria-busy'); } }
  if(!data||!Array.isArray(data.items)){ loading=false; document.getElementById('loader').style.display='none'; return; }
  let idx=_msnTotalCount;
  const newIds=data.items.map(i=>i.id);
  if (!_msnReady) _msnSetup();
  data.items.forEach(item=>{
    itemMap[item.id]=item;
    if(!modalOrder.includes(item.id)) modalOrder.push(item.id);
    const card=mkCard(item,idx++);
    _msnAppend(card);
    _msnTotalCount++;
  });
  hasMore=curFavOnly?false:data.has_more; if(!curFavOnly)curPage++; loading=false;
  document.getElementById('loader').style.display='none';
  if(!hasMore) document.getElementById('endMsg').style.display='block';
  // 恢复点赞状态
  restoreItemLiked(newIds);
  // 绑定“最后一个卡片触发下一页”
  bindLastCardAutoLoad();
  // 加载完一批后检查：若当前内容未填满屏幕则继续加载
  checkFillScreen();
}

// 检查内容是否已填满视口，未满时继续加载
function checkFillScreen(){
  if(!hasMore||loading)return;
  const sentinel=document.getElementById('scrollSentinel');
  if(sentinel&&sentinel.getBoundingClientRect().top<=window.innerHeight+200){
    loadMoreWithSize(autoPageSize);
  }
}

function bindLastCardAutoLoad(){
  const wrap=document.getElementById('masonry');
  if(!wrap) return;
  const cards=wrap.querySelectorAll('.m-item');
  const last=cards[cards.length-1];
  if(!last) return;
  if(_lastCardObserver){_lastCardObserver.disconnect();_lastCardObserver=null;}
  _lastCardObserver=new IntersectionObserver((entries)=>{
    const ent=entries[0];
    if(!ent||!ent.isIntersecting) return;
    if(loading||!hasMore) return;
    const now=Date.now();
    if(now-_lastCardHintAt>900){
      showToast('已到当前页末尾，正在加载下一页…',1800);
      _lastCardHintAt=now;
    }
    loadMoreWithSize(autoPageSize);
  },{root:null,threshold:0.65,rootMargin:'0px 0px 120px 0px'});
  _lastCardObserver.observe(last);
}

// IntersectionObserver 监听哨兵元素（始终可见）
const obs=new IntersectionObserver(entries=>{
  if(entries[0].isIntersecting&&!loading&&hasMore){
    loadMoreWithSize(autoPageSize);
  }
},{rootMargin:'400px'});
obs.observe(document.getElementById('scrollSentinel'));

// scroll 事件双保险（处理浏览器兼容性）
window.addEventListener('scroll',()=>{
  if(loading||!hasMore)return;
  if(window.innerHeight+window.scrollY>=document.body.offsetHeight-300){
    loadMoreWithSize(autoPageSize);
  }
},{passive:true});

  if(_pageScrollLocked) return;

  document.documentElement.style.overflow = 'hidden';

  _pageScrollLocked = true;

function openModalByOffset(step){

  const idx = list.indexOf(modalCurrentId);
  if(idx < 0) return;
  const next = idx + step;
  if(next < 0 || next >= list.length) return;
  const nextId = list[next];
  if(modalSource === 'showcase') openScModal(nextId);
  else openModal(nextId);
}

function handleModalWheel(e){
  const modal = document.getElementById('modal');
  if(!modal || !modal.classList.contains('open')) return;
  if(_modalWheelLock) return;
  if(e.target.closest('#modalComments')) return;
  const wrap = e.target.closest('#modalMultiWrap');
  if(wrap){
    const zoomWrap = e.target.closest('.modal-zoom-wrap');
    const zoomed = zoomWrap && _modalZoom.scale > 1;
    if(zoomed) return;
    const top = wrap.scrollTop <= 12;
    const bottom = wrap.scrollHeight - wrap.clientHeight - wrap.scrollTop <= 12;
    if(e.deltaY < 0 && top){ e.preventDefault(); _modalWheelLock = true; showToast('已自动切换到上一章'); openModalByOffset(-1); setTimeout(()=>{ _modalWheelLock = false; }, 180); }
    else if(e.deltaY > 0 && bottom){ e.preventDefault(); _modalWheelLock = true; showToast('已自动切换到下一章'); openModalByOffset(1); setTimeout(()=>{ _modalWheelLock = false; }, 180); }
    return;
  }
  if(Math.abs(e.deltaY) < 8) return;
  e.preventDefault();
  _modalWheelLock = true;
  openModalByOffset(e.deltaY > 0 ? 1 : -1);
  setTimeout(()=>{ _modalWheelLock = false; }, 180);
}

function handleModalTouchStart(e){
  const modal = document.getElementById('modal');
  if(!modal || !modal.classList.contains('open')) return;
  if(!e.touches || !e.touches.length) return;
  _modalTouchStartY = e.touches[0].clientY;
}

function handleModalTouchEnd(e){
  const modal = document.getElementById('modal');
  if(!modal || !modal.classList.contains('open')) return;
  if(_modalWheelLock) return;
  if(_modalTouchStartY == null) return;
  const y = (e.changedTouches && e.changedTouches[0]) ? e.changedTouches[0].clientY : _modalTouchStartY;
  const dy = y - _modalTouchStartY;
  _modalTouchStartY = null;
  if(Math.abs(dy) < 36) return;
  const wrap = document.getElementById('modalMultiWrap');
  if(wrap && wrap.scrollHeight > wrap.clientHeight){
    if(_modalZoom.scale > 1) return;
    const top = wrap.scrollTop <= 12;
    const bottom = wrap.scrollHeight - wrap.clientHeight - wrap.scrollTop <= 12;
    if(dy > 0 && top){ _modalWheelLock = true; showToast('已自动切换到上一章'); openModalByOffset(-1); setTimeout(()=>{ _modalWheelLock = false; }, 220); return; }
    if(dy < 0 && bottom){ _modalWheelLock = true; showToast('已自动切换到下一章'); openModalByOffset(1); setTimeout(()=>{ _modalWheelLock = false; }, 220); return; }
  }
  _modalWheelLock = true;
  openModalByOffset(dy < 0 ? 1 : -1);
  setTimeout(()=>{ _modalWheelLock = false; }, 220);
}

function createFullscreenCanvas(id,z){
  let c=document.getElementById(id);
  if(c) return c;
  c=document.createElement('canvas');
  c.id=id;
  c.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:'+z+';';
  document.body.appendChild(c);
  const resize=()=>{c.width=window.innerWidth;c.height=window.innerHeight;};
  window.addEventListener('resize',resize);
  resize();
  return c;
}

// 粒子尾巴
function initFxParticles(flags){
  const canvas=createFullscreenCanvas('fxParticles',1);
  const ctx=canvas.getContext('2d');
  const particles=[];
  let lastX=null,lastY=null;
  document.addEventListener('pointermove',e=>{
    const x=e.clientX;
    const y=e.clientY;
    const speed=lastX==null?0:Math.hypot(x-lastX,y-lastY);
    lastX=x;lastY=y;
    if(flags.particles){
      particles.push({
        x,y,
        vx:(Math.random()-0.5)*80,
        vy:(Math.random()-0.5)*80,
        life:1,
        size:2+Math.random()*2
      });
    }
  });
  function step(ts){
    requestAnimationFrame(step);
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i];
      p.life-=0.02;
      if(p.life<=0){particles.splice(i,1);continue;}
      p.x+=p.vx*0.016;
      p.y+=p.vy*0.016;
      const alpha=p.life;
      ctx.beginPath();
      ctx.fillStyle='rgba(200,169,126,'+alpha+')';
      ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
      ctx.fill();
    }
  }
  requestAnimationFrame(step);
}

// 2: 背景几何连线网格
function initFxNodes(){
  const canvas=createFullscreenCanvas('fxNodes',0);
  const ctx=canvas.getContext('2d');
  const points=[];
  const count=60;
  for(let i=0;i<count;i++){
    points.push({
      x:Math.random()*canvas.width,
      y:Math.random()*canvas.height,
      vx:(Math.random()-0.5)*0.4,
      vy:(Math.random()-0.5)*0.4
    });
  }
  let mouse={x:null,y:null};
  document.addEventListener('pointermove',e=>{
    mouse.x=e.clientX;
    mouse.y=e.clientY;
  });
  function step(){
    requestAnimationFrame(step);
    ctx.clearRect(0,0,canvas.width,canvas.height);
    const maxDist=180;
    for(const p of points){
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<0||p.x>canvas.width) p.vx*=-1;
      if(p.y<0||p.y>canvas.height) p.vy*=-1;
      // 鼠标引力
      if(mouse.x!=null){
        const dx=mouse.x-p.x,dy=mouse.y-p.y;
        const d=Math.hypot(dx,dy);
        if(d<maxDist){
          p.x-=dx*0.002;
          p.y-=dy*0.002;
        }
      }
    }
    ctx.fillStyle='rgba(200,169,126,0.7)';
    for(let i=0;i<points.length;i++){
      const p=points[i];
      ctx.beginPath();
      ctx.arc(p.x,p.y,2,0,Math.PI*2);
      ctx.fill();
      for(let j=i+1;j<points.length;j++){
        const q=points[j];
        const dx=p.x-q.x,dy=p.y-q.y;
        const d=Math.hypot(dx,dy);
        if(d<maxDist){
          const alpha=1-d/maxDist;
          ctx.strokeStyle='rgba(200,169,126,'+(alpha*0.35)+')';
          ctx.lineWidth=1;
          ctx.beginPath();
          ctx.moveTo(p.x,p.y);
          ctx.lineTo(q.x,q.y);
          ctx.stroke();
        }
      }
    }
  }
  requestAnimationFrame(step);
}

init();

// ════════════════════════════════════════
// 详情精选
// ════════════════════════════════════════
let _fvImages = [];
let _fvContent = '';

async function loadFeatured() {
  const d = await fetch('/api/featured').then(r => r.json()).catch(() => null);
  if (!d || !d.config.enabled || !d.items.length) return;

  const cfg = d.config;
  const pos = cfg.position || 'after_showcase';

  // 填充标题
  const titleA = document.getElementById('featuredTitle');
  const subA   = document.getElementById('featuredSub');
  const titleB = document.getElementById('featuredTitleB');
  const subB   = document.getElementById('featuredSubB');
  if (titleA) titleA.textContent = cfg.title || '详情精选';
  if (subA)   subA.textContent   = cfg.subtitle || 'FEATURED';
  if (titleB) titleB.textContent = cfg.title || '详情精选';
  if (subB)   subB.textContent   = cfg.subtitle || 'FEATURED';

  // 渲染卡片到两个 grid
  _featuredOrder = d.items.map(it => it.id);
  _featuredMap = {};
  d.items.forEach(it=>{ if(it && it.id) _featuredMap[it.id]=it; });
  const html = d.items.map(item => {
    const imgs  = item.images || [];
    const first = item.cover || imgs[0];
    const cover = first ? fileSrc(first) : '';
    const cnt   = imgs.length;
    const titleHtml = item.title ? `<div class="featured-card-title">${esc(item.title)}</div>` : '';
    return `<div class="featured-card" onclick='openFv(${JSON.stringify(item).replace(/'/g,"&#39;")})'>
      ${cover ? `<img src="${cover}" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none'">` : `<div style="height:280px;display:flex;align-items:center;justify-content:center;color:var(--mu)">🖼</div>`}
      ${cnt > 1 ? `<div class="featured-card-badge">共 ${cnt} 张</div>` : ''}
      <div class="featured-card-info">
        ${titleHtml}
        <div class="featured-card-count">${cnt} 张图片</div>
      </div>
    </div>`;
  }).join('');

  const gridA = document.getElementById('featuredGrid');
  const gridB = document.getElementById('featuredGridB');
  if (gridA) gridA.innerHTML = html;
  if (gridB) gridB.innerHTML = html;

  // 按位置显示对应区块
  const secA = document.getElementById('featured-section-after-showcase');
  const secB = document.getElementById('featured-section-before-footer');
  if (pos === 'after_showcase') {
    if (secA) secA.style.display = '';
    if (secB) secB.style.display = 'none';
  } else {
    if (secA) secA.style.display = 'none';
    if (secB) secB.style.display = '';
  }
}

function openFv(item) {
  _fvCurrentId = item.id || '';
  _fvImages = item.images || [];
  _fvContent = item.content || '';
  document.getElementById('fvTitle').textContent = item.title || '';
  document.getElementById('fvCounter').textContent = _fvImages.length ? `共 ${_fvImages.length} 张` : '';
  renderFvList();
  renderFvThumbs();
  lockPageScroll();
  if(!_fvHistoryPushed){
    try{ history.pushState({fvOpen:true}, '', (location.pathname||'/')+'#featured/'+(_fvCurrentId||'')); _fvHistoryPushed = true; }catch(e){}
  }
  document.getElementById('fvOverlay').classList.add('open');
}

function openFvByOffset(step){
  if(!_fvCurrentId || !_featuredOrder.length) return;
  const idx = _featuredOrder.indexOf(_fvCurrentId);
  if(idx < 0) return;
  const next = idx + step;
  if(next < 0 || next >= _featuredOrder.length) return;
  const nid = _featuredOrder[next];
  const nitem = _featuredMap[nid];
  if(nitem) openFv(nitem);
}

function handleFvWheel(e){
  const v=document.getElementById('fvOverlay');
  if(!v || !v.classList.contains('open')) return;
  if(_fvNavLock) return;
  if(Math.abs(e.deltaY) < 8) return;
  e.preventDefault();
  _fvNavLock = true;
  openFvByOffset(e.deltaY > 0 ? 1 : -1);
  setTimeout(()=>{ _fvNavLock = false; }, 180);
}

function handleFvTouchStart(e){
  const v=document.getElementById('fvOverlay');
  if(!v || !v.classList.contains('open')) return;
  if(!e.touches || !e.touches.length) return;
  _fvTouchStartY = e.touches[0].clientY;
}

function handleFvTouchEnd(e){
  const v=document.getElementById('fvOverlay');
  if(!v || !v.classList.contains('open')) return;
  if(_fvNavLock) return;
  if(_fvTouchStartY == null) return;
  const y = (e.changedTouches && e.changedTouches[0]) ? e.changedTouches[0].clientY : _fvTouchStartY;
  const dy = y - _fvTouchStartY;
  _fvTouchStartY = null;
  if(Math.abs(dy) < 36) return;
  _fvNavLock = true;
  openFvByOffset(dy < 0 ? 1 : -1);
  setTimeout(()=>{ _fvNavLock = false; }, 220);
}

function closeFv(fromPopstate=false) {
  document.getElementById('fvOverlay').classList.remove('open');
  _fvCurrentId='';
  _fvTouchStartY=null;
  unlockPageScroll();
  if(_fvHistoryPushed){
    if(!fromPopstate){
      try{ history.back(); }catch(e){}
    }
    _fvHistoryPushed = false;
  }
}

function renderFvList() {
  const wrap = document.getElementById('fvImgWrap');
  wrap.scrollTop = 0;
  wrap.innerHTML = `<div class="fv-list">${_fvImages.map((fn,i) => {
    const src = fileSrc(fn);
    return `<img id="fv-img-${i}" src="${src}" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none'">`;
  }).join('')}</div>`;
  setTimeout(updateFvActiveThumb, 60);
}

function renderFvThumbs(){
  const aside = document.getElementById('fvAside');
  aside.innerHTML = `<div class="fv-thumb-grid">${_fvImages.map((fn,i)=>`<img class="fv-thumb" id="fv-thumb-${i}" src="${fileSrc(fn)}" onclick="fvScrollTo(${i})" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none'">`).join('')}</div><div class="fv-content" id="fvContent">${_fvContent||''}</div><div class="fv-comments" id="fvComments"></div>`;
  if(_fvCurrentId) loadFvComments(_fvCurrentId);
}
function loadFvComments(itemId){
  const el = document.getElementById('fvComments');
  if(!el) return;
  el.innerHTML = '<div style="color:rgba(255,255,255,.5);font-size:12px">加载中...</div>';
  fetch('/api/featured/'+encodeURIComponent(itemId)+'/comments').then(r=>r.json()).then(d=>{
    const list = (d.comments||[]).map(c=>`<div class="fv-comment-item"><div class="fv-comment-meta">${esc(c.name)} · ${esc(c.time)}</div><div>${esc(c.content)}</div></div>`).join('');
    el.innerHTML = '<h4>评论</h4>' + list + '<div class="fv-comment-form"><input type="text" id="fvCommentName" placeholder="昵称（可选）" maxlength="50"><textarea id="fvCommentContent" placeholder="写一条评论..."></textarea><button type="button" onclick="submitFvComment()">发送</button></div>';
  }).catch(()=>{ el.innerHTML = '<h4>评论</h4><p style="color:rgba(255,255,255,.5);font-size:12px">加载失败</p>'; });
}
function submitFvComment(){
  const itemId = _fvCurrentId;
  if(!itemId) return;
  const nameEl = document.getElementById('fvCommentName');
  const contentEl = document.getElementById('fvCommentContent');
  const name = (nameEl&&nameEl.value.trim())||'匿名';
  const content = contentEl&&contentEl.value.trim();
  if(!content){ showToast('请输入评论内容'); return; }
  fetch('/api/featured/'+encodeURIComponent(itemId)+'/comments', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({name, content}) }).then(r=>r.json()).then(d=>{
    if(d.success&&d.comment){ if(contentEl) contentEl.value=''; loadFvComments(itemId); showToast('评论已提交，管理员审核后将显示'); }
    else showToast(d.error||'发送失败', 3000);
  }).catch(()=>showToast('发送失败', 3000));
}

function fvScrollTo(idx){
  const el = document.getElementById('fv-img-'+idx);
  if(!el) return;
  el.scrollIntoView({behavior:'smooth', block:'start'});
  setTimeout(()=>setFvActiveThumb(idx), 120);
}

function setFvActiveThumb(idx){
  document.querySelectorAll('.fv-thumb').forEach((t,i)=>t.classList.toggle('active', i===idx));
}

function updateFvActiveThumb(){
  const wrap = document.getElementById('fvImgWrap');
  const imgs = _fvImages.map((_,i)=>document.getElementById('fv-img-'+i)).filter(Boolean);
  if(!imgs.length) return;
  const wrapTop = wrap.getBoundingClientRect().top;
  let bestIdx = 0, bestDist = Infinity;
  imgs.forEach((img,i)=>{
    const d = Math.abs(img.getBoundingClientRect().top - wrapTop - 20);
    if(d < bestDist){ bestDist = d; bestIdx = i; }
  });
  setFvActiveThumb(bestIdx);
}

// 键盘控制
document.addEventListener('keydown', e => {
  if (!document.getElementById('fvOverlay').classList.contains('open')) return;
  if (e.key === 'Escape') closeFv();
});
document.getElementById('fvImgWrap').addEventListener('scroll', ()=>{ updateFvActiveThumb(); });
</script>

  <div class="fv-header">
    <button class="fv-close" onclick="closeFv()">×</button>
    <span class="fv-title" id="fvTitle"></span>
    <span class="fv-counter" id="fvCounter"></span>
  </div>
  <div class="fv-body">
    <div class="fv-main">
      <div class="fv-img-wrap" id="fvImgWrap"></div>
    </div>
    <div class="fv-aside" id="fvAside"></div>
  </div>
</div>
