<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>工作流管理</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Inter,"Noto Sans SC",sans-serif;background:#0b1326;color:#dae2fd}
    .wrap{max-width:1280px;margin:0 auto;padding:22px 20px 60px}
    h1{font-size:26px;margin-bottom:6px}
    p{color:#c7c4d7;margin-bottom:12px}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
    .btn{padding:8px 12px;border-radius:10px;border:1px solid rgba(192,193,255,.4);background:#1b2140;color:#c0c1ff;cursor:pointer;font-weight:700;font-size:12px;text-decoration:none;display:inline-flex;align-items:center}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
    .card{background:rgba(23,31,51,.75);border:1px solid rgba(70,69,84,.35);border-radius:14px;padding:14px;box-shadow:0 12px 30px rgba(0,0,0,.25)}
    .card h3{font-size:16px;margin-bottom:6px}
    .card p{font-size:12px;color:#c7c4d7;min-height:34px}
    .row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px}
    .pill{padding:3px 8px;border-radius:999px;font-size:11px;background:rgba(192,193,255,.12);color:#c0c1ff}
    .link{font-size:12px;color:#c0c1ff;text-decoration:underline}

    .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:stretch;justify-content:stretch;z-index:3000}
    .modal.open{display:flex}
    .panel{width:100vw;height:100vh;background:#11182e;border:0;border-radius:0;padding:12px 14px;display:flex;flex-direction:column}
    .panel h3{font-size:16px;margin-bottom:10px;flex:0 0 auto}
    .edit-grid{display:grid;grid-template-columns:280px minmax(0,1fr) 320px;gap:12px;flex:1 1 auto;min-height:0}
    .edit-grid.left-collapsed{grid-template-columns:0 minmax(0,1fr) 320px}
    .edit-grid.right-collapsed{grid-template-columns:280px minmax(0,1fr) 0}
    .edit-grid.left-collapsed.right-collapsed{grid-template-columns:0 minmax(0,1fr) 0}
    .edit-grid > div{min-height:0;overflow:auto;padding-right:4px}
    .edit-grid.left-collapsed #leftCol,.edit-grid.right-collapsed #rightCol{padding-right:0;overflow:hidden}
    .edit-grid.left-collapsed #leftCol>* , .edit-grid.right-collapsed #rightCol>*{display:none}
    .field{margin-bottom:10px}
    .field label{display:block;font-size:12px;color:#c7c4d7;margin-bottom:6px}
    .field input,.field textarea,.field select{width:100%;background:#0f1426;border:1px solid rgba(70,69,84,.5);border-radius:10px;color:#dae2fd;padding:8px 10px;font-size:13px}
    .field textarea{min-height:120px;font-family:ui-monospace,Consolas,monospace}
    .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
    .danger{border-color:#ff7b7b;color:#ffbaba}

    .canvas-wrap{position:relative;height:100%;min-height:420px;border-radius:14px;border:1px solid rgba(70,69,84,.4);background:#0b1326;overflow:visible}
    .canvas-grid{position:absolute;inset:-200%;background-image:radial-gradient(#464554 0.5px, transparent 0.5px);background-size:24px 24px;opacity:.2}
    .viewport{position:absolute;inset:0;cursor:grab}
    .viewport.dragging{cursor:grabbing}
    .world{position:absolute;inset:0;transform-origin:top left;overflow:visible}
    #canvas{pointer-events:none}
    .node,.handle,.resize-handle{pointer-events:auto}
    .node{position:absolute;border-radius:14px;background:rgba(45,52,73,.6);border:1px solid rgba(70,69,84,.3);box-shadow:0 20px 50px rgba(0,0,0,.35);padding:12px;user-select:none;overflow:visible}
    .node.processing{border-color:rgba(192,193,255,.5)}
    .node.standard{}
    .node.selected{outline:2px solid #7c84ff}
    .node .title{font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:700;color:#c7c4d7;margin-bottom:8px;white-space:normal;word-break:break-word;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
    .node.processing .title{color:#c0c1ff}
    .node .desc{font-size:12px;color:#c7c4d7;line-height:1.5;white-space:normal;word-break:break-word;overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical}
    .node .metric .label,.node .metric .val{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .resize-handle{position:absolute;right:2px;bottom:2px;width:12px;height:12px;border-right:2px solid rgba(192,193,255,.9);border-bottom:2px solid rgba(192,193,255,.9);cursor:nwse-resize;border-radius:2px;opacity:.85;pointer-events:auto}
    .node .img{border-radius:10px;overflow:hidden;border:1px solid rgba(70,69,84,.2);aspect-ratio:16/9;margin-bottom:8px;position:relative}
    .node .img img{width:100%;height:100%;object-fit:cover;object-position:center center;opacity:.82}
    .node .metrics{display:flex;flex-direction:column;gap:6px}
    .metric{display:flex;justify-content:space-between;background:rgba(11,19,38,.4);padding:6px 8px;border-radius:8px;border:1px solid rgba(70,69,84,.15);font-size:11px}
    .metric .label{text-transform:uppercase;font-weight:700;color:#c7c4d7;font-size:10px}
    .metric .val{font-family:monospace}
    .handles{position:absolute;inset:0;pointer-events:none}
    .handle{position:absolute;width:10px;height:10px;border-radius:50%;border:2px solid #0b1326;background:#4fdbc8;pointer-events:auto;cursor:crosshair;transition:transform .12s, box-shadow .12s, background .12s}
    .handle.right{right:-6px;top:50%;transform:translateY(-50%);background:#c0c1ff;box-shadow:0 0 8px rgba(192,193,255,.9)}
    .handle.left{left:-6px;top:50%;transform:translateY(-50%)}
    .handle.top{top:-6px;left:50%;transform:translateX(-50%)}
    .handle.bottom{bottom:-6px;left:50%;transform:translateX(-50%)}
    .handle.link-source{box-shadow:0 0 0 3px rgba(79,219,200,.28),0 0 12px rgba(79,219,200,.95)!important;transform:scale(1.15)}
    .handle.drop-target{box-shadow:0 0 0 3px rgba(124,132,255,.28),0 0 12px rgba(124,132,255,.95)!important;background:#7c84ff!important;transform:scale(1.2)}
    .temp-line{stroke:#7c84ff;stroke-width:2;fill:none;stroke-dasharray:4;opacity:.9}
    .conn-hit{stroke:transparent;stroke-width:14;fill:none;cursor:pointer;pointer-events:stroke}
    .conn-selected{stroke:#8f96ff!important;stroke-width:3!important;opacity:1!important;filter:drop-shadow(0 0 4px rgba(143,150,255,.9))}
    .conn-del{cursor:pointer;pointer-events:all}
    .conn-del circle{fill:#f87171;stroke:#1f2937;stroke-width:1.2}
    .conn-del text{fill:#fff;font-size:11px;font-weight:700;dominant-baseline:middle;text-anchor:middle;user-select:none}

    .mini-toolbar{position:absolute;left:12px;top:12px;display:flex;gap:6px;z-index:5;flex-wrap:wrap;max-width:96%}
    .mini-btn{padding:6px 8px;border-radius:10px;border:1px solid rgba(192,193,255,.4);background:#1b2140;color:#c0c1ff;font-size:12px;cursor:pointer}
    .collapse-btn{position:absolute;top:12px;z-index:7;width:28px;height:28px;border-radius:9px;border:1px solid rgba(192,193,255,.4);background:#1b2140;color:#c0c1ff;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center}
    .collapse-left{left:8px}
    .collapse-right{right:8px}
    .status{font-size:11px;color:#c7c4d7;margin-top:8px}

    .node-list{display:flex;flex-direction:column;gap:8px;margin-top:6px;max-height:180px;overflow:auto}
    .node-item{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 8px;border-radius:10px;background:#0f1426;border:1px solid rgba(70,69,84,.4);font-size:12px}
    .node-item span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
    .node-item button{padding:4px 6px;border-radius:8px;border:1px solid rgba(192,193,255,.4);background:#1b2140;color:#c0c1ff;font-size:11px;cursor:pointer}

    .subcard{border:1px solid rgba(70,69,84,.5);border-radius:12px;padding:10px;background:#0f1426;margin-bottom:10px}
    .sub-title{font-size:12px;color:#c7c4d7;margin-bottom:8px}
    .pair{display:grid;grid-template-columns:1fr 1fr;gap:6px}

    @media(max-width:1200px){
      .panel{padding:10px}
      .edit-grid{grid-template-columns:1fr;gap:10px}
      .edit-grid > div{overflow:visible;padding-right:0}
      .canvas-wrap{height:60vh;min-height:360px}
      .actions{position:sticky;bottom:0;background:#11182e;padding-top:8px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>工作流管理</h1>
    <p>可视化拖拽 + 节点属性编辑 + 连线配置器。</p>
    <div class="toolbar">
      <button class="btn" id="btnNew">新建工作流</button>
      <a class="btn" href="/workflows">查看前台列表</a>
      <a class="btn" href="/admin">返回后台</a>
    </div>
    <div id="grid" class="grid"></div>
  </div>

  <div class="modal" id="modal">
    <div class="panel">
      <h3 id="modalTitle">编辑工作流</h3>
      <div class="edit-grid" id="editGrid">
        <div id="leftCol">
          <div class="field"><label>名称</label><input id="wfName" /></div>
          <div class="field"><label>Slug（URL）</label><input id="wfSlug" /></div>
          <div class="field"><label>描述</label><input id="wfDesc" /></div>
          <div class="field"><label>启用</label><input id="wfEnabled" type="checkbox" /></div>

          <div class="subcard">
            <div class="sub-title">节点模板</div>
            <div style="display:flex;gap:6px;flex-wrap:wrap">
              <button class="mini-btn" type="button" onclick="addNodeByType('trigger')">+ Trigger</button>
              <button class="mini-btn" type="button" onclick="addNodeByType('processing')">+ Processing</button>
              <button class="mini-btn" type="button" onclick="addNodeByType('storage')">+ Storage</button>
              <button class="mini-btn" type="button" onclick="addNodeByType('analytics')">+ Analytics</button>
            </div>
          </div>

          <div class="field">
            <label>节点列表</label>
            <div class="node-list" id="nodeList"></div>
          </div>
        </div>

        <div id="centerCol">
          <div class="canvas-wrap">
            <button class="collapse-btn collapse-left" id="btnToggleLeft" title="折叠左侧栏">◀</button>
            <button class="collapse-btn collapse-right" id="btnToggleRight" title="折叠右侧栏">▶</button>
            <div class="canvas-grid"></div>
            <div class="viewport" id="viewport">
              <svg id="connections" class="world" style="width:100%;height:100%;pointer-events:auto"></svg>
              <div class="world" id="canvas"></div>
            </div>
            <div class="mini-toolbar">
              <button class="mini-btn" id="btnCenter">居中</button>
              <button class="mini-btn" id="btnSyncFromJson">从 JSON 刷新画布</button>
            </div>
          </div>
          <div class="status" id="statusLine">准备就绪</div>
        </div>

        <div id="rightCol">
          <div class="subcard">
            <div class="sub-title">节点属性（选中后可编辑）</div>
            <div class="field"><label>ID</label><input id="edNodeId" disabled /></div>
            <div class="field"><label>类型</label>
              <select id="edNodeType"><option value="trigger">trigger</option><option value="processing">processing</option><option value="storage">storage</option><option value="analytics">analytics</option></select>
            </div>
            <div class="field"><label>标题</label><input id="edNodeTitle" /></div>
            <div class="field"><label>描述</label><input id="edNodeDesc" /></div>
            <div class="field"><label>图片 URL</label><input id="edNodeImage" /></div>
            <div class="pair">
              <div class="field"><label>X</label><input id="edNodeX" type="number" /></div>
              <div class="field"><label>Y</label><input id="edNodeY" type="number" /></div>
            </div>
            <div class="pair">
              <div class="field"><label>宽度(width)</label><input id="edNodeW" type="number" min="120" /></div>
              <div class="field"><label>高度(height,可选)</label><input id="edNodeH" type="number" min="80" /></div>
            </div>
            <div class="field"><label>Metrics(JSON)</label><textarea id="edNodeMetrics" style="min-height:90px"></textarea></div>
            <div style="display:flex;gap:6px"><button class="mini-btn" id="btnApplyNode">应用节点修改</button><button class="mini-btn danger" id="btnRemoveNode">删除节点</button></div>
          </div>

          <div class="subcard">
            <div class="sub-title">可视化新增连线</div>
            <div class="pair">
              <div class="field"><label>源节点</label><select id="lnSource"></select></div>
              <div class="field"><label>源 Handle</label><select id="lnSourceHandle"><option>top</option><option>right</option><option>bottom</option><option>left</option></select></div>
            </div>
            <div class="pair">
              <div class="field"><label>目标节点</label><select id="lnTarget"></select></div>
              <div class="field"><label>目标 Handle</label><select id="lnTargetHandle"><option>top</option><option>left</option><option>bottom</option><option>right</option></select></div>
            </div>
            <button class="mini-btn" id="btnAddLine">添加连线</button>
          </div>

          <div class="field"><label>Connections (JSON)</label><textarea id="wfConnections"></textarea></div>
          <div class="field"><label>Nodes (JSON)</label><textarea id="wfNodes"></textarea></div>
        </div>
      </div>

      <div class="actions" style="flex:0 0 auto">
        <button class="btn" id="btnCancel">取消</button>
        <button class="btn danger" id="btnDelete">删除</button>
        <button class="btn" id="btnSave">保存</button>
      </div>
    </div>
  </div>

  <script>
    let data = [];
    let editing = null;
    let nodes = [];
    let connections = [];
    let selectedNodeId = null;

    let drag = { on:false, nodeId:null, startX:0, startY:0, nodeX:0, nodeY:0 };
    let resizeDrag = { on:false, nodeId:null, startX:0, startY:0, w:0, h:0 };
    let pan = { on:false, startX:0, startY:0, x:0, y:0 };
    let zoom = 1;
    let linkDrag = { on:false, sourceId:null, sourceHandle:null, x:0, y:0 };
    let selectedConnectionId = null;
    let leftCollapsed = false;
    let rightCollapsed = false;

    const viewport = document.getElementById('viewport');
    const canvas = document.getElementById('canvas');
    const svg = document.getElementById('connections');
    const editGrid = document.getElementById('editGrid');

    async function load(){
      const res = await fetch('/admin/workflows');
      const json = await res.json();
      data = json.items || [];
      render();
    }

    function render(){
      const grid = document.getElementById('grid');
      if(!data.length){
        grid.innerHTML = '<div class="card"><h3>暂无工作流</h3><p>点击上方按钮创建一个。</p></div>';
        return;
      }
      grid.innerHTML = data.map(w => `
        <div class="card">
          <h3>${escapeHtml(w.name || '')}</h3>
          <p>${escapeHtml(w.description || '')}</p>
          <div class="row">
            <span class="pill">${w.enabled ? '已启用' : '已停用'}</span>
            <a class="link" href="/workflow/${encodeURIComponent(w.slug)}" target="_blank">预览</a>
          </div>
          <div class="row">
            <span class="pill">/${escapeHtml(w.slug || '')}</span>
            <button class="btn" onclick="openEdit('${w.id}')">编辑</button>
          </div>
        </div>
      `).join('');
    }

    function openEdit(id){
      editing = data.find(w => w.id === id) || null;
      document.getElementById('modalTitle').textContent = editing ? '编辑工作流' : '新建工作流';
      document.getElementById('wfName').value = editing?.name || '';
      document.getElementById('wfSlug').value = editing?.slug || '';
      document.getElementById('wfDesc').value = editing?.description || '';
      document.getElementById('wfEnabled').checked = editing?.enabled ?? true;
      nodes = JSON.parse(JSON.stringify(editing?.nodes || []));
      connections = JSON.parse(JSON.stringify(editing?.connections || []));
      selectedNodeId = nodes[0]?.id || null;
      updateJson();
      document.getElementById('btnDelete').style.display = editing ? 'inline-block' : 'none';
      document.getElementById('modal').classList.add('open');
      renderAll();
      applyCollapseState();
      centerCanvas();
    }

    function closeModal(){ document.getElementById('modal').classList.remove('open'); }

    function setStatus(t){ document.getElementById('statusLine').textContent = t || '准备就绪'; }

    function renderAll(){
      renderNodes();
      drawConnections();
      renderNodeList();
      renderLineNodeOptions();
      fillNodeEditor();
    }

    function updateJson(){
      document.getElementById('wfNodes').value = JSON.stringify(nodes, null, 2);
      document.getElementById('wfConnections').value = JSON.stringify(connections, null, 2);
    }

    async function save(){
      let nodesInput, connectionsInput;
      try{
        nodesInput = JSON.parse(document.getElementById('wfNodes').value || '[]');
        connectionsInput = JSON.parse(document.getElementById('wfConnections').value || '[]');
      }catch(err){
        alert('JSON 格式不正确');
        return;
      }
      const payload = {
        name: document.getElementById('wfName').value,
        slug: document.getElementById('wfSlug').value,
        description: document.getElementById('wfDesc').value,
        enabled: document.getElementById('wfEnabled').checked,
        nodes: nodesInput,
        connections: connectionsInput
      };
      const req = editing
        ? fetch('/admin/workflows/' + editing.id, { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) })
        : fetch('/admin/workflows', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
      const res = await req;
      const json = await res.json();
      if(!json.success){ alert(json.error || '保存失败'); return; }
      if(json.item){
        editing = json.item;
        nodes = JSON.parse(JSON.stringify(json.item.nodes || []));
        connections = JSON.parse(JSON.stringify(json.item.connections || []));
        selectedNodeId = nodes[0]?.id || selectedNodeId;
        updateJson();
        renderAll();
      }
      await load();
      setStatus('已保存（编辑界面保持打开）');
    }

    async function remove(){
      if(!editing) return;
      if(!confirm('确定要删除这个工作流吗？')) return;
      const res = await fetch('/admin/workflows/' + editing.id, { method: 'DELETE' });
      const json = await res.json();
      if(!json.success){ alert(json.error || '删除失败'); return; }
      closeModal();
      await load();
    }

    function getConnectedHandles(){
      const map = new Map();
      const add = (nodeId, handle) => map.set(`${nodeId}:${handle}`, true);
      connections.forEach(c => {
        add(c.sourceId, c.sourceHandle);
        add(c.targetId, c.targetHandle);
      });
      return map;
    }

    function getHandlePos(nodeId, handle){
      const n = nodes.find(x => x.id === nodeId);
      if(!n) return null;
      const el = canvas.querySelector(`.node[data-id="${nodeId}"]`);
      const w = el ? el.offsetWidth : 256;
      const h = el ? el.offsetHeight : 160;
      if(handle === 'top') return { x: n.position.x + w/2, y: n.position.y };
      if(handle === 'bottom') return { x: n.position.x + w/2, y: n.position.y + h };
      if(handle === 'left') return { x: n.position.x, y: n.position.y + h/2 };
      return { x: n.position.x + w, y: n.position.y + h/2 };
    }

    function drawConnections(){
      const defs = `
        <defs>
          <linearGradient id="line-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#4fdbc8" />
            <stop offset="100%" stop-color="#c0c1ff" />
          </linearGradient>
        </defs>
      `;
      const paths = connections.map(c => {
        const start = getHandlePos(c.sourceId, c.sourceHandle);
        const end = getHandlePos(c.targetId, c.targetHandle);
        if(!start || !end) return '';
        const dx = Math.abs(end.x - start.x) * 0.5;
        const dy = Math.abs(end.y - start.y) * 0.5;
        let p1x = start.x, p1y = start.y, p2x = end.x, p2y = end.y;
        if(c.sourceHandle === 'right') p1x += dx;
        if(c.sourceHandle === 'left') p1x -= dx;
        if(c.sourceHandle === 'bottom') p1y += dy;
        if(c.sourceHandle === 'top') p1y -= dy;
        if(c.targetHandle === 'right') p2x += dx;
        if(c.targetHandle === 'left') p2x -= dx;
        if(c.targetHandle === 'bottom') p2y += dy;
        if(c.targetHandle === 'top') p2y -= dy;
        const d = `M ${start.x} ${start.y} C ${p1x} ${p1y}, ${p2x} ${p2y}, ${end.x} ${end.y}`;
        const sel = c.id === selectedConnectionId ? 'conn-selected' : '';
        const mx = (start.x + end.x) / 2;
        const my = (start.y + end.y) / 2;
        const del = c.id === selectedConnectionId
          ? `<g class="conn-del" data-del-conn-id="${c.id}"><circle cx="${mx}" cy="${my}" r="9"></circle><text x="${mx}" y="${my}">×</text></g>`
          : '';
        return `<g data-conn-id="${c.id}"><path d="${d}" fill="none" stroke="url(#line-gradient)" stroke-width="2" class="flow-line ${sel}" /><path d="${d}" class="conn-hit" data-conn-id="${c.id}" /><circle cx="${start.x}" cy="${start.y}" r="4" fill="#4fdbc8" /><circle cx="${end.x}" cy="${end.y}" r="4" fill="#c0c1ff" />${del}</g>`;
      }).join('');

      let temp = '';
      if(linkDrag.on){
        const start = handlePosFromEl(linkDrag.sourceId, linkDrag.sourceHandle);
        if(start){
          const world = screenToWorld(linkDrag.x, linkDrag.y);
          temp = `<path class="temp-line" d="M ${start.x} ${start.y} L ${world.x} ${world.y}" />`;
        }
      }

      svg.innerHTML = defs + paths + temp;
    }

    function renderNodes(){
      canvas.innerHTML = nodes.map(n => {
        const cls = n.type === 'processing' ? 'processing' : 'standard';
        const hasImage = !!n.image;
        const hasMetrics = Array.isArray(n.metrics) && n.metrics.length;
        const styleW = n.width ? `width:${Number(n.width)}px;` : (n.type === 'processing' ? 'width:320px;' : 'width:256px;');
        const styleH = n.height ? `height:${Number(n.height)}px;` : '';
        return `
          <div class="node ${cls} ${n.id===selectedNodeId?'selected':''}" data-id="${n.id}" style="left:${n.position.x}px;top:${n.position.y}px;${styleW}${styleH}">
            <div class="title">${escapeHtml(n.title || '')}</div>
            ${hasImage ? `<div class="img"><img src="${n.image}" alt="" referrerpolicy="no-referrer" /></div>` : ''}
            ${hasMetrics ? `<div class="metrics">${(n.metrics || []).map(m => `<div class="metric"><div class="label">${escapeHtml(m.label || '')}</div><div class="val ${m.color || ''}">${escapeHtml(m.value || '')}</div></div>`).join('')}</div>` : ''}
            ${n.description ? `<div class="desc">${escapeHtml(n.description)}</div>` : ''}
            <div class="handles">
              <div class="handle top" data-handle="top"></div>
              <div class="handle bottom" data-handle="bottom"></div>
              <div class="handle left" data-handle="left"></div>
              <div class="handle right" data-handle="right"></div>
            </div>
            <div class="resize-handle" data-resize="1" title="拖拽调整大小"></div>
          </div>
        `;
      }).join('');
      bindHandleDragEvents();
    }

    function renderNodeList(){
      const box = document.getElementById('nodeList');
      if(!nodes.length){ box.innerHTML = '<div class="node-item"><span>暂无节点</span></div>'; return; }
      box.innerHTML = nodes.map(n => `
        <div class="node-item">
          <span>${escapeHtml(n.title || n.id)}</span>
          <div style="display:flex;gap:4px">
            <button onclick="selectNode('${n.id}')">选中</button>
            <button onclick="focusNode('${n.id}')">定位</button>
            <button onclick="removeNode('${n.id}')">删除</button>
          </div>
        </div>
      `).join('');
    }

    function renderLineNodeOptions(){
      const src = document.getElementById('lnSource');
      const tar = document.getElementById('lnTarget');
      const html = nodes.map(n => `<option value="${n.id}">${escapeHtml(n.title || n.id)}</option>`).join('');
      src.innerHTML = html;
      tar.innerHTML = html;
      if(selectedNodeId){ src.value = selectedNodeId; }
    }

    function selectNode(id){
      selectedNodeId = id;
      renderNodes();
      fillNodeEditor();
      setStatus('已选中节点：' + id);
    }

    function fillNodeEditor(){
      const n = nodes.find(x => x.id === selectedNodeId);
      document.getElementById('edNodeId').value = n?.id || '';
      document.getElementById('edNodeType').value = n?.type || 'processing';
      document.getElementById('edNodeTitle').value = n?.title || '';
      document.getElementById('edNodeDesc').value = n?.description || '';
      document.getElementById('edNodeImage').value = n?.image || '';
      document.getElementById('edNodeX').value = n?.position?.x ?? '';
      document.getElementById('edNodeY').value = n?.position?.y ?? '';
      document.getElementById('edNodeW').value = n?.width ?? '';
      document.getElementById('edNodeH').value = n?.height ?? '';
      document.getElementById('edNodeMetrics').value = JSON.stringify(n?.metrics || [], null, 2);
    }

    function applyNodeEdit(){
      const n = nodes.find(x => x.id === selectedNodeId);
      if(!n) return;
      let metrics = [];
      try{ metrics = JSON.parse(document.getElementById('edNodeMetrics').value || '[]'); }
      catch(e){ alert('Metrics JSON 格式不正确'); return; }
      n.type = document.getElementById('edNodeType').value;
      n.title = document.getElementById('edNodeTitle').value;
      n.description = document.getElementById('edNodeDesc').value;
      n.image = document.getElementById('edNodeImage').value;
      n.position = { x: Number(document.getElementById('edNodeX').value || 0), y: Number(document.getElementById('edNodeY').value || 0) };
      const w = Number(document.getElementById('edNodeW').value || 0);
      const h = Number(document.getElementById('edNodeH').value || 0);
      if(w >= 120){ n.width = w; } else { delete n.width; }
      if(h >= 80){ n.height = h; } else { delete n.height; }
      n.metrics = Array.isArray(metrics) ? metrics : [];
      renderAll();
      updateJson();
      setStatus('节点属性已更新');
    }

    function focusNode(id){
      const n = nodes.find(x => x.id === id);
      if(!n) return;
      pan.x = 120 - n.position.x;
      pan.y = 120 - n.position.y;
      applyTransform();
      selectNode(id);
    }

    function removeNode(id){
      nodes = nodes.filter(n => n.id !== id);
      connections = connections.filter(c => c.sourceId !== id && c.targetId !== id);
      if(selectedNodeId === id) selectedNodeId = nodes[0]?.id || null;
      renderAll();
      updateJson();
    }

    function addNodeByType(type){
      const id = 'node-' + Math.random().toString(36).slice(2,8);
      const base = {
        id,
        type,
        title: type === 'processing' ? 'Main Processing' : type === 'trigger' ? 'Trigger' : type === 'storage' ? 'Storage' : 'Analytics',
        description: type === 'processing' ? '' : 'node description',
        image: type === 'trigger' ? 'https://picsum.photos/seed/' + id + '/400/225' : '',
        metrics: type === 'processing' ? [{label:'Latencies',value:'0.04ms',color:'text-emerald-400'}] : type === 'storage' ? [{label:'Efficiency',value:'98.2%',color:'text-orange-400'}] : [],
        status: type === 'processing' ? 'active' : undefined,
        position: { x: 120 + nodes.length*30, y: 120 + nodes.length*20 },
        width: type === 'processing' ? 320 : 256
      };
      nodes.push(base);
      selectedNodeId = id;
      renderAll();
      updateJson();
      setStatus('已添加 ' + type + ' 节点');
    }

    function addLineFromForm(){
      const sourceId = document.getElementById('lnSource').value;
      const targetId = document.getElementById('lnTarget').value;
      const sourceHandle = document.getElementById('lnSourceHandle').value;
      const targetHandle = document.getElementById('lnTargetHandle').value;
      if(!sourceId || !targetId){ alert('请选择源/目标节点'); return; }
      connections.push({ id: 'c-' + Math.random().toString(36).slice(2,8), sourceId, sourceHandle, targetId, targetHandle });
      drawConnections();
      updateJson();
      setStatus('已添加连线');
    }

    function bindHandleDragEvents(){
      canvas.querySelectorAll('.handle').forEach(h => {
        h.onmousedown = (e) => {
          e.stopPropagation();
          const nodeEl = h.closest('.node');
          if(!nodeEl) return;
          selectedConnectionId = null;
          linkDrag.on = true;
          linkDrag.sourceId = nodeEl.dataset.id;
          linkDrag.sourceHandle = h.dataset.handle;
          linkDrag.x = e.clientX;
          linkDrag.y = e.clientY;
          canvas.querySelectorAll('.handle').forEach(x => {
            x.classList.remove('drop-target','link-source');
            const xid = x.closest('.node')?.dataset?.id;
            const xh = x.dataset.handle;
            if(xid && xh && !(xid === linkDrag.sourceId && xh === linkDrag.sourceHandle)){
              x.classList.add('drop-target');
            }
          });
          h.classList.remove('drop-target');
          h.classList.add('link-source');
          drawConnections();
          setStatus('拖拽到高亮把手以创建连线');
        };
      });
    }

    function screenToWorld(clientX, clientY){
      const rect = viewport.getBoundingClientRect();
      return {
        x: (clientX - rect.left - pan.x) / zoom,
        y: (clientY - rect.top - pan.y) / zoom,
      };
    }

    function handlePosFromEl(nodeId, handle){
      return getHandlePos(nodeId, handle);
    }

    function finishLinkDrag(targetEl){
      if(!linkDrag.on) return;
      canvas.querySelectorAll('.handle').forEach(x => x.classList.remove('drop-target','link-source'));
      if(!targetEl){
        linkDrag.on = false;
        drawConnections();
        return;
      }
      const targetNodeEl = targetEl.closest('.node');
      const targetId = targetNodeEl?.dataset?.id;
      const targetHandle = targetEl.dataset.handle;
      if(targetId && targetHandle && linkDrag.sourceId && linkDrag.sourceHandle){
        connections.push({
          id: 'c-' + Math.random().toString(36).slice(2,8),
          sourceId: linkDrag.sourceId,
          sourceHandle: linkDrag.sourceHandle,
          targetId,
          targetHandle,
        });
        updateJson();
        setStatus('已通过拖拽创建连线');
      }
      linkDrag.on = false;
      drawConnections();
    }

    function applyCollapseState(){
      editGrid.classList.toggle('left-collapsed', leftCollapsed);
      editGrid.classList.toggle('right-collapsed', rightCollapsed);
      document.getElementById('btnToggleLeft').textContent = leftCollapsed ? '▶' : '◀';
      document.getElementById('btnToggleRight').textContent = rightCollapsed ? '◀' : '▶';
      document.getElementById('btnToggleLeft').title = leftCollapsed ? '展开左侧栏' : '折叠左侧栏';
      document.getElementById('btnToggleRight').title = rightCollapsed ? '展开右侧栏' : '折叠右侧栏';
    }

    function applyTransform(){
      const t = `translate(${pan.x}px, ${pan.y}px) scale(${zoom})`;
      canvas.style.transform = t;
      svg.style.transform = t;
      drawConnections();
    }

    function centerCanvas(){ pan.x = 0; pan.y = 0; zoom = 1; applyTransform(); }

    viewport.addEventListener('mousedown', (e) => {
      if(e.target.closest('.handle')) return;
      const resizeEl = e.target.closest('[data-resize="1"]');
      if(resizeEl){
        const nodeEl = resizeEl.closest('.node');
        const id = nodeEl?.dataset?.id;
        const n = nodes.find(x => x.id === id);
        if(!n) return;
        selectNode(id);
        resizeDrag.on = true;
        resizeDrag.nodeId = id;
        resizeDrag.startX = e.clientX;
        resizeDrag.startY = e.clientY;
        resizeDrag.w = Number(n.width || nodeEl.offsetWidth || 256);
        resizeDrag.h = Number(n.height || nodeEl.offsetHeight || 160);
        return;
      }
      const nodeEl = e.target.closest('.node');
      if(nodeEl){
        const id = nodeEl.dataset.id;
        const n = nodes.find(x => x.id === id);
        if(!n) return;
        selectNode(id);
        drag.on = true; drag.nodeId = id;
        drag.startX = e.clientX; drag.startY = e.clientY;
        drag.nodeX = n.position.x; drag.nodeY = n.position.y;
      }else{
        pan.on = true; pan.startX = e.clientX - pan.x; pan.startY = e.clientY - pan.y;
        viewport.classList.add('dragging');
      }
    });

    window.addEventListener('mousemove', (e) => {
      if(linkDrag.on){
        linkDrag.x = e.clientX;
        linkDrag.y = e.clientY;
        drawConnections();
        return;
      }
      if(resizeDrag.on){
        const n = nodes.find(x => x.id === resizeDrag.nodeId);
        if(!n) return;
        const nw = Math.max(160, Math.round(resizeDrag.w + (e.clientX - resizeDrag.startX) / zoom));
        const nh = Math.max(120, Math.round(resizeDrag.h + (e.clientY - resizeDrag.startY) / zoom));
        n.width = nw;
        n.height = nh;
        const el = canvas.querySelector(`[data-id="${n.id}"]`);
        if(el){ el.style.width = nw + 'px'; el.style.height = nh + 'px'; }
        drawConnections();
        updateJson();
        fillNodeEditor();
        return;
      }
      if(drag.on){
        const n = nodes.find(x => x.id === drag.nodeId);
        if(!n) return;
        n.position.x = Math.round(drag.nodeX + (e.clientX - drag.startX) / zoom);
        n.position.y = Math.round(drag.nodeY + (e.clientY - drag.startY) / zoom);
        const el = canvas.querySelector(`[data-id="${n.id}"]`);
        if(el){ el.style.left = n.position.x + 'px'; el.style.top = n.position.y + 'px'; }
        drawConnections();
        updateJson();
        fillNodeEditor();
      }else if(pan.on){
        pan.x = e.clientX - pan.startX;
        pan.y = e.clientY - pan.startY;
        applyTransform();
      }
    });

    window.addEventListener('mouseup', (e) => {
      if(linkDrag.on){
        const targetHandle = e.target && e.target.classList && e.target.classList.contains('handle') ? e.target : null;
        finishLinkDrag(targetHandle);
      }
      resizeDrag.on = false; resizeDrag.nodeId = null;
      drag.on = false; drag.nodeId = null;
      pan.on = false;
      viewport.classList.remove('dragging');
    });

    svg.addEventListener('click', (e) => {
      const del = e.target.closest('[data-del-conn-id]');
      if(del){
        const id = del.dataset.delConnId;
        const before = connections.length;
        connections = connections.filter(c => c.id !== id);
        if(connections.length !== before){
          selectedConnectionId = null;
          updateJson();
          drawConnections();
          renderNodes();
          setStatus('已删除连线');
        }
        return;
      }
      const hit = e.target.closest('.conn-hit');
      if(hit){
        selectedConnectionId = hit.dataset.connId;
        drawConnections();
        setStatus('已选中连线，点击 × 或按 Delete 可删除');
        return;
      }
      selectedConnectionId = null;
      drawConnections();
    });

    window.addEventListener('keydown', (e) => {
      if((e.key === 'Delete' || e.key === 'Backspace') && selectedConnectionId){
        const before = connections.length;
        connections = connections.filter(c => c.id !== selectedConnectionId);
        if(connections.length !== before){
          setStatus('已删除选中连线');
          updateJson();
        }
        selectedConnectionId = null;
        drawConnections();
      }
    });

    viewport.addEventListener('wheel', (e) => {
      if(!e.ctrlKey) return;
      e.preventDefault();
      zoom = Math.min(Math.max(zoom + (e.deltaY > 0 ? -0.1 : 0.1), 0.3), 2.5);
      applyTransform();
    }, { passive:false });

    document.getElementById('btnNew').addEventListener('click', () => openEdit(null));
    document.getElementById('btnCancel').addEventListener('click', closeModal);
    document.getElementById('btnSave').addEventListener('click', save);
    document.getElementById('btnDelete').addEventListener('click', remove);
    document.getElementById('btnCenter').addEventListener('click', centerCanvas);
    document.getElementById('btnAddLine').addEventListener('click', addLineFromForm);
    document.getElementById('btnApplyNode').addEventListener('click', applyNodeEdit);
    document.getElementById('btnRemoveNode').addEventListener('click', () => selectedNodeId && removeNode(selectedNodeId));
    document.getElementById('btnToggleLeft').addEventListener('click', () => { leftCollapsed = !leftCollapsed; applyCollapseState(); });
    document.getElementById('btnToggleRight').addEventListener('click', () => { rightCollapsed = !rightCollapsed; applyCollapseState(); });
    document.getElementById('btnSyncFromJson').addEventListener('click', () => {
      try{
        nodes = JSON.parse(document.getElementById('wfNodes').value || '[]');
        connections = JSON.parse(document.getElementById('wfConnections').value || '[]');
        selectedNodeId = nodes[0]?.id || null;
        renderAll();
        setStatus('已从 JSON 刷新');
      }catch(err){ alert('JSON 格式不正确'); }
    });

    function escapeHtml(s){
      return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }

    load();
  </script>
</body>
</html>
