<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ workflow.name if workflow else 'Workflow Not Found' }}</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Manrope','Noto Sans SC',sans-serif;background:#0b1326;color:#dae2fd;overflow:hidden}
    a{color:inherit;text-decoration:none}
    .page{position:relative;width:100vw;height:100vh}
    .header{position:absolute;top:0;left:0;right:0;z-index:50;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;background:rgba(11,19,38,.82);backdrop-filter:blur(16px);border-bottom:1px solid rgba(70,69,84,.2)}
    .brand{font-size:18px;font-weight:900;letter-spacing:.2em;text-transform:uppercase}
    .nav{display:flex;gap:18px;font-size:12px}
    .nav a{color:#c7c4d7}
    .nav a.active{color:#c0c1ff;border-bottom:2px solid #6366f1;padding-bottom:4px}
    .btns{display:flex;gap:8px}
    .btn{width:34px;height:34px;border-radius:10px;background:#131b2e;border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;color:#8a8fb0}
    .canvas{position:absolute;inset:0;overflow:visible}
    .canvas-grid{position:absolute;inset:-200%;background-image:radial-gradient(#464554 0.5px, transparent 0.5px);background-size:24px 24px;opacity:.2}
    .toolbar{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);display:flex;gap:8px;background:rgba(23,31,51,.6);border:1px solid rgba(70,69,84,.3);border-radius:999px;padding:10px 14px;z-index:50}
    .tool{width:36px;height:36px;border-radius:999px;background:transparent;border:1px solid rgba(255,255,255,.08);color:#c7c4d7;display:flex;align-items:center;justify-content:center}
    .tool.active{color:#c0c1ff;background:rgba(192,193,255,.1)}
    .zoom{position:absolute;left:20px;bottom:20px;display:flex;align-items:center;gap:8px;background:rgba(23,31,51,.8);border:1px solid rgba(70,69,84,.2);border-radius:12px;padding:6px 8px;z-index:50}
    .zoom button{background:transparent;border:0;color:#c7c4d7;width:28px;height:28px;cursor:pointer}
    .zoom .value{font-size:10px;font-family:monospace;color:#c7c4d7;min-width:52px;text-align:center}
    .node{position:absolute;border-radius:14px;background:rgba(45,52,73,.6);border:1px solid rgba(70,69,84,.3);box-shadow:0 20px 50px rgba(0,0,0,.35);padding:14px;user-select:none;overflow:visible}
    .node.processing{border-color:rgba(192,193,255,.5)}
    .node.standard{}
    .node .title{font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:700;color:#c7c4d7;margin-bottom:8px;white-space:normal;word-break:break-word;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
    .node.processing .title{color:#c0c1ff}
    .node .desc{font-size:12px;color:#c7c4d7;line-height:1.6;white-space:normal;word-break:break-word;overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical}
    .node .metric .label,.node .metric .val{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .node .img{border-radius:10px;overflow:hidden;border:1px solid rgba(70,69,84,.2);aspect-ratio:16/9;margin-bottom:8px;position:relative}
    .node .img img{width:100%;height:100%;object-fit:cover;object-position:center center;opacity:.82}
    .node .metrics{display:flex;flex-direction:column;gap:6px}
    .metric{display:flex;justify-content:space-between;background:rgba(11,19,38,.4);padding:6px 8px;border-radius:8px;border:1px solid rgba(70,69,84,.15);font-size:11px}
    .metric .label{text-transform:uppercase;font-weight:700;color:#c7c4d7;font-size:10px}
    .metric .val{font-family:monospace}
    .handles{position:absolute;inset:0;pointer-events:none}
    .handle{position:absolute;width:12px;height:12px;border-radius:50%;border:2px solid #0b1326;background:#4fdbc8}
    .handle.right{right:-6px;top:50%;transform:translateY(-50%);background:#c0c1ff;box-shadow:0 0 8px rgba(192,193,255,.9)}
    .handle.left{left:-6px;top:50%;transform:translateY(-50%)}
    .handle.top{top:-6px;left:50%;transform:translateX(-50%)}
    .handle.bottom{bottom:-6px;left:50%;transform:translateX(-50%)}
    .node .footer{margin-top:10px;border-top:1px solid rgba(70,69,84,.2);padding-top:10px;display:flex;justify-content:space-between;align-items:center;font-size:10px;color:#c7c4d7}
    .badge{width:7px;height:7px;border-radius:50%;background:#4fdbc8;box-shadow:0 0 10px rgba(79,219,200,.8)}
    .pill{display:flex;gap:6px}
    .pill span{width:22px;height:22px;border-radius:50%;background:#2d3449;border:2px solid #0b1326;display:flex;align-items:center;justify-content:center}
    svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
    .flow-line{stroke-dasharray:4;animation:dash 20s linear infinite;opacity:.6}
    @keyframes dash{to{stroke-dashoffset:-1000}}
    .empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:#c7c4d7}
    .empty a{color:#c0c1ff;text-decoration:underline}
  </style>
</head>
<body>
  <div class="page">
    <header class="header">
      <div class="brand">FlowNode</div>
      <div class="nav">
        <a href="/workflows">Workflows</a>
        {% if workflow %}
          <a class="active" href="#">{{ workflow.name }}</a>
        {% else %}
          <a class="active" href="#">Not Found</a>
        {% endif %}
      </div>
      <div class="btns">
        <div class="btn">▶</div>
        <div class="btn">💾</div>
        <div class="btn">⤴</div>
        <div class="btn">⋮</div>
      </div>
    </header>

    <div class="canvas" id="canvas">
      <div class="canvas-grid"></div>
      <svg id="connections"></svg>
      <div id="nodes"></div>
      {% if not workflow %}
      <div class="empty">
        <div>未找到该工作流</div>
        <a href="/workflows">返回工作流列表</a>
      </div>
      {% endif %}
    </div>

    <div class="zoom">
      <button id="zoomIn">+</button>
      <div class="value" id="zoomValue">100%</div>
      <button id="zoomOut">-</button>
    </div>

    <div class="toolbar">
      <div class="tool">✋</div>
      <div class="tool active">🖱️</div>
      <div class="tool">＋</div>
      <div class="tool">↗</div>
      <div class="tool">🗒️</div>
    </div>
  </div>

  <script>
    const workflow = {{ (workflow or {}) | tojson }};
    const nodes = (workflow.nodes || []);
    const connections = (workflow.connections || []);

    const canvas = document.getElementById('canvas');
    const nodesEl = document.getElementById('nodes');
    const svg = document.getElementById('connections');

    let zoom = 1;
    let offset = { x: 0, y: 0 };
    let dragging = false;
    let dragStart = { x: 0, y: 0 };

    function applyTransform(){
      nodesEl.style.transform = `translate(${offset.x}px, ${offset.y}px) scale(${zoom})`;
      svg.style.transform = `translate(${offset.x}px, ${offset.y}px) scale(${zoom})`;
      svg.style.transformOrigin = 'top left';
      nodesEl.style.transformOrigin = 'top left';
      document.getElementById('zoomValue').textContent = Math.round(zoom*100) + '%';
      drawConnections();
    }

    function getConnectedHandles(){
      const map = new Map();
      const add = (nodeId, handle) => {
        const key = `${nodeId}:${handle}`;
        map.set(key, true);
      };
      connections.forEach(c => {
        add(c.sourceId, c.sourceHandle);
        add(c.targetId, c.targetHandle);
      });
      return map;
    }

    function getHandlePos(nodeId, handle){
      const n = nodes.find(x => x.id === nodeId);
      if(!n) return null;
      const el = nodesEl.querySelector(`.node[data-id="${nodeId}"]`);
      const w = el ? el.offsetWidth : 256;
      const h = el ? el.offsetHeight : 160;
      if(handle === 'top') return { x: n.position.x + w/2, y: n.position.y };
      if(handle === 'bottom') return { x: n.position.x + w/2, y: n.position.y + h };
      if(handle === 'left') return { x: n.position.x, y: n.position.y + h/2 };
      return { x: n.position.x + w, y: n.position.y + h/2 };
    }

    function drawConnections(){
      if(!connections.length){
        svg.innerHTML = '';
        return;
      }
      const defs = `
        <defs>
          <linearGradient id="line-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#4fdbc8" />
            <stop offset="100%" stop-color="#c0c1ff" />
          </linearGradient>
        </defs>
      `;
      const paths = connections.map(c => {
        const start = getHandlePos(c.sourceId, c.sourceHandle);
        const end = getHandlePos(c.targetId, c.targetHandle);
        if(!start || !end) return '';
        const dx = Math.abs(end.x - start.x) * 0.5;
        const dy = Math.abs(end.y - start.y) * 0.5;
        let p1x = start.x, p1y = start.y, p2x = end.x, p2y = end.y;
        if(c.sourceHandle === 'right') p1x += dx;
        if(c.sourceHandle === 'left') p1x -= dx;
        if(c.sourceHandle === 'bottom') p1y += dy;
        if(c.sourceHandle === 'top') p1y -= dy;
        if(c.targetHandle === 'right') p2x += dx;
        if(c.targetHandle === 'left') p2x -= dx;
        if(c.targetHandle === 'bottom') p2y += dy;
        if(c.targetHandle === 'top') p2y -= dy;
        const d = `M ${start.x} ${start.y} C ${p1x} ${p1y}, ${p2x} ${p2y}, ${end.x} ${end.y}`;
        return `
          <g>
            <path d="${d}" fill="none" stroke="url(#line-gradient)" stroke-width="2" class="flow-line" />
            <circle cx="${start.x}" cy="${start.y}" r="4" fill="#4fdbc8" />
            <circle cx="${end.x}" cy="${end.y}" r="4" fill="#c0c1ff" />
          </g>
        `;
      }).join('');
      svg.innerHTML = defs + paths;
    }

    function renderNodes(){
      if(!nodes.length) return;
      const connected = getConnectedHandles();
      nodesEl.innerHTML = nodes.map(n => {
        const cls = n.type === 'processing' ? 'processing' : 'standard';
        const hasImage = !!n.image;
        const hasMetrics = Array.isArray(n.metrics);
        const isAnalytics = n.type === 'analytics';
        const isStorage = n.type === 'storage';
        const show = (h) => connected.has(`${n.id}:${h}`);
        return `
          <div class="node ${cls}" data-id="${n.id}" style="left:${n.position.x}px;top:${n.position.y}px;${n.width ? `width:${Number(n.width)}px;` : ''}${n.height ? `height:${Number(n.height)}px;` : ''}">
            <div class="title">${escapeHtml(n.title || '')}</div>
            ${hasImage ? `
              <div class="img"><img src="${n.image}" alt="" referrerpolicy="no-referrer" /></div>
            ` : ''}
            ${hasMetrics ? `
              <div class="metrics">
                ${(n.metrics || []).map(m => `
                  <div class="metric">
                    <div class="label">${escapeHtml(m.label || '')}</div>
                    <div class="val ${m.color || ''}">${escapeHtml(m.value || '')}</div>
                  </div>
                `).join('')}
              </div>
            ` : ''}
            ${n.description ? `<div class="desc">${escapeHtml(n.description)}</div>` : ''}
            ${n.type === 'processing' ? `
              <div class="footer">
                <div class="pill"><span>DB</span><span>CL</span></div>
                <div>View Logs</div>
              </div>
            ` : ''}
            ${isStorage ? `
              <div class="footer">
                <div>Cluster: A-9</div>
                <div>Region: EU-West</div>
              </div>
            ` : ''}
            ${isAnalytics ? `
              <div class="footer">
                <div class="badge"></div>
                <div>Live</div>
              </div>
            ` : ''}
            <div class="handles">
              ${show('top') ? '<div class="handle top"></div>' : ''}
              ${show('bottom') ? '<div class="handle bottom"></div>' : ''}
              ${show('left') ? '<div class="handle left"></div>' : ''}
              ${show('right') ? '<div class="handle right"></div>' : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    function escapeHtml(s){
      return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }

    canvas.addEventListener('wheel', (e) => {
      if(e.ctrlKey){
        e.preventDefault();
        zoom = Math.min(Math.max(zoom + (e.deltaY > 0 ? -0.1 : 0.1), 0.2), 3);
      }else{
        offset.x -= e.deltaX;
        offset.y -= e.deltaY;
      }
      applyTransform();
    }, { passive:false });

    canvas.addEventListener('mousedown', (e) => {
      dragging = true;
      dragStart = { x: e.clientX - offset.x, y: e.clientY - offset.y };
    });
    window.addEventListener('mousemove', (e) => {
      if(!dragging) return;
      offset.x = e.clientX - dragStart.x;
      offset.y = e.clientY - dragStart.y;
      applyTransform();
    });
    window.addEventListener('mouseup', () => dragging = false);

    document.getElementById('zoomIn').addEventListener('click', () => { zoom = Math.min(zoom + .1, 2); applyTransform(); });
    document.getElementById('zoomOut').addEventListener('click', () => { zoom = Math.max(zoom - .1, 0.5); applyTransform(); });

    renderNodes();
    applyTransform();
  </script>
</body>
</html>
