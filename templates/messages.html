<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>留言板 · GALLERY</title>
<link rel="icon" id="faviconLink" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Noto+Sans+SC:wght@300;400;500&family=Cormorant+Garamond:wght@300;600&display=swap" rel="stylesheet">
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<style>
:root{--bg:#faf9f7;--s:#fff;--tx:#1a1a1a;--mu:#8a8680;--ac:#c8a97e;--bd:#e8e4df;--nav-bg:rgba(250,249,247,.93)}
[data-theme=cool]{--bg:#f0f4f8;--s:#fff;--tx:#1e2a3a;--mu:#6b7d8f;--ac:#4a90d9;--bd:#d4dde8;--nav-bg:rgba(240,244,248,.93)}
[data-theme=dark]{--bg:#0f1117;--s:#1a1c24;--tx:#e2e4f0;--mu:#6b6e84;--ac:#7c6af5;--bd:#252833;--nav-bg:rgba(15,17,23,.95)}
[data-theme=green]{--bg:#f2f7f2;--s:#fff;--tx:#1a2e1a;--mu:#5a7a5a;--ac:#4a9460;--bd:#d0e8d0;--nav-bg:rgba(242,247,242,.93)}
[data-theme=rose]{--bg:#fdf6f8;--s:#fff;--tx:#2e1a20;--mu:#9a6875;--ac:#d4607a;--bd:#f0d8de;--nav-bg:rgba(253,246,248,.93)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;transition:background .3s,color .3s}
nav{position:sticky;top:0;z-index:100;height:64px;background:var(--nav-bg);backdrop-filter:blur(16px);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 28px;gap:8px;transition:background .3s}
.nav-logo{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;letter-spacing:.15em;color:var(--tx);text-decoration:none;margin-right:auto}
.nav-links{display:flex;gap:4px}
.nav-links a{font-size:13px;color:var(--mu);text-decoration:none;padding:7px 13px;border-radius:20px;transition:all .2s}
.nav-links a:hover{color:var(--tx);background:var(--bd)}
.nav-toggle{display:none;width:32px;height:32px;border-radius:50%;border:1px solid var(--bd);background:transparent;color:var(--tx);cursor:pointer;align-items:center;justify-content:center;padding:0;font-size:18px;flex-shrink:0}
.nav-toggle span{display:block;width:16px;height:2px;background:var(--tx);position:relative;border-radius:999px}
.nav-toggle span::before,.nav-toggle span::after{content:'';position:absolute;left:0;width:16px;height:2px;background:var(--tx);border-radius:999px}
.nav-toggle span::before{top:-5px}
.nav-toggle span::after{top:5px}
/* HERO */
.msg-hero{min-height:320px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.msg-hero-bg{position:absolute;inset:0;background-size:cover;background-position:center}
.msg-hero-overlay{position:absolute;inset:0;background:#000}
.msg-hero-content{position:relative;z-index:2;text-align:center;color:#fff;padding:48px 20px}
.msg-hero-content h1{font-family:'Playfair Display',serif;margin-bottom:12px}
.msg-hero-content p{font-weight:300;color:rgba(255,255,255,.8);max-width:440px;margin:0 auto}
/* MAIN */
.msg-wrap{max-width:700px;margin:0 auto;padding:44px 24px 80px}
/* FORM */
.form-card{background:var(--s);border:1px solid var(--bd);border-radius:18px;padding:28px;margin-bottom:36px;box-shadow:0 2px 16px rgba(0,0,0,.05)}
.form-card h2{font-family:'Playfair Display',serif;font-size:20px;margin-bottom:20px}
.form-row{display:flex;gap:12px;margin-bottom:14px}
.fg{display:flex;flex-direction:column;gap:5px;flex:1}
.fg label{font-size:11px;color:var(--mu);letter-spacing:.05em}
.inp{padding:10px 14px;background:var(--bg);border:1px solid var(--bd);border-radius:8px;color:var(--tx);font-family:inherit;font-size:14px;outline:none;transition:border-color .2s;width:100%}
.inp:focus{border-color:var(--ac)}
.avatar-row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.avatar-preview{width:48px;height:48px;border-radius:50%;border:2px solid var(--bd);overflow:hidden;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.avatar-preview img{width:100%;height:100%;object-fit:cover}
.btn{padding:10px 24px;border-radius:8px;font-size:14px;cursor:pointer;border:none;font-family:inherit;transition:all .2s;font-weight:500}
.btn-p{background:var(--ac);color:#1a0f00}.btn-p:hover{background:#d4b890}
.btn-s{background:var(--bg);color:var(--mu);border:1px solid var(--bd)}.btn-s:hover{border-color:var(--ac);color:var(--ac)}
.toast-bar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);z-index:999;background:#1a1a1a;color:#fff;padding:12px 24px;border-radius:24px;font-size:13px;opacity:0;transition:all .3s;white-space:nowrap}
.toast-bar.show{transform:translateX(-50%) translateY(0);opacity:1}
/* MESSAGES LIST */
.msgs-title{font-family:'Playfair Display',serif;font-size:22px;margin-bottom:20px;display:flex;align-items:baseline;gap:10px}
.msgs-count{font-size:13px;color:var(--mu);font-family:inherit}
.msg-card{background:var(--s);border:1px solid var(--bd);border-radius:16px;padding:20px;margin-bottom:14px;display:flex;gap:14px;animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.msg-avatar{width:42px;height:42px;border-radius:50%;flex-shrink:0;overflow:hidden;background:linear-gradient(135deg,var(--ac),#e8c99a);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;color:#fff}
.msg-avatar img{width:100%;height:100%;object-fit:cover}
.msg-body{flex:1;min-width:0}
.msg-meta{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.msg-name{font-size:14px;font-weight:500}
.msg-time{font-size:11px;color:var(--mu)}
.msg-text{font-size:14px;line-height:1.7;color:var(--mu);font-weight:300;word-break:break-word}
/* REPLY */
.msg-actions{margin-top:10px;display:flex;gap:8px;align-items:center}
.reply-btn{background:none;border:none;font-size:12px;color:var(--mu);cursor:pointer;padding:3px 0;font-family:inherit;transition:color .2s;display:flex;align-items:center;gap:4px}
.reply-btn:hover{color:var(--ac)}
.reply-form{margin-top:12px;padding:14px;background:var(--bg);border-radius:12px;border:1px solid var(--bd);display:none;animation:fadeIn .25s ease}
.reply-form.open{display:block}
.reply-form textarea{width:100%;padding:10px 12px;background:var(--s);border:1px solid var(--bd);border-radius:8px;color:var(--tx);font-family:inherit;font-size:13px;outline:none;resize:none;transition:border-color .2s}
.reply-form textarea:focus{border-color:var(--ac)}
.reply-form-footer{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px;flex-wrap:wrap}
.reply-form-footer input{flex:1;min-width:120px;padding:7px 12px;background:var(--s);border:1px solid var(--bd);border-radius:7px;color:var(--tx);font-family:inherit;font-size:12px;outline:none;transition:border-color .2s}
.reply-form-footer input:focus{border-color:var(--ac)}
.modal{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.88);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
.modal.open{opacity:1;pointer-events:all}
.modal-inner{max-width:92vw;max-height:92vh;position:relative;border-radius:18px;overflow:hidden}
.modal-inner img,.modal-inner video,.modal-inner model-viewer{max-width:92vw;max-height:86vh;display:block;border-radius:18px;object-fit:contain}
.modal-close{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;border:none;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;z-index:2}
.modal-info{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(to top,rgba(0,0,0,.8),transparent);padding:36px 20px 20px;color:#fff;border-radius:0 0 18px 18px}
.modal-info h2{font-family:'Playfair Display',serif;font-size:20px}
.modal-info p,.modal-info>div{font-size:12px;color:rgba(255,255,255,.7);margin-top:3px}.modal-info div p{margin:2px 0;font-size:12px}
.gallery-preview{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.gallery-preview-item{aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--bd);cursor:pointer;position:relative}
.gallery-preview-item img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.gallery-preview-item:hover img{transform:scale(1.05)}
.gallery-preview-more{aspect-ratio:1;border-radius:12px;background:var(--tx);display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--bg);font-size:14px;font-weight:500;transition:background .2s}
.gallery-preview-more:hover{background:var(--ac)}
.msg-recent{max-width:700px;margin:48px auto 0;padding:0 24px 80px}
.msg-recent .sec-label{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--ac);margin-bottom:6px}
.msg-recent .sec-title{font-family:'Playfair Display',serif;font-size:26px;margin-bottom:16px;color:var(--tx)}
.msg-recent .sec-title span{color:var(--ac)}
/* FOOTER */
footer{background:#1a1a1a;color:rgba(255,255,255,.7);padding:48px 0 28px}
.footer-cols{max-width:960px;margin:0 auto;padding:0 48px;display:flex;align-items:flex-start;box-sizing:border-box;flex-wrap:nowrap;overflow:hidden}
.footer-copy{max-width:960px;margin:32px auto 0;padding:20px 48px 0;box-sizing:border-box;border-top:1px solid rgba(255,255,255,.12);text-align:center;font-size:12px;color:rgba(255,255,255,.35)}
.footer-brand-logo{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;color:#fff;letter-spacing:.15em;margin-bottom:12px}
.footer-brand-desc{font-size:13px;line-height:1.75;color:rgba(255,255,255,.55);white-space:pre-line}
.footer-col-title{color:#fff;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-bottom:14px}
footer ul{list-style:none;padding:0;margin:0}
footer ul li{margin-bottom:9px}
footer ul li a{color:rgba(255,255,255,.5);text-decoration:none;font-size:13px;transition:color .2s}
footer ul li a:hover{color:rgba(255,255,255,.9)}
@media(max-width:640px){.footer-cols{padding:0 24px;overflow-x:auto;-webkit-overflow-scrolling:touch}.footer-copy{padding:16px 24px 0}}

/* REPLIES */
.replies{margin-top:12px;padding-left:14px;border-left:2px solid var(--bd);display:flex;flex-direction:column;gap:10px}
.reply-card{display:flex;gap:10px;animation:fadeIn .3s ease}
.reply-avatar{width:30px;height:30px;border-radius:50%;flex-shrink:0;overflow:hidden;background:linear-gradient(135deg,var(--ac),#e8c99a);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff}
.reply-avatar img{width:100%;height:100%;object-fit:cover}
.reply-body{flex:1;min-width:0}
.reply-meta{font-size:11px;color:var(--mu);margin-bottom:3px;display:flex;align-items:center;gap:6px}
.reply-name{font-weight:500;color:var(--tx)}
.reply-text{font-size:13px;line-height:1.6;color:var(--mu);word-break:break-word}
/* FOOTER */
.no-msgs{text-align:center;padding:48px;color:var(--mu);font-size:14px}

@media(max-width:768px){
  .modal{align-items:flex-start;}
  .modal-inner{width:100vw;max-width:none;height:100vh;max-height:none;border-radius:0;}
  .modal-inner img,.modal-inner video,.modal-inner model-viewer{max-width:100vw;max-height:calc(100vh - 140px);border-radius:0;}
  .modal-info{border-radius:0;}
}

@media(max-width:768px){
  nav{padding:0 16px;gap:6px}
  .nav-links{position:fixed;top:64px;left:0;right:0;background:var(--nav-bg);padding:0 16px;border-bottom:0;flex-direction:column;gap:4px;max-height:0;overflow:hidden;transition:max-height .25s ease, padding .25s ease, border-color .25s ease;}
  .nav-links.open{max-height:220px;padding:8px 16px;border-bottom:1px solid var(--bd);}
  .nav-links a{padding:9px 10px;}
  .nav-toggle{display:flex;}
  .msg-wrap{padding:28px 16px 60px}
  .form-row{flex-direction:column}
}

/* Theme switcher */
.theme-trigger{width:30px;height:30px;border-radius:50%;border:2px solid var(--bd);cursor:pointer;transition:all .2s;flex-shrink:0}
.theme-trigger:hover{transform:scale(1.1);border-color:var(--ac)}
.theme-popup{position:fixed;top:72px;right:16px;background:var(--s);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;z-index:999;box-shadow:0 8px 32px rgba(0,0,0,.15);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;transform:translateY(-8px)}
.theme-popup.open{opacity:1;pointer-events:all;transform:translateY(0)}
.theme-popup h4{font-size:11px;color:var(--mu);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px}
.theme-swatches{display:flex;gap:8px}
.swatch{width:32px;height:32px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:all .2s;position:relative}
.swatch:hover{transform:scale(1.15)}
.swatch.active::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.swatch-label{font-size:10px;text-align:center;color:var(--mu);margin-top:4px}
.theme-swatch-wrap{display:flex;flex-direction:column;align-items:center}

/* ── 表情包选择器 ── */
.emoji-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;border-radius:7px;padding:5px 10px;font-size:13px;cursor:pointer;transition:background .15s;flex-shrink:0}
.emoji-btn:hover{background:rgba(255,255,255,.18)}
.emoji-panel{position:absolute;bottom:calc(100% + 6px);left:0;z-index:200;background:var(--card,#1e1a14);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:10px;width:300px;max-height:220px;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.5);display:none}
.emoji-panel.open{display:flex;flex-wrap:wrap;gap:6px}
.emoji-panel img{width:44px;height:44px;object-fit:contain;cursor:pointer;border-radius:6px;padding:2px;transition:background .12s}
.emoji-panel img:hover{background:rgba(255,255,255,.15)}

</style>
</head>
<body>
<nav>
  <a class="nav-logo" href="/" id="navLogo">GAL·LERY</a>
  <button class="nav-toggle" type="button" onclick="toggleNavMenu()" aria-label="切换导航"><span></span></button>
  <div class="nav-links" id="navLinks"></div>
  <div style="position:relative">
    <div class="theme-trigger" id="themeBtn" onclick="togglePicker()" title="切换配色"></div>
    <div class="theme-popup" id="themePop">
      <h4>配色方案</h4>
      <div class="theme-swatches">
        <div class="theme-swatch-wrap"><div class="swatch" style="background:linear-gradient(135deg,#c8a97e,#f0e0c0)" data-t="warm" onclick="applyTheme('warm')"></div><div class="swatch-label">暖金</div></div>
        <div class="theme-swatch-wrap"><div class="swatch" style="background:linear-gradient(135deg,#4a90d9,#a0c8f8)" data-t="cool" onclick="applyTheme('cool')"></div><div class="swatch-label">清蓝</div></div>
        <div class="theme-swatch-wrap"><div class="swatch" style="background:linear-gradient(135deg,#333,#7c6af5)" data-t="dark" onclick="applyTheme('dark')"></div><div class="swatch-label">暗夜</div></div>
        <div class="theme-swatch-wrap"><div class="swatch" style="background:linear-gradient(135deg,#4a9460,#a8e0b0)" data-t="green" onclick="applyTheme('green')"></div><div class="swatch-label">绿意</div></div>
        <div class="theme-swatch-wrap"><div class="swatch" style="background:linear-gradient(135deg,#d4607a,#f8b0c0)" data-t="rose" onclick="applyTheme('rose')"></div><div class="swatch-label">玫瑰</div></div>
      </div>
    </div>
  </div>
</nav>

<div class="msg-hero" id="msgHero">
  <div class="msg-hero-bg" id="msgHeroBg"></div>
  <div class="msg-hero-overlay" id="msgHeroOverlay" style="opacity:.45"></div>
  <div class="msg-hero-content">
    <h1 id="msgHeroTitle" style="font-size:48px">留言板</h1>
    <p id="msgHeroSub">留下你的足迹，与我分享你的想法</p>
  </div>
</div>

<div class="msg-wrap">
  <div class="form-card">
    <h2>📝 留下留言</h2>
    <div class="avatar-row">
      <div class="avatar-preview" id="avatarPreview">
        <span id="avatarEmoji">😊</span>
        <img id="avatarImg" src="" alt="" style="display:none">
      </div>
      <div>
        <div style="font-size:13px;color:var(--mu);margin-bottom:8px">头像</div>
        <div id="avatarPoolRow" style="display:none;flex-wrap:wrap;gap:8px;margin-bottom:10px"></div>
        <input type="file" id="avatarFile" accept="image/*" style="display:none" onchange="handleAvatarUpload(this)">
        <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
          <button id="avatarUploadBtn" class="btn btn-s" style="padding:6px 14px;font-size:12px" onclick="document.getElementById('avatarFile').click()">上传头像</button>
          <button class="btn btn-s" style="padding:6px 14px;font-size:12px" onclick="clearAvatar()">使用默认</button>
        </div>
        <span id="avatarQuotaHint" style="font-size:11px;color:var(--mu);margin-top:5px;display:block"></span>
      </div>
    </div>
    <div class="form-row">
      <div class="fg"><label>昵称（可选）</label><input class="inp" type="text" id="msgName" placeholder="匿名访客"></div>
    </div>
    <div class="fg" style="margin-bottom:16px;position:relative">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
        <label style="flex:1;margin:0">留言内容 *</label>
        <div style="position:relative">
          <button class="emoji-btn" id="emojiToggleBtn" onclick="toggleEmojiPanel()" type="button">😄 表情</button>
          <div class="emoji-panel" id="emojiPanel"></div>
        </div>
      </div>
      <textarea class="inp" id="msgContent" rows="4" placeholder="写下你想说的..."></textarea>
    </div>
    <button class="btn btn-p" onclick="submitMsg()">发送留言 →</button>
  </div>
  <div class="msgs-title">留言 <span class="msgs-count" id="msgsCount"></span></div>
  <div id="msgsList"><div class="no-msgs">暂无留言，来第一个留言吧！</div></div>
</div>

<div class="msg-recent">
  <div class="sec-label">Recent Works</div>
  <h2 class="sec-title">近期<span>作品</span></h2>
  <div class="gallery-preview" id="msgGalleryPreview"></div>
</div>

<footer>
  <div id="footerInner"></div>
</footer>

<div class="modal" id="msgModal" onclick="if(event.target===this)closeMsgModal()">
  <div class="modal-inner">
    <button class="modal-close" onclick="closeMsgModal()">&#215;</button>
    <div id="msgModalBody"></div>
    <div class="modal-info">
      <h2 id="msgModalTitle"></h2>
      <div id="msgModalDesc" style="font-size:12px;color:rgba(255,255,255,.7);margin-top:3px"></div>
    </div>
  </div>
</div>
<div class="toast-bar" id="toast"></div>

<script>
// 主题由下方 applyTheme 统一初始化

let uploadedAvatarUrl='', defaultAvatarUrl='', allMsgsData=[];
let avatarMaxSizeMB=2, avatarFormats=['jpg','jpeg','png','webp'], avatarDailyLimit=0;
let _msgModalHistoryPushed=false;
let _msgPreviewOrder=[];
let _msgCurrentId='';
let _msgNavLock=false;
let _msgTouchStartY=null;

function renderFooter(ft){
  const colData = ft.columns||[];
  const brand = ft.brand||{};
  const copy = ft.copyright||'';

  const brandHtml = `
    <div style="flex:0 0 240px;padding-right:40px;flex-shrink:0">
      <p class="footer-brand-logo">${brand.logo||'GAL·LERY'}</p>
      <p class="footer-brand-desc">${brand.desc||''}</p>
    </div>`;

  const navHtml = colData.map(c=>{
    const links=(c.links||[]).map(l=>{
      const href=(l.label==='订阅RSS'&&!l.href)?'/feed.xml':(l.href||'#');
      return `<li><a href="${href}"${(l.target==='_blank')?' target="_blank"':''}>${l.label}</a></li>`;
    }).join('');
    return `<div style="flex:1;min-width:120px">
      <p class="footer-col-title">${c.title}</p>
      <ul>${links}</ul>
    </div>`;
  }).join('');

  document.getElementById('footerInner').innerHTML =
    `<div class="footer-cols">${brandHtml}${navHtml}</div>` +
    `<div class="footer-copy"><p>${copy}</p></div>`;
}

function toggleNavMenu(){
  const links=document.getElementById('navLinks');
  if(!links)return;
  links.classList.toggle('open');
}

function extOf(f){return String(f||'').split('?')[0].split('.').pop().toLowerCase();}
function isModelByFile(f){const e=extOf(f);return e==='glb'||e==='gltf';}
function isVideoByFile(f){const e=extOf(f);return e==='mp4'||e==='mov'||e==='webm';}
function itemIsModel(it){return it&&(((it.type||'').toLowerCase()==='model')||isModelByFile(it.filename));}
function itemIsVideo(it){return it&&(((it.type||'').toLowerCase()==='video')||isVideoByFile(it.filename));}

async function loadMsgGallery(){
  try{
    const data=await fetch('/api/items?per_page=6').then(r=>r.json());
    window._msgItems={};
    data.items.forEach(i=>{window._msgItems[i.id]=i;});
    const gp=document.getElementById('msgGalleryPreview');
    if(!gp)return;
    const preview=data.items.slice(0,5);
    _msgPreviewOrder = preview.map(i=>i.id);
    gp.innerHTML=preview.map(item=>{
      const isVid=itemIsVideo(item);
      const isModel=itemIsModel(item);
      const src=item.cover||item.filename;
      return src
        ?`<div class="gallery-preview-item" onclick="location.href='/#gallery/${item.id}'">
            <img src="${fileSrc(src)}" alt="${esc(item.title||'')}">
            ${(isVid||isModel)?'<div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="white"><polygon points="5,3 19,12 5,21"/></svg></div>':''}
          </div>`
        :`<div class="gallery-preview-item" onclick="location.href='/#gallery/${item.id}'" style="display:flex;align-items:center;justify-content:center;font-size:30px">📦</div>`;
    }).join('')+`<a class="gallery-preview-more" href="/">查看全部 →</a>`;
  }catch(e){console.error(e);}
}

function openMsgModal(id){
  const item=window._msgItems&&window._msgItems[id];if(!item)return;
  _msgCurrentId = id;
  const src=fileSrc(item.filename);
  const isVid=itemIsVideo(item);
  const isModel=itemIsModel(item);
  const imgs = !isVid && !isModel && Array.isArray(item.images) ? item.images.filter(Boolean) : [];
  if(!isVid && !isModel && imgs.length>1){
    const gapPx=Math.max(0,Math.min(100,parseInt(item.images_gap_px,10)||10));
    const html = imgs.map(fn=>`<img src="${fileSrc(fn)}" style="max-width:92vw;width:min(92vw,900px);display:block;border-radius:14px;margin:0 auto ${item.images_gap?gapPx:0}px;object-fit:contain">`).join('');
    document.getElementById('msgModalBody').innerHTML=`<div style="max-height:82vh;overflow-y:auto;padding-right:4px">${html}</div>`;
  }else{
    document.getElementById('msgModalBody').innerHTML=isVid
      ?`<video src="${src}" controls autoplay style="max-width:92vw;max-height:82vh;border-radius:14px;display:block"></video>`
      :(isModel
        ?`<model-viewer src="${src}" camera-controls auto-rotate exposure="1" shadow-intensity="1" style="width:min(92vw,900px);height:min(82vh,720px);background:rgba(0,0,0,.15);border-radius:14px"></model-viewer>`
        :`<img src="${src}" style="max-width:92vw;max-height:82vh;border-radius:14px;display:block;object-fit:contain">`);
  }
  const cats=((item.categories?.length?item.categories:[item.category])||[]).filter(Boolean);
  document.getElementById('msgModalTitle').textContent=item.title||'';
  const _mCats=cats.length?cats.join(' · '):'';document.getElementById('msgModalDesc').innerHTML=(item.description||'')+(_mCats?`<span style="opacity:.6;margin-left:6px">${_mCats}</span>`:'');
  if(!_msgModalHistoryPushed){
    try{ history.pushState({msgModalOpen:true}, ''); _msgModalHistoryPushed=true; }catch(e){}
  }
  document.getElementById('msgModal').classList.add('open');
  document.body.style.overflow='hidden';
}

function openMsgByOffset(step){
  if(!_msgCurrentId || !_msgPreviewOrder.length) return;
  const idx = _msgPreviewOrder.indexOf(_msgCurrentId);
  if(idx < 0) return;
  const next = idx + step;
  if(next < 0 || next >= _msgPreviewOrder.length) return;
  openMsgModal(_msgPreviewOrder[next]);
}

function handleMsgWheel(e){
  const m=document.getElementById('msgModal');
  if(!m || !m.classList.contains('open')) return;
  if(_msgNavLock) return;
  if(Math.abs(e.deltaY) < 8) return;
  e.preventDefault();
  _msgNavLock = true;
  openMsgByOffset(e.deltaY > 0 ? 1 : -1);
  setTimeout(()=>{ _msgNavLock = false; }, 180);
}

function handleMsgTouchStart(e){
  const m=document.getElementById('msgModal');
  if(!m || !m.classList.contains('open')) return;
  if(!e.touches || !e.touches.length) return;
  _msgTouchStartY = e.touches[0].clientY;
}

function handleMsgTouchEnd(e){
  const m=document.getElementById('msgModal');
  if(!m || !m.classList.contains('open')) return;
  if(_msgNavLock) return;
  if(_msgTouchStartY == null) return;
  const y = (e.changedTouches && e.changedTouches[0]) ? e.changedTouches[0].clientY : _msgTouchStartY;
  const dy = y - _msgTouchStartY;
  _msgTouchStartY = null;
  if(Math.abs(dy) < 36) return;
  _msgNavLock = true;
  openMsgByOffset(dy < 0 ? 1 : -1);
  setTimeout(()=>{ _msgNavLock = false; }, 220);
}

function closeMsgModal(fromPopstate=false){
  document.getElementById('msgModal').classList.remove('open');
  document.body.style.overflow='';
  document.getElementById('msgModalBody').innerHTML='';
  _msgCurrentId='';
  _msgTouchStartY=null;
  if(_msgModalHistoryPushed){
    if(!fromPopstate){
      try{ history.back(); }catch(e){}
    }
    _msgModalHistoryPushed=false;
  }
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMsgModal();if(e.key==='ArrowDown')openMsgByOffset(1);if(e.key==='ArrowUp')openMsgByOffset(-1);});
window.addEventListener('popstate',()=>{
  const m=document.getElementById('msgModal');
  if(m&&m.classList.contains('open')) closeMsgModal(true);
});
const _msgModalEl=document.getElementById('msgModal');
_msgModalEl.addEventListener('wheel', handleMsgWheel, {passive:false});
_msgModalEl.addEventListener('touchstart', handleMsgTouchStart, {passive:true});
_msgModalEl.addEventListener('touchend', handleMsgTouchEnd, {passive:true});

async function init(){
  const site=await fetch('/api/site').then(r=>r.json());
  const b=site.site||{};
  if(b.title)document.title='留言板 · '+b.title;
  if(b.favicon)document.getElementById('faviconLink').href='/static/uploads/'+b.favicon;
  document.getElementById('navLogo').textContent=site.nav?.logo||'GAL·LERY';
  document.getElementById('navLinks').innerHTML=(site.nav?.links||[]).map(l=>`<a href="${l.href}" target="${l.target||'_self'}">${l.label}</a>`).join('');
  const mp=site.messages_page||{};
  // Hero background
  const heroBg=document.getElementById('msgHeroBg');
  if(mp.bgType==='image'&&mp.bgValue){
    heroBg.style.backgroundImage=`url('/static/uploads/${mp.bgValue}')`;
    heroBg.style.backgroundSize='cover';
    heroBg.style.backgroundPosition='center';
  } else {
    heroBg.style.background=mp.bgValue||'linear-gradient(135deg,#1a1208,#3d2510,#6b3d18)';
  }
  // Overlay opacity
  const overlay=document.getElementById('msgHeroOverlay');
  if(mp.overlayOpacity!=null) overlay.style.opacity=mp.overlayOpacity;
  // Hero height
  if(mp.height) document.getElementById('msgHero').style.minHeight=mp.height+'px';
  // Title font size
  const titleEl=document.getElementById('msgHeroTitle');
  if(mp.titleSize) titleEl.style.fontSize=mp.titleSize+'px';
  titleEl.textContent=mp.title||'留言板';
  document.getElementById('msgHeroSub').textContent=mp.subtitle||'留下你的足迹，与我分享你的想法';
  defaultAvatarUrl=mp.defaultAvatar?fileSrc(mp.defaultAvatar):'';
  // 渲染头像池
  const pool = mp.avatarPool || [];
  const poolRow = document.getElementById('avatarPoolRow');
  if (pool.length && poolRow) {
    poolRow.style.display = 'flex';
    poolRow.innerHTML = pool.map(fn => `
      <div onclick="selectPoolAvatar('${fileSrc(fn)}')"
        style="width:44px;height:44px;border-radius:50%;overflow:hidden;cursor:pointer;border:2px solid var(--bd);transition:border-color .15s;flex-shrink:0"
        onmouseover="this.style.borderColor='var(--ac)'"
        onmouseout="this.style.borderColor=this.dataset.sel?'var(--ac)':'var(--bd)'"
        data-url="${fileSrc(fn)}">
        <img src="${fileSrc(fn)}" style="width:100%;height:100%;object-fit:cover" onerror="this.parentElement.style.display='none'">
      </div>`).join('');
  }
  avatarMaxSizeMB=mp.avatarMaxSizeMB??2;
  avatarFormats=(mp.avatarFormats||['jpg','png','webp']).map(f=>f.toLowerCase());
  avatarDailyLimit=mp.avatarDailyLimit??0;
  // 查询今日已用次数，更新提示
  updateAvatarQuotaHint();
  // 如果禁止上传，隐藏上传按钮
  const uploadBtn=document.querySelector('[onclick*="avatarFile"]');
  if(uploadBtn) uploadBtn.style.display=avatarMaxSizeMB===0?'none':'';
  // Footer
  renderFooter(site.footer||{});
  loadMsgGallery();
  loadMessages();
  loadEmojiPanel();
}

async function handleAvatarUpload(inp){
  const file=inp.files[0];if(!file)return;
  // 禁止上传
  if(avatarMaxSizeMB===0){toast('头像上传已关闭');inp.value='';return;}
  // 格式校验
  const ext=file.name.split('.').pop().toLowerCase();
  const allowed=avatarFormats.length?avatarFormats:['jpg','jpeg','png','webp'];
  const extAlias={'jpg':'jpeg','jpeg':'jpg'};
  if(!allowed.includes(ext)&&!allowed.includes(extAlias[ext]||'')){
    toast('不支持的格式，允许：'+allowed.join('/').toUpperCase());inp.value='';return;
  }
  // 大小校验
  if(avatarMaxSizeMB>0&&file.size>avatarMaxSizeMB*1024*1024){
    toast(`头像超过限制（最大 ${avatarMaxSizeMB}MB，当前 ${(file.size/1024/1024).toFixed(1)}MB）`);inp.value='';return;
  }
  // 向后端记录上传次数（含限制校验）
  const chk=await fetch('/api/avatar-upload',{method:'POST'}).then(r=>r.json()).catch(()=>({success:true}));
  if(!chk.success){toast(chk.error||'今日上传次数已达上限');inp.value='';return;}
  document.getElementById('avatarEmoji').style.display='none';
  const img=document.getElementById('avatarImg');
  img.src=URL.createObjectURL(file);img.style.display='block';
  const reader=new FileReader();
  reader.onload=e=>{uploadedAvatarUrl=e.target.result;};
  reader.readAsDataURL(file);
  updateAvatarQuotaHint();
}

async function updateAvatarQuotaHint(){
  if(avatarDailyLimit<=0)return;
  try{
    const s=await fetch('/api/avatar-upload-status').then(r=>r.json());
    const hint=document.getElementById('avatarQuotaHint');
    if(hint){
      hint.textContent=`今日头像上传：${s.count}/${s.limit} 次`;
      hint.style.color=s.remaining===0?'#e05c5c':'var(--mu)';
    }
  }catch(e){}
}
function selectPoolAvatar(url) {
  uploadedAvatarUrl = url;
  document.getElementById('avatarImg').src = url;
  document.getElementById('avatarImg').style.display = 'block';
  document.getElementById('avatarEmoji').style.display = 'none';
  // 高亮选中
  document.querySelectorAll('#avatarPoolRow > div').forEach(d => {
    d.style.borderColor = d.dataset.url === url ? 'var(--ac)' : 'var(--bd)';
    d.dataset.sel = d.dataset.url === url ? '1' : '';
  });
}

function clearAvatar(){
  uploadedAvatarUrl='';
  document.getElementById('avatarEmoji').style.display='block';
  document.getElementById('avatarImg').style.display='none';
  document.getElementById('avatarImg').src='';
}

async function submitMsg(){
  const content=document.getElementById('msgContent').value.trim();
  if(!content){toast('请输入留言内容');return;}
  const res=await fetch('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name:document.getElementById('msgName').value||'匿名',content,avatar:uploadedAvatarUrl})});
  if(res.ok){
    document.getElementById('msgContent').value='';
    document.getElementById('msgName').value='';
    clearAvatar();
    toast('留言已提交，等待审核后显示 ✓');
  } else toast('提交失败，请重试');
}

async function loadMessages(){
  const msgs=await fetch('/api/messages').then(r=>r.json());
  allMsgsData=msgs;
  const list=document.getElementById('msgsList');
  document.getElementById('msgsCount').textContent=msgs.length?`(${msgs.length})`:' ';
  if(!msgs.length){list.innerHTML='<div class="no-msgs">暂无留言，来第一个留言吧！</div>';return;}
  list.innerHTML=msgs.map(m=>buildMsgCard(m)).join('');
}

function buildMsgCard(m){
  const name=m.name||'匿名';
  const initials=name.slice(0,1).toUpperCase();
  let avHtml=buildAvatar(m.avatar, initials, 42);
  const replies=m.replies||[];
  const repliesHtml=replies.length?`<div class="replies">${replies.map(r=>buildReplyCard(r)).join('')}</div>`:'';
  return `<div class="msg-card" id="mc-${m.id}">
    <div class="msg-avatar">${avHtml}</div>
    <div class="msg-body">
      <div class="msg-meta">
        <span class="msg-name">${esc(name)}</span>
        <span class="msg-time">${m.time||''}</span>
      </div>
      <div class="msg-text">${renderContent(m.content)}</div>
      <div class="msg-actions">
        <button class="reply-btn" onclick="toggleReplyForm('${m.id}')">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
          回复
        </button>
      </div>
      <div class="reply-form" id="rf-${m.id}">
        <textarea rows="2" placeholder="写下回复..." id="rt-${m.id}"></textarea>
        <div class="reply-form-footer">
          <input type="text" placeholder="昵称（可选）" id="rn-${m.id}">
          <div style="display:flex;gap:6px">
            <button class="btn btn-s" style="padding:5px 12px;font-size:12px" onclick="toggleReplyForm('${m.id}')">取消</button>
            <button class="btn btn-p" style="padding:5px 14px;font-size:12px" onclick="submitReply('${m.id}')">发送</button>
          </div>
        </div>
      </div>
      ${repliesHtml}
    </div>
  </div>`;
}

function buildReplyCard(r){
  const name=r.name||'匿名';
  const avHtml=buildAvatar(r.avatar||'', name.slice(0,1).toUpperCase(), 30);
  return `<div class="reply-card">
    <div class="reply-avatar">${avHtml}</div>
    <div class="reply-body">
      <div class="reply-meta"><span class="reply-name">${esc(name)}</span><span>${r.time||''}</span></div>
      <div class="reply-text">${renderContent(r.content)}</div>
    </div>
  </div>`;
}

function buildAvatar(avatarData, initials, size){
  if(avatarData && avatarData.length > 4){
    // 支持 base64、/static/ 路径、https:// 外链
    const src = avatarData.startsWith('data:') || avatarData.startsWith('http') || avatarData.startsWith('/')
      ? avatarData : fileSrc(avatarData);
    return `<img src="${src}" alt="" style="width:${size}px;height:${size}px;object-fit:cover;border-radius:50%" referrerpolicy="no-referrer" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><span style="display:none;width:${size}px;height:${size}px;border-radius:50%;background:linear-gradient(135deg,var(--ac),#e8c99a);align-items:center;justify-content:center;font-size:${Math.round(size*0.4)}px;color:#fff;font-weight:600">${initials}</span>`;
  } else if(defaultAvatarUrl){
    return `<img src="${defaultAvatarUrl}" alt="" style="width:${size}px;height:${size}px;object-fit:cover;border-radius:50%">`;
  }
  return `<span style="width:${size}px;height:${size}px;border-radius:50%;background:linear-gradient(135deg,var(--ac),#e8c99a);display:flex;align-items:center;justify-content:center;font-size:${Math.round(size*0.4)}px;color:#fff;font-weight:600">${initials}</span>`;
}

function toggleReplyForm(msgId){
  const rf=document.getElementById('rf-'+msgId);
  rf.classList.toggle('open');
  if(rf.classList.contains('open')) document.getElementById('rt-'+msgId).focus();
}

async function submitReply(msgId){
  const content=document.getElementById('rt-'+msgId).value.trim();
  if(!content){toast('请输入回复内容');return;}
  const name=document.getElementById('rn-'+msgId).value||'匿名';
  const res=await fetch('/api/messages/'+msgId+'/reply',{method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name,content})});
  if(res.ok){
    // Reload messages to reflect new reply
    await loadMessages();
    toast('回复已提交 ✓');
  } else toast('提交失败，请重试');
}

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);}
function stripHtml(h){const d=document.createElement('div');d.innerHTML=h;return d.textContent||d.innerText||'';}function fileSrc(f){return f&&(f.startsWith('http://')||f.startsWith('https://'))?f:'/static/uploads/'+f;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function renderContent(s) {
  return esc(s)
    .replace(/\[emoji:([^\]]{4,300})\]/g, (_,url) =>
      `<img src="${url}" style="width:28px;height:28px;object-fit:contain;vertical-align:middle;margin:0 2px;border-radius:4px" referrerpolicy="no-referrer" loading="lazy">`)
    .replace(/\n/g,'<br>');
}

// 监听首页配色实时同步

// ── 配色方案 ──
const THEME_COLORS={warm:'#c8a97e',cool:'#4a90d9',dark:'#7c6af5',green:'#4a9460',rose:'#d4607a'};
function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  localStorage.setItem('g_theme',t);
  const btn=document.getElementById('themeBtn');
  if(btn) btn.style.background=THEME_COLORS[t]||'#c8a97e';
  document.querySelectorAll('.swatch').forEach(s=>s.classList.toggle('active',s.dataset.t===t));
}
function togglePicker(){document.getElementById('themePop').classList.toggle('open');}
document.addEventListener('click',e=>{
  if(!e.target.closest('.theme-trigger')&&!e.target.closest('.theme-popup')){
    const pop=document.getElementById('themePop');
    if(pop) pop.classList.remove('open');
  }
});
// 实时监听其他页面的主题变化
window.addEventListener('storage',e=>{
  if(e.key==='g_theme'&&e.newValue) applyTheme(e.newValue);
});

// 初始化主题
applyTheme(localStorage.getItem('g_theme')||'warm'); // overridden by site.theme in init if no localStorage
init();

// ── 表情包选择器 ──
async function loadEmojiPanel() {
  const d = await fetch('/api/emoji').then(r => r.json()).catch(() => ({items:[]}));
  const panel = document.getElementById('emojiPanel');
  if (!panel) return;
  const items = d.items || [];
  if (!items.length) {
    document.getElementById('emojiToggleBtn').style.display = 'none';
    return;
  }
  panel.innerHTML = items.map(item =>
    `<img src="${fileSrc(item.filename)}" title="${item.tag||''}" loading="lazy"
      referrerpolicy="no-referrer"
      onclick="insertEmoji('${fileSrc(item.filename)}')">`
  ).join('');
}

function toggleEmojiPanel() {
  const panel = document.getElementById('emojiPanel');
  panel.classList.toggle('open');
}

function insertEmoji(url) {
  // 在光标位置插入 <img> markdown 风格：直接插入 URL，后端存纯文本
  // 用特殊占位标记 [emoji:url]，前台渲染时替换为 img
  const ta = document.getElementById('msgContent');
  const pos = ta.selectionStart;
  const val = ta.value;
  const tag = `[emoji:${url}]`;
  ta.value = val.slice(0, pos) + tag + val.slice(pos);
  ta.selectionStart = ta.selectionEnd = pos + tag.length;
  ta.focus();
  document.getElementById('emojiPanel').classList.remove('open');
}

// 点击外部关闭
document.addEventListener('click', function(e) {
  const btn = document.getElementById('emojiToggleBtn');
  const panel = document.getElementById('emojiPanel');
  if (panel && btn && !btn.contains(e.target) && !panel.contains(e.target)) {
    panel.classList.remove('open');
  }
});
