<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>留言板 · GALLERY</title>
<link rel="icon" id="faviconLink" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Noto+Sans+SC:wght@300;400;500&family=Cormorant+Garamond:wght@300;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf9f7;--s:#fff;--tx:#1a1a1a;--mu:#8a8680;--ac:#c8a97e;--bd:#e8e4df;--nav-bg:rgba(250,249,247,.93)}
[data-theme=cool]{--bg:#f0f4f8;--s:#fff;--tx:#1e2a3a;--mu:#6b7d8f;--ac:#4a90d9;--bd:#d4dde8;--nav-bg:rgba(240,244,248,.93)}
[data-theme=dark]{--bg:#0f1117;--s:#1a1c24;--tx:#e2e4f0;--mu:#6b6e84;--ac:#7c6af5;--bd:#252833;--nav-bg:rgba(15,17,23,.95)}
[data-theme=green]{--bg:#f2f7f2;--s:#fff;--tx:#1a2e1a;--mu:#5a7a5a;--ac:#4a9460;--bd:#d0e8d0;--nav-bg:rgba(242,247,242,.93)}
[data-theme=rose]{--bg:#fdf6f8;--s:#fff;--tx:#2e1a20;--mu:#9a6875;--ac:#d4607a;--bd:#f0d8de;--nav-bg:rgba(253,246,248,.93)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;transition:background .3s,color .3s}
nav{position:sticky;top:0;z-index:100;height:64px;background:var(--nav-bg);backdrop-filter:blur(16px);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 28px;transition:background .3s}
.nav-logo{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;letter-spacing:.15em;color:var(--tx);text-decoration:none;margin-right:auto}
.nav-links a{font-size:13px;color:var(--mu);text-decoration:none;padding:7px 13px;border-radius:20px;transition:all .2s}
.nav-links a:hover{color:var(--tx);background:var(--bd)}
/* HERO */
.msg-hero{min-height:320px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.msg-hero-bg{position:absolute;inset:0;background-size:cover;background-position:center}
.msg-hero-overlay{position:absolute;inset:0;background:#000}
.msg-hero-content{position:relative;z-index:2;text-align:center;color:#fff;padding:48px 20px}
.msg-hero-content h1{font-family:'Playfair Display',serif;margin-bottom:12px}
.msg-hero-content p{font-weight:300;color:rgba(255,255,255,.8);max-width:440px;margin:0 auto}
/* MAIN */
.msg-wrap{max-width:700px;margin:0 auto;padding:44px 24px 80px}
/* FORM */
.form-card{background:var(--s);border:1px solid var(--bd);border-radius:18px;padding:28px;margin-bottom:36px;box-shadow:0 2px 16px rgba(0,0,0,.05)}
.form-card h2{font-family:'Playfair Display',serif;font-size:20px;margin-bottom:20px}
.form-row{display:flex;gap:12px;margin-bottom:14px}
.fg{display:flex;flex-direction:column;gap:5px;flex:1}
.fg label{font-size:11px;color:var(--mu);letter-spacing:.05em}
.inp{padding:10px 14px;background:var(--bg);border:1px solid var(--bd);border-radius:8px;color:var(--tx);font-family:inherit;font-size:14px;outline:none;transition:border-color .2s;width:100%}
.inp:focus{border-color:var(--ac)}
.avatar-row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.avatar-preview{width:48px;height:48px;border-radius:50%;border:2px solid var(--bd);overflow:hidden;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.avatar-preview img{width:100%;height:100%;object-fit:cover}
.btn{padding:10px 24px;border-radius:8px;font-size:14px;cursor:pointer;border:none;font-family:inherit;transition:all .2s;font-weight:500}
.btn-p{background:var(--ac);color:#1a0f00}.btn-p:hover{background:#d4b890}
.btn-s{background:var(--bg);color:var(--mu);border:1px solid var(--bd)}.btn-s:hover{border-color:var(--ac);color:var(--ac)}
.toast-bar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);z-index:999;background:#1a1a1a;color:#fff;padding:12px 24px;border-radius:24px;font-size:13px;opacity:0;transition:all .3s;white-space:nowrap}
.toast-bar.show{transform:translateX(-50%) translateY(0);opacity:1}
/* MESSAGES LIST */
.msgs-title{font-family:'Playfair Display',serif;font-size:22px;margin-bottom:20px;display:flex;align-items:baseline;gap:10px}
.msgs-count{font-size:13px;color:var(--mu);font-family:inherit}
.msg-card{background:var(--s);border:1px solid var(--bd);border-radius:16px;padding:20px;margin-bottom:14px;display:flex;gap:14px;animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.msg-avatar{width:42px;height:42px;border-radius:50%;flex-shrink:0;overflow:hidden;background:linear-gradient(135deg,var(--ac),#e8c99a);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;color:#fff}
.msg-avatar img{width:100%;height:100%;object-fit:cover}
.msg-body{flex:1;min-width:0}
.msg-meta{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.msg-name{font-size:14px;font-weight:500}
.msg-time{font-size:11px;color:var(--mu)}
.msg-text{font-size:14px;line-height:1.7;color:var(--mu);font-weight:300;word-break:break-word}
/* REPLY */
.msg-actions{margin-top:10px;display:flex;gap:8px;align-items:center}
.reply-btn{background:none;border:none;font-size:12px;color:var(--mu);cursor:pointer;padding:3px 0;font-family:inherit;transition:color .2s;display:flex;align-items:center;gap:4px}
.reply-btn:hover{color:var(--ac)}
.reply-form{margin-top:12px;padding:14px;background:var(--bg);border-radius:12px;border:1px solid var(--bd);display:none;animation:fadeIn .25s ease}
.reply-form.open{display:block}
.reply-form textarea{width:100%;padding:10px 12px;background:var(--s);border:1px solid var(--bd);border-radius:8px;color:var(--tx);font-family:inherit;font-size:13px;outline:none;resize:none;transition:border-color .2s}
.reply-form textarea:focus{border-color:var(--ac)}
.reply-form-footer{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px;flex-wrap:wrap}
.reply-form-footer input{flex:1;min-width:120px;padding:7px 12px;background:var(--s);border:1px solid var(--bd);border-radius:7px;color:var(--tx);font-family:inherit;font-size:12px;outline:none;transition:border-color .2s}
.reply-form-footer input:focus{border-color:var(--ac)}
/* REPLIES */
.replies{margin-top:12px;padding-left:14px;border-left:2px solid var(--bd);display:flex;flex-direction:column;gap:10px}
.reply-card{display:flex;gap:10px;animation:fadeIn .3s ease}
.reply-avatar{width:30px;height:30px;border-radius:50%;flex-shrink:0;overflow:hidden;background:linear-gradient(135deg,var(--ac),#e8c99a);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff}
.reply-avatar img{width:100%;height:100%;object-fit:cover}
.reply-body{flex:1;min-width:0}
.reply-meta{font-size:11px;color:var(--mu);margin-bottom:3px;display:flex;align-items:center;gap:6px}
.reply-name{font-weight:500;color:var(--tx)}
.reply-text{font-size:13px;line-height:1.6;color:var(--mu);word-break:break-word}
/* FOOTER */
.no-msgs{text-align:center;padding:48px;color:var(--mu);font-size:14px}
footer{background:#1a1a1a;color:rgba(255,255,255,.7);padding:36px 36px 22px}
.footer-inner{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:2fr 1fr 1fr;gap:32px;margin-bottom:28px}
.footer-brand h2{font-family:'Cormorant Garamond',serif;font-size:22px;color:#fff;letter-spacing:.15em;margin-bottom:8px}
.footer-brand p{font-size:13px;line-height:1.7;white-space:pre-line}
footer h4{color:#fff;font-size:13px;margin-bottom:11px}
footer ul{list-style:none}footer ul li{margin-bottom:6px}
footer ul li a{color:rgba(255,255,255,.6);text-decoration:none;font-size:13px;transition:color .2s}
footer ul li a:hover{color:var(--ac)}
.footer-bottom{border-top:1px solid rgba(255,255,255,.1);padding-top:18px;text-align:center;font-size:12px;color:rgba(255,255,255,.4)}
@media(max-width:768px){nav{padding:0 14px}.msg-wrap{padding:28px 16px 60px}.form-row{flex-direction:column}.footer-inner{grid-template-columns:1fr}}

/* Theme switcher */
.theme-trigger{width:30px;height:30px;border-radius:50%;border:2px solid var(--bd);cursor:pointer;transition:all .2s;flex-shrink:0}
.theme-trigger:hover{transform:scale(1.1);border-color:var(--ac)}
.theme-popup{position:fixed;top:72px;right:16px;background:var(--s);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;z-index:999;box-shadow:0 8px 32px rgba(0,0,0,.15);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;transform:translateY(-8px)}
.theme-popup.open{opacity:1;pointer-events:all;transform:translateY(0)}
.theme-popup h4{font-size:11px;color:var(--mu);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px}
.theme-swatches{display:flex;gap:8px}
.swatch{width:32px;height:32px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:all .2s;position:relative}
.swatch:hover{transform:scale(1.15)}
.swatch.active::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.swatch-label{font-size:10px;text-align:center;color:var(--mu);margin-top:4px}
.theme-swatch-wrap{display:flex;flex-direction:column;align-items:center}
</style>
</head>
<body>
<nav>
  <a class="nav-logo" href="/" id="navLogo">GAL·LERY</a>
  <div class="nav-links" id="navLinks"></div>
  <div style="position:relative">
    <div class="theme-trigger" id="themeBtn" onclick="togglePicker()" title="切换配色"></div>
    <div class="theme-popup" id="themePop">
      <h4>配色方案</h4>
      <div class="theme-swatches">
        <div class="theme-swatch-wrap"><div class="swatch" style="background:linear-gradient(135deg,#c8a97e,#f0e0c0)" data-t="warm" onclick="applyTheme('warm')"></div><div class="swatch-label">暖金</div></div>
        <div class="theme-swatch-wrap"><div class="swatch" style="background:linear-gradient(135deg,#4a90d9,#a0c8f8)" data-t="cool" onclick="applyTheme('cool')"></div><div class="swatch-label">清蓝</div></div>
        <div class="theme-swatch-wrap"><div class="swatch" style="background:linear-gradient(135deg,#333,#7c6af5)" data-t="dark" onclick="applyTheme('dark')"></div><div class="swatch-label">暗夜</div></div>
        <div class="theme-swatch-wrap"><div class="swatch" style="background:linear-gradient(135deg,#4a9460,#a8e0b0)" data-t="green" onclick="applyTheme('green')"></div><div class="swatch-label">绿意</div></div>
        <div class="theme-swatch-wrap"><div class="swatch" style="background:linear-gradient(135deg,#d4607a,#f8b0c0)" data-t="rose" onclick="applyTheme('rose')"></div><div class="swatch-label">玫瑰</div></div>
      </div>
    </div>
  </div>
</nav>

<div class="msg-hero" id="msgHero">
  <div class="msg-hero-bg" id="msgHeroBg"></div>
  <div class="msg-hero-overlay" id="msgHeroOverlay" style="opacity:.45"></div>
  <div class="msg-hero-content">
    <h1 id="msgHeroTitle" style="font-size:48px">留言板</h1>
    <p id="msgHeroSub">留下你的足迹，与我分享你的想法</p>
  </div>
</div>

<div class="msg-wrap">
  <div class="form-card">
    <h2>📝 留下留言</h2>
    <div class="avatar-row">
      <div class="avatar-preview" id="avatarPreview">
        <span id="avatarEmoji">😊</span>
        <img id="avatarImg" src="" alt="" style="display:none">
      </div>
      <div>
        <div style="font-size:13px;color:var(--mu);margin-bottom:5px">头像（可上传图片）</div>
        <input type="file" id="avatarFile" accept="image/*" style="display:none" onchange="handleAvatarUpload(this)">
        <button class="btn btn-s" style="padding:6px 14px;font-size:12px" onclick="document.getElementById('avatarFile').click()">上传头像</button>
        <button class="btn btn-s" style="padding:6px 14px;font-size:12px;margin-left:6px" onclick="clearAvatar()">使用默认</button>
      </div>
    </div>
    <div class="form-row">
      <div class="fg"><label>昵称（可选）</label><input class="inp" type="text" id="msgName" placeholder="匿名访客"></div>
    </div>
    <div class="fg" style="margin-bottom:16px"><label>留言内容 *</label><textarea class="inp" id="msgContent" rows="4" placeholder="写下你想说的..."></textarea></div>
    <button class="btn btn-p" onclick="submitMsg()">发送留言 →</button>
  </div>
  <div class="msgs-title">留言 <span class="msgs-count" id="msgsCount"></span></div>
  <div id="msgsList"><div class="no-msgs">暂无留言，来第一个留言吧！</div></div>
</div>

<footer>
  <div class="footer-inner" id="footerInner"></div>
  <div class="footer-bottom"><p id="footerCopy"></p></div>
</footer>
<div class="toast-bar" id="toast"></div>

<script>
// 主题由下方 applyTheme 统一初始化

let uploadedAvatarUrl='', defaultAvatarUrl='', allMsgsData=[];

async function init(){
  const site=await fetch('/api/site').then(r=>r.json());
  const b=site.site||{};
  if(b.title)document.title='留言板 · '+b.title;
  if(b.favicon)document.getElementById('faviconLink').href='/static/uploads/'+b.favicon;
  document.getElementById('navLogo').textContent=site.nav?.logo||'GAL·LERY';
  document.getElementById('navLinks').innerHTML=(site.nav?.links||[]).map(l=>`<a href="${l.href}">${l.label}</a>`).join('');
  const mp=site.messages_page||{};
  // Hero background
  const heroBg=document.getElementById('msgHeroBg');
  if(mp.bgType==='image'&&mp.bgValue){
    heroBg.style.backgroundImage=`url('/static/uploads/${mp.bgValue}')`;
    heroBg.style.backgroundSize='cover';
    heroBg.style.backgroundPosition='center';
  } else {
    heroBg.style.background=mp.bgValue||'linear-gradient(135deg,#1a1208,#3d2510,#6b3d18)';
  }
  // Overlay opacity
  const overlay=document.getElementById('msgHeroOverlay');
  if(mp.overlayOpacity!=null) overlay.style.opacity=mp.overlayOpacity;
  // Hero height
  if(mp.height) document.getElementById('msgHero').style.minHeight=mp.height+'px';
  // Title font size
  const titleEl=document.getElementById('msgHeroTitle');
  if(mp.titleSize) titleEl.style.fontSize=mp.titleSize+'px';
  titleEl.textContent=mp.title||'留言板';
  document.getElementById('msgHeroSub').textContent=mp.subtitle||'留下你的足迹，与我分享你的想法';
  defaultAvatarUrl=mp.defaultAvatar?('/static/uploads/'+mp.defaultAvatar):'';
  // Footer
  const ft=site.footer||{};
  const cols=(ft.columns||[]).map(col=>`<div><h4>${col.title}</h4><ul>${(col.links||[]).map(l=>`<li><a href="${l.href}">${l.label}</a></li>`).join('')}</ul></div>`).join('');
  document.getElementById('footerInner').innerHTML=`<div class="footer-brand"><h2>${ft.brand?.logo||'GAL·LERY'}</h2><p>${ft.brand?.desc||''}</p></div>${cols}`;
  document.getElementById('footerCopy').textContent=ft.copyright||'';
  loadMessages();
}

function handleAvatarUpload(inp){
  const file=inp.files[0];if(!file)return;
  document.getElementById('avatarEmoji').style.display='none';
  const img=document.getElementById('avatarImg');
  img.src=URL.createObjectURL(file);img.style.display='block';
  const reader=new FileReader();
  reader.onload=e=>{uploadedAvatarUrl=e.target.result;};
  reader.readAsDataURL(file);
}
function clearAvatar(){
  uploadedAvatarUrl='';
  document.getElementById('avatarEmoji').style.display='block';
  document.getElementById('avatarImg').style.display='none';
  document.getElementById('avatarImg').src='';
}

async function submitMsg(){
  const content=document.getElementById('msgContent').value.trim();
  if(!content){toast('请输入留言内容');return;}
  const res=await fetch('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name:document.getElementById('msgName').value||'匿名',content,avatar:uploadedAvatarUrl})});
  if(res.ok){
    document.getElementById('msgContent').value='';
    document.getElementById('msgName').value='';
    clearAvatar();
    toast('留言已提交，等待审核后显示 ✓');
  } else toast('提交失败，请重试');
}

async function loadMessages(){
  const msgs=await fetch('/api/messages').then(r=>r.json());
  allMsgsData=msgs;
  const list=document.getElementById('msgsList');
  document.getElementById('msgsCount').textContent=msgs.length?`(${msgs.length})`:' ';
  if(!msgs.length){list.innerHTML='<div class="no-msgs">暂无留言，来第一个留言吧！</div>';return;}
  list.innerHTML=msgs.map(m=>buildMsgCard(m)).join('');
}

function buildMsgCard(m){
  const name=m.name||'匿名';
  const initials=name.slice(0,1).toUpperCase();
  let avHtml=buildAvatar(m.avatar, initials, 42);
  const replies=m.replies||[];
  const repliesHtml=replies.length?`<div class="replies">${replies.map(r=>buildReplyCard(r)).join('')}</div>`:'';
  return `<div class="msg-card" id="mc-${m.id}">
    <div class="msg-avatar">${avHtml}</div>
    <div class="msg-body">
      <div class="msg-meta">
        <span class="msg-name">${esc(name)}</span>
        <span class="msg-time">${m.time||''}</span>
      </div>
      <div class="msg-text">${esc(m.content)}</div>
      <div class="msg-actions">
        <button class="reply-btn" onclick="toggleReplyForm('${m.id}')">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
          回复
        </button>
      </div>
      <div class="reply-form" id="rf-${m.id}">
        <textarea rows="2" placeholder="写下回复..." id="rt-${m.id}"></textarea>
        <div class="reply-form-footer">
          <input type="text" placeholder="昵称（可选）" id="rn-${m.id}">
          <div style="display:flex;gap:6px">
            <button class="btn btn-s" style="padding:5px 12px;font-size:12px" onclick="toggleReplyForm('${m.id}')">取消</button>
            <button class="btn btn-p" style="padding:5px 14px;font-size:12px" onclick="submitReply('${m.id}')">发送</button>
          </div>
        </div>
      </div>
      ${repliesHtml}
    </div>
  </div>`;
}

function buildReplyCard(r){
  const name=r.name||'匿名';
  const avHtml=buildAvatar(r.avatar||'', name.slice(0,1).toUpperCase(), 30);
  return `<div class="reply-card">
    <div class="reply-avatar">${avHtml}</div>
    <div class="reply-body">
      <div class="reply-meta"><span class="reply-name">${esc(name)}</span><span>${r.time||''}</span></div>
      <div class="reply-text">${esc(r.content)}</div>
    </div>
  </div>`;
}

function buildAvatar(avatarData, initials, size){
  if(avatarData&&avatarData.startsWith('data:')){
    return `<img src="${avatarData}" alt="" style="width:${size}px;height:${size}px;object-fit:cover;border-radius:50%" onerror="this.style.display='none'">`;
  } else if(defaultAvatarUrl){
    return `<img src="${defaultAvatarUrl}" alt="" style="width:${size}px;height:${size}px;object-fit:cover">`;
  }
  return initials;
}

function toggleReplyForm(msgId){
  const rf=document.getElementById('rf-'+msgId);
  rf.classList.toggle('open');
  if(rf.classList.contains('open')) document.getElementById('rt-'+msgId).focus();
}

async function submitReply(msgId){
  const content=document.getElementById('rt-'+msgId).value.trim();
  if(!content){toast('请输入回复内容');return;}
  const name=document.getElementById('rn-'+msgId).value||'匿名';
  const res=await fetch('/api/messages/'+msgId+'/reply',{method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name,content})});
  if(res.ok){
    // Reload messages to reflect new reply
    await loadMessages();
    toast('回复已提交 ✓');
  } else toast('提交失败，请重试');
}

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// 监听首页配色实时同步

// ── 配色方案 ──
const THEME_COLORS={warm:'#c8a97e',cool:'#4a90d9',dark:'#7c6af5',green:'#4a9460',rose:'#d4607a'};
function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  localStorage.setItem('g_theme',t);
  const btn=document.getElementById('themeBtn');
  if(btn) btn.style.background=THEME_COLORS[t]||'#c8a97e';
  document.querySelectorAll('.swatch').forEach(s=>s.classList.toggle('active',s.dataset.t===t));
}
function togglePicker(){document.getElementById('themePop').classList.toggle('open');}
document.addEventListener('click',e=>{
  if(!e.target.closest('.theme-trigger')&&!e.target.closest('.theme-popup')){
    const pop=document.getElementById('themePop');
    if(pop) pop.classList.remove('open');
  }
});
// 实时监听其他页面的主题变化
window.addEventListener('storage',e=>{
  if(e.key==='g_theme'&&e.newValue) applyTheme(e.newValue);
});

// 初始化主题
applyTheme(localStorage.getItem('g_theme')||'warm');
