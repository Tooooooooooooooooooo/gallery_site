<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>管理员登录 · GALLERY</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans SC',system-ui,sans-serif;background:#0f0f13;display:flex;align-items:center;justify-content:center;min-height:100vh}
.card{background:#1a1a22;border:1px solid #2e2e3e;border-radius:20px;padding:44px 40px;width:380px;transition:all .3s}
.logo{font-size:22px;font-weight:600;letter-spacing:.15em;color:#c8a97e;text-align:center;margin-bottom:8px}
.sub{text-align:center;color:#6b6880;font-size:13px;margin-bottom:28px}
label{display:block;font-size:11px;color:#6b6880;letter-spacing:.05em;margin-bottom:5px}
input{width:100%;padding:10px 14px;background:#22222e;border:1px solid #2e2e3e;border-radius:8px;color:#e8e6f0;font-family:inherit;font-size:14px;outline:none;margin-bottom:14px;transition:border-color .2s}
input:focus{border-color:#c8a97e}
.msg{font-size:12px;margin-bottom:12px;padding:8px 12px;border-radius:6px;display:none}
.msg.err{color:#e05c5c;background:rgba(224,92,92,.08);border:1px solid rgba(224,92,92,.2)}
.msg.ok{color:#5cb85c;background:rgba(92,184,92,.08);border:1px solid rgba(92,184,92,.2)}
button{width:100%;padding:11px;background:#c8a97e;color:#1a0f00;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .2s;margin-top:2px}
button:hover{background:#d4b890}
button:disabled{opacity:.6;cursor:not-allowed}
.link{text-align:center;margin-top:16px;font-size:12px;color:#6b6880}
.link a{color:#c8a97e;cursor:pointer;text-decoration:none}
.link a:hover{text-decoration:underline}
.step{display:none}
.step.active{display:block}
.code-row{display:flex;gap:8px;margin-bottom:14px}
.code-row input{flex:1;margin-bottom:0;letter-spacing:8px;font-size:20px;font-weight:600;text-align:center}
.code-row button{width:auto;padding:10px 14px;font-size:12px;white-space:nowrap;flex-shrink:0;margin-top:0}
.back{background:transparent;border:1px solid #2e2e3e;color:#6b6880;margin-top:8px}
.back:hover{background:#2e2e3e;color:#e8e6f0}
.countdown{font-size:11px;color:#6b6880;text-align:center;margin-top:8px;min-height:18px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">GAL·LERY</div>

  <!-- 步骤1：登录 -->
  <div class="step active" id="step-login">
    <div class="sub">管理后台登录</div>
    <div class="msg err" id="loginErr"></div>
    <label>用户名</label>
    <input type="text" id="u" placeholder="admin" autocomplete="username">
    <label>密码</label>
    <input type="password" id="p" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
    <button id="loginBtn" onclick="login()">登 录</button>
    <div class="link"><a onclick="goReset()">忘记密码？</a></div>
  </div>

  <!-- 步骤2：输入用户名发送验证码 -->
  <div class="step" id="step-send">
    <div class="sub">密码找回 · 发送验证码</div>
    <div class="msg err" id="sendErr"></div>
    <div class="msg ok" id="sendOk"></div>
    <label>用户名</label>
    <input type="text" id="resetUser" placeholder="输入管理员用户名">
    <button id="sendBtn" onclick="sendCode()">发送验证码到邮箱</button>
    <button class="back" onclick="goLogin()">← 返回登录</button>
  </div>

  <!-- 步骤3：验证码 + 新密码 -->
  <div class="step" id="step-verify">
    <div class="sub">密码找回 · 验证并重置</div>
    <div class="msg err" id="verifyErr"></div>
    <div class="msg ok" id="verifyOk"></div>
    <label>验证码（已发送至 <span id="maskedEmail" style="color:#c8a97e"></span>）</label>
    <div class="code-row">
      <input type="text" id="resetCode" placeholder="000000" maxlength="6" inputmode="numeric">
      <button id="resendBtn" onclick="resendCode()" style="background:#2e2e3e;color:#c8a97e;font-size:11px">重新发送</button>
    </div>
    <div class="countdown" id="countdown"></div>
    <label style="margin-top:8px">新密码</label>
    <input type="password" id="newPw" placeholder="至少6位">
    <label>确认新密码</label>
    <input type="password" id="newPw2" placeholder="再次输入">
    <button id="verifyBtn" onclick="doReset()">重置密码</button>
    <button class="back" onclick="goLogin()">← 返回登录</button>
  </div>
</div>

<script>
let _countdownTimer=null, _countdownSec=0, _resetUsername='';

function showMsg(id,text,type='err'){
  const el=document.getElementById(id);
  el.textContent=text; el.className='msg '+type; el.style.display='block';
}
function clearMsg(...ids){ ids.forEach(id=>{const el=document.getElementById(id);if(el){el.style.display='none';el.textContent='';}}); }

function goStep(name){
  document.querySelectorAll('.step').forEach(s=>s.classList.remove('active'));
  document.getElementById('step-'+name).classList.add('active');
}
function goLogin(){ goStep('login'); clearMsg('loginErr'); }
function goReset(){ goStep('send'); clearMsg('sendErr','sendOk'); document.getElementById('resetUser').value=''; }

// ── 登录 ──
async function login(){
  const btn=document.getElementById('loginBtn');
  clearMsg('loginErr'); btn.disabled=true; btn.textContent='登录中...';
  const res=await fetch('/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({username:document.getElementById('u').value,password:document.getElementById('p').value})});
  if(res.ok){ window.location='/admin'; return; }
  const d=await res.json();
  showMsg('loginErr', d.error||'登录失败');
  btn.disabled=false; btn.textContent='登 录';
}

// ── 发送验证码 ──
async function sendCode(){
  const user=document.getElementById('resetUser').value.trim();
  if(!user){ showMsg('sendErr','请输入用户名'); return; }
  _resetUsername=user;
  const btn=document.getElementById('sendBtn');
  clearMsg('sendErr','sendOk'); btn.disabled=true; btn.textContent='发送中...';
  const res=await fetch('/admin/reset/send',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({username:user})});
  const d=await res.json();
  btn.disabled=false; btn.textContent='发送验证码到邮箱';
  if(d.success){
    document.getElementById('maskedEmail').textContent=d.masked;
    clearMsg('verifyErr','verifyOk');
    goStep('verify');
    startCountdown(60);
  } else {
    showMsg('sendErr', d.error||'发送失败');
  }
}

// ── 重新发送 ──
async function resendCode(){
  if(_countdownSec>0) return;
  const btn=document.getElementById('resendBtn');
  btn.disabled=true; btn.textContent='发送中...';
  clearMsg('verifyErr','verifyOk');
  const res=await fetch('/admin/reset/send',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({username:_resetUsername})});
  const d=await res.json();
  btn.disabled=false; btn.textContent='重新发送';
  if(d.success){ showMsg('verifyOk','验证码已重新发送','ok'); startCountdown(60); }
  else showMsg('verifyErr', d.error||'发送失败');
}

// ── 倒计时 ──
function startCountdown(sec){
  _countdownSec=sec;
  clearInterval(_countdownTimer);
  const el=document.getElementById('countdown');
  const rb=document.getElementById('resendBtn');
  rb.disabled=true;
  _countdownTimer=setInterval(()=>{
    _countdownSec--;
    el.textContent=_countdownSec>0?`${_countdownSec}秒后可重新发送`:'';
    if(_countdownSec<=0){ clearInterval(_countdownTimer); rb.disabled=false; }
  },1000);
}

// ── 验证并重置 ──
async function doReset(){
  const code=document.getElementById('resetCode').value.trim();
  const np=document.getElementById('newPw').value;
  const np2=document.getElementById('newPw2').value;
  clearMsg('verifyErr','verifyOk');
  if(code.length!==6){ showMsg('verifyErr','请输入6位验证码'); return; }
  if(np.length<6){ showMsg('verifyErr','新密码不能少于6位'); return; }
  if(np!==np2){ showMsg('verifyErr','两次密码不一致'); return; }
  const btn=document.getElementById('verifyBtn');
  btn.disabled=true; btn.textContent='重置中...';
  const res=await fetch('/admin/reset/verify',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({username:_resetUsername,code,new_password:np})});
  const d=await res.json();
  btn.disabled=false; btn.textContent='重置密码';
  if(d.success){
    showMsg('verifyOk','密码已重置，即将跳转登录...','ok');
    setTimeout(()=>goLogin(),2000);
  } else {
    showMsg('verifyErr', d.error||'重置失败');
  }
}
</script>
</body>
</html>
