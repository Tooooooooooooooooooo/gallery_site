<svg viewBox="0 0 250 200" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* 神圣光晕呼吸动画 - 控制在画布内 */
    @keyframes divinePulse {
      0% { opacity: 0.3; transform: scale(0.95); }
      50% { opacity: 1; transform: scale(1.1); }
      100% { opacity: 0.3; transform: scale(0.95); }
    }
    .divine-glow {
      animation: divinePulse 4s infinite ease-in-out;
      transform-origin: center;
    }
  </style>

  <!-- 背景透明 -->

  <!-- 神圣金色光效 - 全部控制在250×200画布内 -->
  <g class="divine-glow">
    <!-- 最外层光圈 - 最大半径控制在100以内（画布边缘为125） -->
    <circle cx="120" cy="100" r="95" fill="none" stroke="#ffd966" stroke-width="3" stroke-opacity="0.25" />
    <circle cx="120" cy="100" r="85" fill="none" stroke="#ffcc66" stroke-width="2.5" stroke-opacity="0.35" />
    <circle cx="120" cy="100" r="75" fill="none" stroke="#ffb347" stroke-width="2" stroke-opacity="0.45" />
    <circle cx="120" cy="100" r="65" fill="none" stroke="#ffaa33" stroke-width="1.5" stroke-opacity="0.55" />
    
    <!-- 内层金光 -->
    <circle cx="120" cy="100" r="55" fill="none" stroke="#ffd700" stroke-width="2" stroke-opacity="0.65" />
    <circle cx="120" cy="100" r="48" fill="none" stroke="#fff2cc" stroke-width="1" stroke-opacity="0.75" />
    
    <!-- 实心光晕层 - 增加光芒厚度 -->
    <circle cx="120" cy="100" r="42" fill="none" stroke="#ffdd55" stroke-width="6" stroke-opacity="0.3" />
  </g>

  <!-- 放射状光芒线条 - 全部端点控制在画布内 -->
  <g stroke="#ffcc00" stroke-width="1" stroke-opacity="0.25">
    <!-- 所有线条终点都在画布边界内 (20-230, 10-190) -->
    <line x1="120" y1="100" x2="40" y2="25" />
    <line x1="120" y1="100" x2="210" y2="25" />
    <line x1="120" y1="100" x2="40" y2="175" />
    <line x1="120" y1="100" x2="210" y2="175" />
    <line x1="120" y1="100" x2="20" y2="100" />
    <line x1="120" y1="100" x2="230" y2="100" />
    <line x1="120" y1="100" x2="70" y2="35" />
    <line x1="120" y1="100" x2="170" y2="35" />
    <line x1="120" y1="100" x2="70" y2="165" />
    <line x1="120" y1="100" x2="170" y2="165" />
  </g>
  
  <!-- 第二层放射线 - 稍短一些 -->
  <g stroke="#ffaa00" stroke-width="0.8" stroke-opacity="0.2">
    <line x1="120" y1="100" x2="55" y2="45" />
    <line x1="120" y1="100" x2="185" y2="45" />
    <line x1="120" y1="100" x2="55" y2="155" />
    <line x1="120" y1="100" x2="185" y2="155" />
    <line x1="120" y1="100" x2="120" y2="15" />
    <line x1="120" y1="100" x2="120" y2="185" />
  </g>

  <!-- 木鱼主体 (缩小到80%，居中放置) -->
  <g transform="translate(120, 100) scale(0.8) translate(-120, -100)">
    <path 
      fill="white" 
      opacity="1.00" 
      d=" M 109.12 6.53 C 124.09 4.27 139.37 2.82 154.47 4.79 C 173.07 7.14 191.38 14.02 206.02 25.89 C 217.01 34.77 225.17 46.63 231.55 59.13 C 237.81 72.25 241.16 86.53 243.92 100.74 C 225.49 104.75 206.58 105.76 187.77 106.20 C 186.21 100.02 183.12 93.94 177.74 90.25 C 172.00 85.96 163.98 84.19 157.26 87.18 C 145.99 91.69 139.62 105.22 142.63 116.85 C 145.12 127.39 154.97 136.11 166.05 135.69 C 176.18 134.97 184.61 126.81 187.19 117.22 C 192.74 116.73 198.32 116.63 203.89 116.32 C 217.57 115.26 231.14 113.14 244.82 111.98 C 245.52 121.28 246.13 130.75 244.11 139.94 C 242.32 149.02 239.23 158.07 233.39 165.39 C 224.88 176.55 212.15 183.64 199.01 187.98 C 187.42 191.86 175.20 193.41 163.05 194.29 C 140.40 195.87 117.64 195.62 94.99 194.19 C 74.79 192.81 54.55 190.78 34.79 186.17 C 27.91 184.54 21.07 182.47 14.77 179.21 C 8.58 175.93 4.23 169.71 2.72 162.92 C -0.48 151.41 3.00 139.09 9.20 129.21 C 14.61 119.75 27.61 116.88 30.81 105.83 C 35.50 90.01 37.28 73.40 42.87 57.82 C 47.56 45.36 54.34 33.26 64.82 24.75 C 77.25 14.19 93.24 9.04 109.12 6.53 Z"
    />
  </g>

  <!-- 金色微粒 - 全部控制在画布边界内 -->
  <g fill="gold" opacity="0.25">
    <circle cx="35" cy="30" r="2.5" />
    <circle cx="215" cy="35" r="3" />
    <circle cx="225" cy="165" r="2.5" />
    <circle cx="30" cy="170" r="2.5" />
    <circle cx="80" cy="15" r="2" />
    <circle cx="200" cy="55" r="2.5" />
    <circle cx="190" cy="185" r="3" />
    <circle cx="55" cy="185" r="2" />
  </g>
</svg>